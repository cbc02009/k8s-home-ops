---
# Static configuration (mounted by ../docker-compose.yaml).
# The file provider reads ./dynamic (mounted at /dynamic) for extra routers; none
# are defined here yet - the workload routers live as labels on the zigbee/zwave
# stacks. No dashboard router on purpose: traefik.cnas.dev belongs to the truenas
# box (this instance's dashboard would collide with it).
api:
  dashboard: true
accesslog: {}
log:
  level: INFO
entryPoints:
  http:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: https
          scheme: https
  https:
    address: ":443"
providers:
  docker:
    # The shared bridge network the other stacks join; container names on it are
    # what the Host(...) routers below resolve to.
    network: app
    endpoint: "unix:///var/run/docker.sock"
    exposedByDefault: false
  file:
    directory: /dynamic
certificatesResolvers:
  cloudflare:
    acme:
      storage: /certs/acme.json
      caServer: https://acme-v02.api.letsencrypt.org/directory
      dnsChallenge:
        # Cloudflare API (CF_DNS_API_TOKEN in the environment, from the instance
        # external_secrets). DNS-01 writes the TXT record in the cnas.dev zone, so
        # the challenge works even before 443 is reachable on the Pi.
        provider: cloudflare
        delayBeforeCheck: 2s
        resolvers:
          - 1.1.1.1:53
tls:
  stores:
    default:
      # Wildcard for *.cnas.dev, served for any matching SNI - the zigbee.cnas.dev
      # and zwave.cnas.dev routers enable plain `tls` and pick it up this way.
      defaultGeneratedCert:
        resolver: cloudflare
        domain:
          main: cnas.dev
          sans:
            - "*.cnas.dev"
