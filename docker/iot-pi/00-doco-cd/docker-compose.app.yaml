---
# This file is not managed by doco-cd because it can't manage itself
# Instead it is deployed manually on the Pi (docker compose up -d)
# doco-cd needs a 1Password service-account token file
# (/root/.config/doco-cd/1pw_token, mounted below) to resolve the
# external_secrets map in .doco-cd.yaml - the Cloudflare DNS token 01-traefik
# uses for its Let's Encrypt DNS-01 challenge. Same service account as the
# truenas instance (/mnt/smoltank/apps/doco-cd/secrets/1pw_token);
# setup-doco-cd.sh preflights the file and aborts if it is missing.
configs:
  poll-config.yml:
    content: |
      - interval: 3600
        url: https://github.com/cbc02009/k8s-home-ops.git
secrets:
  1pw_token:
    file: /root/.config/doco-cd/1pw_token
services:
  app:
    configs:
      - source: poll-config.yml
        target: /poll-config.yml
    secrets:
      - 1pw_token
    container_name: doco-cd
    environment:
      HTTP_PORT: 7789
      LOG_LEVEL: info
      POLL_CONFIG_FILE: /poll-config.yml
      DEPLOY_CONFIG_BASE_DIR: ./docker/iot-pi/
      SECRET_PROVIDER: 1password
      SECRET_PROVIDER_ACCESS_TOKEN_FILE: /run/secrets/1pw_token
    healthcheck:
      test:
        - CMD
        - /doco-cd
        - healthcheck
      start_period: 15s
      interval: 30s
      timeout: 5s
      retries: 3
    image: ghcr.io/kimdre/doco-cd:0.135.0@sha256:6444b32739a22531e3448304faca9d0f5ceb89b4723b083efd6fab40e9a28207
    ports:
      - 7789:7789
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - data:/data
volumes:
  data:
