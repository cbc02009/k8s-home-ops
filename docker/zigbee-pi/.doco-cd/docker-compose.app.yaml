---
# This file is not managed by doco-cd because it can't manage itself
# Instead it is deployed manually on the Pi (docker compose up -d)
# NOTE: no SECRET_PROVIDER here - this instance has no external_secrets.
# If op:// refs are added to .doco-cd.yaml, mirror the secret-provider setup
# from docker/truenas/.doco-cd/docker-compose.app.yaml.
configs:
  poll-config.yml:
    content: |
      - interval: 3600
        url: https://github.com/cbc02009/k8s-home-ops.git
services:
  app:
    configs:
      - source: poll-config.yml
        target: /poll-config.yml
    container_name: doco-cd
    environment:
      HTTP_PORT: 7789
      LOG_LEVEL: info
      POLL_CONFIG_FILE: /poll-config.yml
      DEPLOY_CONFIG_BASE_DIR: ./docker/zigbee-pi/
    healthcheck:
      test:
        - CMD
        - /doco-cd
        - healthcheck
      start_period: 15s
      interval: 30s
      timeout: 5s
      retries: 3
    image: ghcr.io/kimdre/doco-cd:0.133.2@sha256:8ca3cf6701f70ac3af4c5d726e542fe3a854a038149375f87222ec2719b3c975
    ports:
      - 7789:7789
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - data:/data
volumes:
  data: {}
