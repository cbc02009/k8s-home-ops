---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kopiur.home-operations.com/restore_v1alpha1.json
apiVersion: kopiur.home-operations.com/v1alpha1
kind: Restore
metadata:
  name: ${APP}
spec:
  mover:
    securityContext:
      runAsUser: ${APP_UID:=2000}
      runAsGroup: ${APP_GID:=2000}
  policy:
    onMissingSnapshot: Continue
  repository:
    kind: ClusterRepository
    name: volsync
  source:
    # fromPolicy:
    #   name: ${APP}
    #   offset: 0
    identity:
      username: ${APP}
      hostname: ${OLD_NS:=default}
      sourcePath: /data
      asOf: "2026-08-28T23:30:00Z"
  target:
    populator: {}
