---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app libation
spec:
  chartRef:
    kind: OCIRepository
    name: *app
  interval: 1h
  values:
    controllers:
      libation:
        annotations:
          reloader.stakater.com/auto: 'true'

        initContainers:
          01-init-db:
            image:
              repository: ghcr.io/home-operations/postgres-init
              tag: '18.4.0'
            envFrom: &envFrom
              - secretRef:
                  name: *app

        pod:
          securityContext:
            runAsUser: 2000
            runAsGroup: 2000
            fsGroup: 2000
            fsGroupChangePolicy: OnRootMismatch

        containers:
          app:
            image:
              repository: rmcrackan/libation
              tag: 13.7.4@sha256:842cb13f917cb5738bdab018dcb19157cf7b8714392c27e894a2e3b0cdd4121f
            env:
              SLEEP_TIME: "30m"  # Scan every 30 minutes
              LIBATION_BOOKS_DIR: "/audiobooks"
              LIBATION_CONFIG_DIR: "/config"
            envFrom: *envFrom
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: false
              capabilities:
                drop:
                  - ALL
            resources:
              requests:
                cpu: 10m
                memory: 256Mi
              limits:
                memory: 5Gi

    persistence:
      config:
        existingClaim: *app
      # accounts-settings:
      #   enabled: true
      #   type: secret
      #   name: libation-secret
      #   advancedMounts:
      #     libation:
      #       app:
      #         - path: /config/AccountsSettings.json
      #           subPath: AccountsSettings.json
      #           readOnly: true
      settings:
        enabled: true
        type: configMap
        name: libation-config
        advancedMounts:
          libation:
            app:
              - path: /config/Settings.json
                subPath: Settings.json
                readOnly: true
      media:
        enabled: true
        type: nfs
        server: shana.ctec.internal
        path: /mnt/tank/media/grimmory/library/audiobooks
        globalMounts:
          - path: /audiobooks
