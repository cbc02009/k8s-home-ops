---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./helmrelease.yaml
  - ./ocirepository.yaml
patches:
  - target:
      kind: DaemonSet
      namespace: observability
      labelSelector: app.kubernetes.io/name=vector
    patch: |-
      apiVersion: apps/v1
      kind: DaemonSet
      metadata:
        name: not-used
        namespace: observability
      spec:
        template:
          spec:
            tolerations:
              - key: llm-workload
                operator: Exists
                effect: NoSchedule
