---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/monitoring.coreos.com/alertmanagerconfig_v1alpha1.json
apiVersion: monitoring.coreos.com/v1alpha1
kind: AlertmanagerConfig
metadata:
  name: alertmanager
spec:
  route:
    groupBy:
      - "alertname"
      - "job"
    groupInterval: 10m
    groupWait: 1m
    receiver: discord
    # receiver: "null"
    repeatInterval: 12h
    routes:
      - receiver: "null"
        matchers:
          - name: alertname
            value: Watchdog
            matchType: =
      - receiver: "null"
        matchers:
          - name: alertname
            value: InfoInhibitor
            matchType: =
      - receiver: "null"
        matchers:
          - name: alertname
            value: SwarmUIActive
            matchType: =
      - receiver: discord
      # - receiver: "null"
        matchers:
          - name: severity
            value: critical
            matchType: =
  inhibitRules:
    - equal:
        - "alertname"
        - "namespace"
      sourceMatch:
        - name: severity
          value: critical
          matchType: =
      targetMatch:
        - name: severity
          value: warning
          matchType: =
    # A SwarmUI session preempts qwen3.8-27b off mayne's dGPU, so its
    # deployment/pod down-alerts are expected for the length of the session.
    # Inhibit the 27B down-family while the SwarmUIActive sentinel is firing;
    # when SwarmUI is parked (replicas 0) the sentinel resolves and genuine
    # 27B outages alert normally.
    - sourceMatch:
        - name: alertname
          value: SwarmUIActive
          matchType: =
      targetMatch:
        - name: namespace
          value: llm
          matchType: =
        - name: deployment
          value: qwen3.8-27b
          matchType: =
        - name: alertname
          value: KubeDeploymentReplicasMismatch|KubeDeploymentRolloutStuck
          matchType: =~
    - sourceMatch:
        - name: alertname
          value: SwarmUIActive
          matchType: =
      targetMatch:
        - name: namespace
          value: llm
          matchType: =
        - name: pod
          value: qwen3\.8-27b-.*
          matchType: =~
        - name: alertname
          value: KubePodNotReady|KubePodPending|KubeContainerWaiting
          matchType: =~
  receivers:
    - name: "null"
    - name: "discord"
      discordConfigs:
        - apiURL:
            key: DISCORD_WEBHOOK
            name: alertmanager
