---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &app coder
spec:
  refreshInterval: 1h0m0s
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    creationPolicy: Owner
    deletionPolicy: Retain
    name: *app
    template:
      data:
        # Postgres Init
        INIT_POSTGRES_DBNAME: coder
        INIT_POSTGRES_HOST: "postgres-ai-rw.databases.svc.cluster.local"
        INIT_POSTGRES_SUPER_PASS: "{{ .postgres_super_pass }}"
        INIT_POSTGRES_USER: "{{ .pg_user }}"
        INIT_POSTGRES_PASS: "{{ .pg_pass }}"
        # Coder
        CODER_PG_CONNECTION_URL: "postgresql://{{ .pg_user }}:{{ .pg_pass }}@postgres-ai-rw.databases.svc.cluster.local/coder"
        # OIDC (authentik application "Coder")
        CODER_OIDC_CLIENT_ID: "{{ .oidc_id }}"
        CODER_OIDC_CLIENT_SECRET: "{{ .oidc_secret }}"
      engineVersion: v2
      mergePolicy: Replace
  dataFrom:
    - extract:
        key: postgres
      rewrite:
        - regexp:
            source: "(.*)"
            target: "postgres_$1"
    - extract:
        key: coder
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
# The "opencode" memini API key (shared namespace with local opencode and the
# cluster opencode agent). Mounted into Coder workspace pods by the kubernetes
# template so the workspace's opencode uses the same memory pool.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: memini-key-opencode
spec:
  refreshInterval: 1h0m0s
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    creationPolicy: Owner
    deletionPolicy: Retain
    name: memini-key-opencode
    template:
      data:
        api-key: "{{ .opencode_api_key }}"
      engineVersion: v2
      mergePolicy: Replace
  dataFrom:
    - extract:
        key: memini
