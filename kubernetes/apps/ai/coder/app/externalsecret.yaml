# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &app coder
spec:
  refreshInterval: 1h0m0s
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    creationPolicy: Owner
    deletionPolicy: Retain
    name: *app
    template:
      data:
        # Postgres Init
        INIT_POSTGRES_DBNAME: coder
        INIT_POSTGRES_HOST: "{{ .postgres_host }}"
        INIT_POSTGRES_SUPER_PASS: "{{ .postgres_super_pass }}"
        INIT_POSTGRES_USER: "{{ .pg_user }}"
        INIT_POSTGRES_PASS: "{{ .pg_pass }}"
        # Coder
        CODER_PG_CONNECTION_URL: "postgresql://{{ .pg_user }}:{{ .pg_pass }}@postgres-ai-rw.databases.svc.cluster.local/coder"
      engineVersion: v2
      mergePolicy: Replace
  dataFrom:
    - extract:
        key: postgres
      rewrite:
        - regexp:
            source: "(.*)"
            target: "postgres_$1"
    - extract:
        key: coder
