---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/litellm.home-operations.com/litellmvirtualkey_v1alpha1.json
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMVirtualKey
metadata:
  name: coder
spec:
  proxyRef: litellm
  keyAlias: Coder
  secretName: litellm-key-coder
  secretKey: api-key
  models:
  - free-pool
  - implementation-pool
  - muse-glimmer
  - qwen3.8-27b
  - qwen3.8-27b-chat
---
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: coder
spec:
  secretStoreRefs:
  - name: onepassword-connect
    kind: ClusterSecretStore
  selector:
    secret:
      name: litellm-key-coder
  data:
  - match:
      secretKey: api-key
      remoteRef:
        remoteKey: litellm
        property: coder_api_key
