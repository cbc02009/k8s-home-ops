---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/litellm.home-operations.com/litellmmodel_v1alpha1.json
# Stable "any local model" lane: the always-resident qwen3.8-27b vLLM rung
# (the nvidia ModelPool default). The former strata flash-next fallback was
# decommissioned — the pool can no longer evict the 27B, and vision requests
# should use the go-chat cloud lane instead.
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMModel
metadata:
  name: local-pool-27b
  labels:
    litellm.home-operations.com/managed-by: flux
spec:
  modelName: local-pool
  proxyRef: litellm
  params:
    model: openai/qwen3.8-27b
    apiBase: http://nvidia-router-proxy.ai.svc.cluster.local:8080/v1
    apiKey: sk-llmkube-noauth
    additional:
      max_parallel_requests: 10
      reasoning_effort: medium
      order: 1
      allowed_openai_params:
        - reasoning_effort
  info:
    mode: chat
    # maxInputTokens: 147456
    maxOutputTokens: 24576
    supportsFunctionCalling: true
    supportsVision: false
    extra:
      input_cost_per_token: 6.2e-08
      output_cost_per_token: 1.35e-06
      cache_read_input_token_cost: 0.0
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/litellm.home-operations.com/litellmmodel_v1alpha1.json
# Chat-tuned local lane: low temperature, no forced reasoning.
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMModel
metadata:
  name: local-pool-chat-27b
  labels:
    litellm.home-operations.com/managed-by: flux
spec:
  modelName: local-pool-chat
  proxyRef: litellm
  params:
    model: openai/qwen3.8-27b
    apiBase: http://nvidia-router-proxy.ai.svc.cluster.local:8080/v1
    apiKey: sk-llmkube-noauth
    additional:
      temperature: 0.7
      top_p: 0.8
      presence_penalty: 1.5
      reasoning_effort: none
      order: 1
      allowed_openai_params:
        - reasoning_effort
  info:
    mode: chat
    # maxInputTokens: 147456
    maxOutputTokens: 16384
    supportsFunctionCalling: true
    supportsVision: false
    extra:
      input_cost_per_token: 6.2e-08
      output_cost_per_token: 1.35e-06
      cache_read_input_token_cost: 0.0
