---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/litellm.home-operations.com/litellmmodel_v1alpha1.json
# Stable "any local model" lane. Strata is tried first because it is faster,
# has 256k context and supports vision; when it is asleep (scale 0) LiteLLM
# falls back to the always-resident 27B rung after cooldown.
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMModel
metadata:
  name: local-pool-strata
  labels:
    litellm.home-operations.com/managed-by: flux
spec:
  modelName: local-pool
  proxyRef: litellm
  params:
    model: openai/qwen3.8-flash-next-iq3_s
    apiBase: http://strata-fn.ai.svc.cluster.local:8080/v1
    apiKey: sk-llmkube-noauth
    additional:
      temperature: 1.0
      top_p: 0.95
      top_k: 20
      min_p: 0
      order: 1
      max_parallel_requests: 3
  info:
    mode: chat
    maxInputTokens: 245760
    maxOutputTokens: 65536
    supportsFunctionCalling: true
    supportsVision: true
    extra:
      input_cost_per_token: 6.2e-08
      output_cost_per_token: 1.35e-06
      cache_read_input_token_cost: 0.0
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/litellm.home-operations.com/litellmmodel_v1alpha1.json
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMModel
metadata:
  name: local-pool-27b
  labels:
    litellm.home-operations.com/managed-by: flux
spec:
  modelName: local-pool
  proxyRef: litellm
  params:
    model: openai/qwen3.8-27b
    apiBase: http://nvidia-router-proxy.ai.svc.cluster.local:8080/v1
    apiKey: sk-llmkube-noauth
    additional:
      max_parallel_requests: 10
      reasoning_effort: medium
      order: 2
      allowed_openai_params:
        - reasoning_effort
  info:
    mode: chat
    # maxInputTokens: 147456
    maxOutputTokens: 24576
    supportsFunctionCalling: true
    supportsVision: false
    extra:
      input_cost_per_token: 6.2e-08
      output_cost_per_token: 1.35e-06
      cache_read_input_token_cost: 0.0
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/litellm.home-operations.com/litellmmodel_v1alpha1.json
# Chat-tuned local lane: low temperature, no forced reasoning.
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMModel
metadata:
  name: local-pool-chat-strata
  labels:
    litellm.home-operations.com/managed-by: flux
spec:
  modelName: local-pool-chat
  proxyRef: litellm
  params:
    model: openai/qwen3.8-flash-next-iq3_s
    apiBase: http://strata-fn.ai.svc.cluster.local:8080/v1
    apiKey: sk-llmkube-noauth
    additional:
      temperature: 0.7
      top_p: 0.8
      presence_penalty: 1.5
      order: 1
      max_parallel_requests: 3
  info:
    mode: chat
    maxInputTokens: 245760
    maxOutputTokens: 65536
    supportsFunctionCalling: true
    supportsVision: true
    extra:
      input_cost_per_token: 6.2e-08
      output_cost_per_token: 1.35e-06
      cache_read_input_token_cost: 0.0
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/litellm.home-operations.com/litellmmodel_v1alpha1.json
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMModel
metadata:
  name: local-pool-chat-27b
  labels:
    litellm.home-operations.com/managed-by: flux
spec:
  modelName: local-pool-chat
  proxyRef: litellm
  params:
    model: openai/qwen3.8-27b
    apiBase: http://nvidia-router-proxy.ai.svc.cluster.local:8080/v1
    apiKey: sk-llmkube-noauth
    additional:
      temperature: 0.7
      top_p: 0.8
      presence_penalty: 1.5
      reasoning_effort: none
      order: 2
      allowed_openai_params:
        - reasoning_effort
  info:
    mode: chat
    # maxInputTokens: 147456
    maxOutputTokens: 16384
    supportsFunctionCalling: true
    supportsVision: false
    extra:
      input_cost_per_token: 6.2e-08
      output_cost_per_token: 1.35e-06
      cache_read_input_token_cost: 0.0
