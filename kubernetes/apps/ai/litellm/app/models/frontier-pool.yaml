---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/litellm.home-operations.com/litellmmodel_v1alpha1.json
# Frontier lane: the two Go flagship models, both 1M context and $15/mo
# allowance. Use sparingly; max_parallel is kept at 1 to ration them.
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMModel
metadata:
  name: frontier-pool-qwen3.8-max
  labels:
    litellm.home-operations.com/managed-by: flux
spec:
  modelName: frontier-pool
  proxyRef: litellm
  params:
    model: opencode_go/qwen3.8-max
    apiKey: os.environ/OPENCODE_GO_API_KEY
    additional:
      order: 1
      max_parallel_requests: 1
  info:
    mode: chat
    maxInputTokens: 1000000
    maxOutputTokens: 131072
    supportsFunctionCalling: true
    supportsVision: true
    supportsPromptCaching: true
    extra:
      input_cost_per_token: 2e-06
      output_cost_per_token: 6e-06
      cache_read_input_token_cost: 2.5e-07
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/litellm.home-operations.com/litellmmodel_v1alpha1.json
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMModel
metadata:
  name: frontier-pool-kimi-k3.1-pro
  labels:
    litellm.home-operations.com/managed-by: flux
spec:
  modelName: frontier-pool
  proxyRef: litellm
  params:
    model: opencode_go/kimi-k3.1-pro
    apiKey: os.environ/OPENCODE_GO_API_KEY
    additional:
      order: 2
      max_parallel_requests: 1
  info:
    mode: chat
    maxInputTokens: 1048576
    maxOutputTokens: 131072
    supportsFunctionCalling: true
    supportsVision: true
    supportsPromptCaching: true
    extra:
      input_cost_per_token: 2e-06
      output_cost_per_token: 1e-05
      cache_read_input_token_cost: 2e-07
