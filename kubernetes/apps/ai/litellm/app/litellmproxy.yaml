---
# yaml-langauge-server $schema=https://k8s-schemas.home-operations.com/litellm.home-operations.com/litellmproxy_v1alpha1.json
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMProxy
metadata:
  name: litellm
spec:
  applyMode: file
  # Overlay image built by cbc02009/container-images (apps/litellm): upstream
  # v1.109.0-rc.1 (first build carrying the opencode_go provider) + the
  # get_model_response_iterator_for_request override on
  # OpenCodeGoMessagesChatConfig. Without it, OpenAI-wire streaming to
  # /v1/messages-protocol Go models (minimax-m3, qwen3.8-max,
  # claude-haiku-5-5) dies mid-stream with 'NoneType' object is not an
  # iterator → APIConnectionError 500 (LiteLLMModelFailover alerts). Drop the
  # overlay once the fix ships upstream; Renovate tracks the base version in
  # container-images and proposes the :rolling digest bump here on rebuild.
  image: ghcr.io/cbc02009/litellm:rolling@sha256:8fb51bb31889b651d1749a33b31032564dd152e669258beecbecbf001777d3a8
  replicas: 2
  service:
    port: 4000
    type: ClusterIP
  route:
    hostnames:
      - ${HOSTNAME}
    parentRefs:
      - name: envoy-internal
        namespace: network
        sectionName: https
    filters:
      - type: RequestHeaderModifier
        requestHeaderModifier:
          set:
            - name: x-litellm-session-id
              value: '%REQ(x-session-id)%'
  # OIDC SSO via authentik: the litellm UI login redirects to the `litellm`
  # authentik application (auth.ctec.run). Client credentials come from the
  # litellm 1Password item (oidc_id/oidc_secret) via the ExternalSecret; the
  # litellm_role claim (group-mapped in authentik) sets the UI role:
  # proxy_admin for the litellm-admin group, internal_user otherwise (values
  # must match LiteLLM's LitellmUserRoles enum). AUTO_REDIRECT_UI_LOGIN_TO_SSO
  # skips the login form and bounces visitors straight into authentik.
  env:
    - name: AUTO_REDIRECT_UI_LOGIN_TO_SSO
      value: 'true'
    - name: DATABASE_URL
      valueFrom:
        secretKeyRef:
          name: litellm
          key: DATABASE_URL
    - name: GENERIC_AUTHORIZATION_ENDPOINT
      value: https://auth.ctec.run/application/o/authorize/
    - name: GENERIC_SCOPE
      value: openid email profile litellm_role
    - name: GENERIC_TOKEN_ENDPOINT
      value: https://auth.ctec.run/application/o/token/
    - name: GENERIC_USERINFO_ENDPOINT
      value: https://auth.ctec.run/application/o/userinfo/
    - name: GENERIC_USER_ROLE_ATTRIBUTE
      value: litellm_role
    - name: LITELLM_LOG
      value: INFO
    - name: LITELLM_MODE
      value: PRODUCTION
    # /v1/messages on OpenAI-family deployments defaults to the Responses API
    # (/v1/responses), which the local nvidia-router-proxy (vLLM) does not
    # serve — every auto-router SIMPLE/MEDIUM turn 404'd ('404 page not
    # found'). Route those through chat/completions instead: verified to
    # stream correctly with thinking blocks on the 27B lanes.
    - name: LITELLM_USE_CHAT_COMPLETIONS_URL_FOR_ANTHROPIC_MESSAGES
      value: 'true'
    - name: PROXY_BASE_URL
      value: https://litellm.ctec.run
    - name: PROXY_LOGOUT_URL
      value: https://auth.ctec.run/application/o/end-session/
    - name: REDIS_HOST
      value: litellm-dragonfly-db
    - name: REDIS_PORT
      value: '6379'
  envFrom:
    - secretRef:
        name: litellm
  resources:
    requests:
      cpu: 100m
      memory: 1Gi
    limits:
      memory: 3Gi
  livenessProbe:
    httpGet:
      path: /
      port: 4000
    initialDelaySeconds: 5
    periodSeconds: 10
    failureThreshold: 30
  readinessProbe:
    httpGet:
      path: /
      port: 4000
    initialDelaySeconds: 5
    periodSeconds: 10
    failureThreshold: 3
  volumes:
    - name: cache
      emptyDir: {}
    - name: ui
      persistentVolumeClaim:
        claimName: litellm
  volumeMounts:
    - name: cache
      mountPath: /app/cache
    - name: ui
      mountPath: /app/chatgpt_tokens
  routerSettings:
    redis_host: os.environ/REDIS_HOST
    redis_port: os.environ/REDIS_PORT
    routing_strategy: simple-shuffle
    cooldown_time: 30
    enable_pre_call_checks: true
    fallbacks:
      - auto:
          - qwen3.8-27b
      # Quota fail-down: when a Go lane's 5h/weekly/monthly window runs dry
      # (429 after retries), continue on the cheap go-pool flash rungs
      # instead of stalling the session. The named single-model lanes keep
      # their model as first choice; only the pool floor changes.
      - go-coder:
          - go-pool
      - go-strong:
          - go-pool
      - go-max:
          - go-pool
      - frontier-pool:
          - go-pool
      - reasoning-pool:
          - go-pool
  litellmSettings:
    success_callback:
      - prometheus
    failure_callback:
      - prometheus
    prometheus_adapter: true
    require_auth_for_metrics_endpoint: false
    cache: true
    cache_params:
      type: redis
      host: os.environ/REDIS_HOST
      port: os.environ/REDIS_PORT
      ttl: 300
      supported_call_types:
        - embedding
        - aembedding
    request_timeout: 900
    num_retries: 2
    retry_after: 5
    set_verbose: false
    # Hermes sends agent-level params (e.g. reasoning_effort) to every lane;
    # the opencode_go rungs don't accept them, so those requests 400'd and
    # hermes's COMPLEX turns silently degraded to the local 27B after two
    # failed Go rungs (alert: auto -> reasoning-pool UnsupportedParamsError).
    # Drop unsupported params instead — only affects requests that would
    # otherwise 400; explicitly allowed params (local lanes) still pass.
    drop_params: true
  generalSettings:
    health_check_endpoint: /v1/health
    store_model_in_db: false
  extraConfig:
    environment:
      - REDIS_HOST
      - REDIS_PORT
  apiAccess:
    masterKeyRef:
      name: litellm
      key: LITELLM_MASTER_KEY
