---
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMProxy
metadata:
  name: litellm
spec:
  applyMode: file
  image: ghcr.io/berriai/litellm:v1.104.2@sha256:3d88bd757134a00e8c00237b85a021ab1f6d54abb9c1df750f411dbe7256a500
  replicas: 2
  service:
    port: 4000
    type: ClusterIP
  route:
    hostnames:
      - ${HOSTNAME}
    parentRefs:
      - name: envoy-internal
        namespace: network
        sectionName: https
    filters:
      - type: RequestHeaderModifier
        requestHeaderModifier:
          set:
            - name: x-litellm-session-id
              value: '%REQ(x-session-id)%'
  env:
    - name: DATABASE_URL
      valueFrom:
        secretKeyRef:
          name: litellm
          key: DATABASE_URL
    - name: LITELLM_LOG
      value: INFO
    - name: LITELLM_MODE
      value: PRODUCTION
    - name: REDIS_HOST
      value: litellm-dragonfly-db
    - name: REDIS_PORT
      value: '6379'
  envFrom:
    - secretRef:
        name: litellm
  resources:
    requests:
      cpu: 100m
      memory: 1Gi
    limits:
      memory: 3Gi
  livenessProbe:
    httpGet:
      path: /
      port: 4000
    initialDelaySeconds: 5
    periodSeconds: 10
    failureThreshold: 30
  readinessProbe:
    httpGet:
      path: /
      port: 4000
    initialDelaySeconds: 5
    periodSeconds: 10
    failureThreshold: 3
  volumes:
    - name: cache
      emptyDir: {}
    - name: ui
      persistentVolumeClaim:
        claimName: litellm
  volumeMounts:
    - name: cache
      mountPath: /app/cache
    - name: ui
      mountPath: /app/chatgpt_tokens
  routerSettings:
    redis_host: os.environ/REDIS_HOST
    redis_port: os.environ/REDIS_PORT
    routing_strategy: simple-shuffle
    cooldown_time: 30
    enable_pre_call_checks: true
  litellmSettings:
    success_callback:
      - prometheus
    failure_callback:
      - prometheus
    prometheus_adapter: true
    require_auth_for_metrics_endpoint: false
    cache: true
    cache_params:
      type: redis
      host: os.environ/REDIS_HOST
      port: os.environ/REDIS_PORT
      ttl: 300
      supported_call_types:
        - embedding
        - aembedding
    request_timeout: 900
    num_retries: 2
    retry_after: 5
    set_verbose: false
  generalSettings:
    health_check_endpoint: /v1/health
    store_model_in_db: false
  extraConfig:
    environment:
      - REDIS_HOST
      - REDIS_PORT
  apiAccess:
    masterKeyRef:
      name: litellm
      key: LITELLM_MASTER_KEY
