---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/litellm.home-operations.com/litellmvirtualkey_v1alpha1.json
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMVirtualKey
metadata:
  name: qwencode
spec:
  proxyRef: litellm
  keyAlias: QwenCode
  secretName: litellm-key-qwencode
  secretKey: api-key
  models:
  - qwen3.8-27b
  - strata-fn
  # OpenCode Go cloud lanes for agent work that outgrows the local rungs.
  - go-pool
  - go-coder
  - go-strong
  - go-max
---
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: qwencode
spec:
  secretStoreRefs:
  - name: onepassword-connect
    kind: ClusterSecretStore
  selector:
    secret:
      name: litellm-key-qwencode
  data:
  - match:
      secretKey: api-key
      remoteRef:
        remoteKey: litellm
        property: qwencode_api_key
