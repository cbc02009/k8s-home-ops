---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/litellm.home-operations.com/litellmvirtualkey_v1alpha1.json
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMVirtualKey
metadata:
  name: codeopen
spec:
  proxyRef: litellm
  keyAlias: CodeOpen
  secretName: litellm-key-codeopen
  secretKey: api-key
  models:
  - qwen3.8-27b
---
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: codeopen
spec:
  secretStoreRefs:
  - name: onepassword-connect
    kind: ClusterSecretStore
  selector:
    secret:
      name: litellm-key-codeopen
  data:
  - match:
      secretKey: api-key
      remoteRef:
        remoteKey: litellm
        property: opencode_api_key
