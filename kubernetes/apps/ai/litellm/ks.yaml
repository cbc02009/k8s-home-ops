---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: litellm
spec:
  components:
    - ../../../../components/dragonfly
    - ../../../../components/kopiur
  dependsOn:
    - name: dragonfly
      namespace: databases
    - name: litellm-operator
      namespace: ai
  healthCheckExprs:
    - apiVersion: dragonflydb.io/v1alpha1
      kind: Dragonfly
      failed: status.phase != 'ready'
      current: status.phase == 'ready'
  interval: 1h
  path: "./kubernetes/apps/ai/litellm/app"
  postBuild:
    substitute:
      APP: litellm
      HOSTNAME: litellm.ctec.run
      PVC_CAPACITY: 1Gi
      PVC_ACCESSMODES: ReadWriteMany
      PVC_STORAGECLASS: ceph-filesystem
      PVC_SNAPSHOTCLASS: csi-ceph-filesystem
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: ai
