---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app paseo
spec:
  chartRef:
    kind: OCIRepository
    name: *app
  interval: 15m
  dependsOn: []
  values:
    global:
      # The chart would otherwise generate a default ServiceAccount named
      # after the release, conflicting with serviceaccount.yaml.
      createDefaultServiceAccount: false
    defaultPodOptions:
      # The paseo ServiceAccount carries read-only cluster access (see
      # serviceaccount.yaml); app-template defaults automount to false.
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
    controllers:
      paseo:
        annotations:
          reloader.stakater.com/auto: "true"
        type: deployment
        strategy: Recreate
        serviceAccount:
          name: paseo
        pod:
          # Agent sessions run long; give in-flight work time to finish.
          terminationGracePeriodSeconds: 3600
        initContainers:
          clone:
            image:
              repository: ghcr.io/cbc02009/paseo
              tag: 0.15.4
            command: ["/bin/bash", "-c"]
            args:
              - |
                set -euo pipefail
                umask 077
                git config --global user.name "mahoro-ai"
                git config --global user.email "354213225+mahoro-ai@users.noreply.github.com"
                git config --global init.defaultBranch main
                git config --global --add safe.directory '*'
                printf 'https://x-access-token:%s@github.com\n' "$GH_TOKEN" > "${HOME}/.git-credentials"
                git config --global credential.helper store
                umask 022

                mkdir -p /workspace/worktrees
                if [[ ! -d /workspace/k8s-home-ops/.git ]]; then
                  git clone --filter=blob:none https://github.com/cbc02009/k8s-home-ops.git /workspace/k8s-home-ops \
                    || echo "WARN: k8s-home-ops clone failed; clone it from a session instead"
                else
                  git -C /workspace/k8s-home-ops fetch --all --prune
                fi
            env:
              - name: GH_TOKEN
                valueFrom:
                  secretKeyRef:
                    name: paseo
                    key: GH_TOKEN
        containers:
          app:
            image:
              repository: ghcr.io/cbc02009/paseo
              tag: 0.15.4
            env:
              - name: TZ
                value: ${CONFIG_TZ}
            envFrom:
              # Bot github token (GH_TOKEN / GITHUB_TOKEN) for agent sessions.
              - secretRef:
                  name: paseo
            probes:
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/health
                    port: &port 6767
                  failureThreshold: 60
                  periodSeconds: 10
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/health
                    port: *port
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/health
                    port: *port
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: ["ALL"]
            resources:
              requests:
                cpu: 100m
                memory: 512Mi
              limits:
                memory: 8Gi
    service:
      app:
        ports:
          http:
            port: *port
    route:
      app:
        # LAN only: envoy-internal is the private LB (internal.ctec.run).
        # No envoy-external / Cloudflare tunnel route.
        hostnames:
          - paseo.ctec.run
        parentRefs:
          - name: envoy-internal
            namespace: network
        rules:
          - backendRefs:
              - identifier: app
                port: http
    persistence:
      data:
        existingClaim: *app
        globalMounts:
          # Daemon state (PASEO_HOME, agent creds, git identity) plus the
          # code workspace Paseo sessions and worktrees operate in.
          - path: /home/paseo
            subPath: home
          - path: /workspace
            subPath: workspace
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
