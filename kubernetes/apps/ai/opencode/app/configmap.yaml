---
apiVersion: v1
kind: ConfigMap
metadata:
  name: opencode-config
data:
  entrypoint.sh: |
    #!/bin/bash
    set -euo pipefail

    git config --global user.name "mahoro-ai"
    git config --global user.email "354213225+mahoro-ai@users.noreply.github.com"
    git config --global init.defaultBranch main
    git config --global credential.helper store
    git config --global --add safe.directory '*'

    umask 077
    printf 'https://x-access-token:%s@github.com\n' "$${GITHUB_TOKEN}" > "$${HOME}/.git-credentials"
    umask 022

    mkdir -p "$${HOME}/projects"
    if [[ ! -d "$${HOME}/projects/k8s-home-ops/.git" ]]; then
      git clone --filter=blob:none https://github.com/cbc02009/k8s-home-ops.git "$${HOME}/projects/k8s-home-ops" \
        || echo "WARN: home-ops clone failed; clone it from a session instead"
    fi

    cd "$${HOME}/projects"
    exec opencode serve --hostname 0.0.0.0 --port 4096
  opencode.json: |
    {
      "$schema": "https://opencode.ai/config.json",
      "compaction": {
        "auto": true,
        "buffer": 16384,
        "keep": {
          "tokens": 20000
        }
      },
      "enabled_providers": [
        "litellm",
        "opencode"
      ],
      "model": "litellm/strata-fn",
      "permission": "allow",
      "plugins": [
        {
          "options": {
            "auto_update": false,
            "base_url": "http://memini.ai.svc.cluster.local",
            "namespace": "opencode"
          },
          "package": "@eleboucher/opencode-memini-v2@0.7.38"
        }
      ],
      "provider": {
        "litellm": {
          "models": {
            "go-coder": {
              "limit": {
                "context": 262144,
                "output": 65536
              },
              "name": "OpenCode Go · Kimi K2.7 Code"
            },
            "go-max": {
              "limit": {
                "context": 1000000,
                "output": 131072
              },
              "name": "OpenCode Go · Qwen3.8 Max"
            },
            "go-pool": {
              "limit": {
                "context": 262144,
                "output": 65536
              },
              "name": "OpenCode Go · workhorse pool"
            },
            "go-strong": {
              "limit": {
                "context": 1000000,
                "output": 131072
              },
              "name": "OpenCode Go · Kimi K3.1 Pro"
            },
            "qwen3.8-27b": {
              "limit": {
                "context": 147456,
                "output": 24576
              },
              "name": "Qwen3.8-27B W4A16"
            },
            "strata-fn": {
              "limit": {
                "context": 262144,
                "output": 65536
              },
              "name": "Strata Qwen3.8-flash-next"
            }
          },
          "name": "LiteLLM OpenAI",
          "npm": "@ai-sdk/openai-compatible",
          "options": {
            "apiKey": "{env:LITELLM_API_KEY}",
            "baseURL": "http://litellm.ai.svc.cluster.local:4000/v1",
            "timeout": 1800000
          }
        }
      },
      "tool_output": {
        "max_bytes": 16384,
        "max_lines": 800
      },
      "mcp": {
        "servers": {
          "toolhive": {
            "type": "remote",
            "url": "http://vmcp-mcp-gateway-internal.ai.svc.cluster.local:4483"
          }
        }
      }
    }
