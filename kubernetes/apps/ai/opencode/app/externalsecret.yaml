---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name opencode
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: *name
    template:
      engineVersion: v2
      data:
        GH_TOKEN: "{{ .bot_github_token }}"
        GITHUB_TOKEN: "{{ .bot_github_token }}"
        MEMINI_API_KEY: "{{ .memini_opencode_api_key }}"
        OPENCODE_SERVER_PASSWORD: "{{ .server_password }}"
  dataFrom:
    # Bot token (mahoro-ai) — same item as toolhive's github MCP
    - extract:
        key: mahoro-bot
      rewrite:
        - regexp:
            source: "(.*)"
            target: "bot_$1"
    - extract:
        key: opencode
    - extract:
        key: memini
      rewrite:
        - regexp:
            source: "(.*)"
            target: "memini_$1"
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name opencode-oidc
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: *name
    template:
      engineVersion: v2
      data:
        client-id: "{{ .oidc_id }}"
        client-secret: "{{ .oidc_secret }}"
  dataFrom:
    - extract:
        key: opencode
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name opencode-htpasswd
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: *name
    template:
      engineVersion: v2
      data:
        .htpasswd: "{{ .htpasswd }}"
  dataFrom:
    - extract:
        key: opencode
