---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/gateway.envoyproxy.io/securitypolicy_v1alpha1.json
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: opencode-codeserver-oidc
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: opencode-codeserver
  oidc:
    provider:
      issuer: https://auth.ctec.run/application/o/opencode/
    clientIDRef:
      group: ""
      kind: Secret
      name: opencode-oidc
    clientSecret:
      group: ""
      kind: Secret
      name: opencode-oidc
    redirectURL: https://opencode-code.ctec.run/oauth2/callback
    logoutPath: /logout
    scopes: ["openid", "email", "profile"]
