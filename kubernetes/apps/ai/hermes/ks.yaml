---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app hermes
spec:
  components:
    - ../../../../components/kopiur
  interval: 1h
  path: ./kubernetes/apps/ai/hermes
  postBuild:
    substitute:
      APP: *app
      PVC_CAPACITY: 20Gi
      APP_PGID: "10000"
      APP_PUID: "10000"
  wait: false
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: ai
