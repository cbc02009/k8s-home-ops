---
apiVersion: v1
kind: ConfigMap
metadata:
  name: hermes-config
data:
  config.yaml: |
    model:
      default: muse-glimmer
      provider: litellm
    providers:
      litellm:
        base_url: http://litellm.ai:4000/v1
        api_key: $${LITELLM_API_KEY}
    toolsets:
      - hermes-cli
    terminal:
      backend: local
      cwd: /opt/data/workspace
      timeout: 180
      persistent_shell: true
    memory:
      provider: memini
      auto_migrate: true
    compression:
      enabled: true
      threshold: 0.50
      target_ratio: 0.20
      protect_last_n: 20
    agent:
      max_turns: 90
      gateway_timeout: 1800
      restart_drain_timeout: 60
      api_max_retries: 2
      reasoning_effort: medium
    approvals:
      mode: smart
    display:
      platforms:
        discord:
          tool_progress: "off"
    streaming:
      enabled: false
      max_iterations: 250
    gateway:
      multiplex_profiles: false
    security:
      redact_secrets: true
    privacy:
      redact_pii: true
    platform_toolsets:
      cli:
        - hermes-cli
    mcp_servers:
      toolhive:
        url: http://vmcp-mcp-gateway-internal.ai:4483/mcp
    auxiliary:
      vision:
        provider: litellm
        model: muse-glimmer
      compression:
        provider: litellm
        model: qwen3.8-27b
        timeout: 180
      web_extract:
        provider: litellm
        model: qwen3.8-27b
        timeout: 120
      approval:
        provider: litellm
        model: qwen3.8-27b
        timeout: 60
      session_search:
        provider: litellm
        model: qwen3.8-27b
        timeout: 120
