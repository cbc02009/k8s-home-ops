---
# The nvidia dGPU slot. qwen3.8-27b is the sole member and pool default
# (always resident). strata-fn (the former second member, swapped in on
# demand) was decommissioned 2026-11-12 — its vision role moved to the
# go-chat cloud lane. The pool and router remain: litellm's 27B models
# front the nvidia-router-proxy Service this router serves.
apiVersion: inference.llmkube.dev/v1alpha1
kind: ModelPool
metadata:
  name: nvidia
spec:
  nodeSelector:
    topology.kubernetes.io: dgpu
  gpu: 1
  swapPolicy: reclaim
  swapBudget: 240s
  default: qwen3.8-27b
  reclaimAfter: 5m
  members:
    - inferenceServiceRef:
        name: qwen3.8-27b
---
apiVersion: inference.llmkube.dev/v1alpha1
kind: ModelRouter
metadata:
  name: nvidia
spec:
  defaultRouteStrategy: BackendNameMatch
  defaultRoute: qwen38-27b
  backends:
    - name: qwen38-27b
      displayName: qwen3.8-27b
      inferenceServiceRef:
        name: qwen3.8-27b
      capabilities: ["tools"]
  proxy:
    replicas: 1
    responseHeaderTimeout: 600s
