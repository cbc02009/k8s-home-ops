---
apiVersion: inference.llmkube.dev/v1alpha1
kind: ModelPool
metadata:
  name: nvidia
spec:
  nodeSelector:
    topology.kubernetes.io: dgpu
  gpu: 1
  swapPolicy: reclaim
  swapBudget: 240s
  default: qwen3.8-27b
  reclaimAfter: 5m
  members:
    - inferenceServiceRef:
        name: qwen3.8-27b
    - inferenceServiceRef:
        name: strata-fn
---
apiVersion: inference.llmkube.dev/v1alpha1
kind: ModelRouter
metadata:
  name: nvidia
spec:
  defaultRouteStrategy: BackendNameMatch
  defaultRoute: qwen38-27b
  backends:
    - name: qwen38-27b
      displayName: qwen3.8-27b
      inferenceServiceRef:
        name: qwen3.8-27b
      capabilities: ["tools"]
    - name: strata-fn
      displayName: qwen3.8-flash-next
      inferenceServiceRef:
        name: strata-fn
      capabilities: ["tools", "vision"]
  rules:
    # Strata wakes on demand (IfIdle: no swap while the incumbent has
    # in-flight requests — the request falls through to 27B instead).
    # Caveat: the router rewrites the outbound model to the InferenceService
    # name for generic runtimes (no ServedModel detection), and strata serves
    # a fixed, non-renamable id (qwen3.8-flash-next-iq3_s). If the engine
    # rejects the rewritten name the request falls through to 27B; the
    # litellm qwen3.8-flash-next group deliberately bypasses this router and
    # talks to strata-fn's Service directly with the exact served name.
    # This rule keeps pool activation reachable for router-native clients.
    - name: strata-fallthrough
      match:
        models: ["qwen3.8-flash-next"]
      route:
        backends: ["strata-fn", "qwen38-27b"]
        poolActivation: IfIdle
  proxy:
    replicas: 1
    responseHeaderTimeout: 600s
