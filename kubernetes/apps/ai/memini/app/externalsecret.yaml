---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name memini
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: *name
    template:
      data:
        MEMINI_API_KEY: "{{ .master_api_key }}"
  dataFrom:
    - extract:
        key: memini
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name memini-api-keys
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: *name
    template:
      data:
        api-keys.yaml: |
          keys:
            - name: openwebui
              secret: "{{ .openwebui_api_key }}"
              default_namespace: openwebui
            - name: robin
              secret: "{{ .admin_pass }}"
              home: personal/cbc02009
              default_namespace: cbc02009
              admin: true
  dataFrom:
    - extract:
        key: memini
