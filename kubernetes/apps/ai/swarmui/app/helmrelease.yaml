---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app swarmui
  namespace: ai
spec:
  chartRef:
    kind: OCIRepository
    name: *app
  dependsOn: []
  interval: 1h
  values:
    # defaultPodOptions:
    #   resourceClaims:
    #     - name: gpu
    #       resourceClaimTemplateName: swarmui-gpu
    controllers:
      swarmui:
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          securityContext:
            runAsUser: ${APP_UID}
            runAsGroup: ${APP_GID}
            fsGroup: ${APP_GID}
            fsGroupChangePolicy: "OnRootMismatch"
          nodeSelector:
            topology.kubernetes.io: "dgpu"
          tolerations:
            - key: llm-workload
              operator: Exists
              effect: NoSchedule
          runtimeClassName: nvidia
        containers:
          app:
            image:
              repository: ghcr.io/cbc02009/swarmui
              tag: 0.9.8@sha256:50bbb320f635f4da8d068dc742e9f4e0553dfc5010f9ec8c7cf0d161adf00aae
            env:
              TZ: ${CONFIG_TZ}
            resources:
              requests:
                nvidia.com/gpu: 1
                cpu: 500m
                memory: 4Gi
              limits:
                memory: 6Gi
                nvidia.com/gpu: 1
    service:
      app:
        controller: swarmui
        ports:
          http:
            port: &port 7801
    route:
      app:
        hostnames:
          - ${HOSTNAME}
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - name: *app
                port: *port

    persistence:
      data:
        existingClaim: "{{ .Release.Name }}"
        globalMounts:
          - path: /SwarmUI/Data
            subPath: data
          - path: /SwarmUI/dlbackend
            subPath: dlbackend
          - path: /SwarmUI/src/BuiltinExtensions/ComfyUIBackend/DLNodes
            subPath: dlnodes
          - path: /SwarmUI/src/BuiltinExtensions/ComfyUIBackend/CustomWorkflows
            subPath: workflows
      output:
        type: nfs
        server: ${CONFIG_TRUENAS_HOST}
        path: /mnt/smoltank/swarmui/output
        globalMounts:
          - path: /SwarmUI/Output
      models:
        type: nfs
        server: ${CONFIG_TRUENAS_HOST}
        path: /mnt/smoltank/swarmui/models
        globalMounts:
          - path: /SwarmUI/Models
