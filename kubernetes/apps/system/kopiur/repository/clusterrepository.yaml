---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kopiur.home-operations.com/clusterrepository_v1alpha1.json
apiVersion: kopiur.home-operations.com/v1alpha1
kind: ClusterRepository
metadata:
  name: volsync
spec:
  allowedNamespaces:
    all: true
  backend:
    filesystem:
      path: /repo
      volume:
        nfs:
          path: /mnt/tank/k8s/kopia
          server: shana.ctec.internal
  catalog:
    periodicRefresh: true # opt in to repeated re-scans (default false = scan once)
    refreshInterval: 1h # cadence when periodicRefresh is on (default 1h, minimum 30s)
    retain:
      perIdentity: 100 # newest N rows per username@hostname:path
      maxAgeDays: 90 # no rows for snapshots older than this
  maintenance:
    enabled: false
  create:
    enabled: false
  credentialProjection:
    allowed: true
  encryption:
    passwordSecretRef:
      name: kopiur-nas-secret
      namespace: system
      key: KOPIA_PASSWORD
  identityDefaults:
    hostnameExpr: namespace
    usernameExpr: policyName
  server:
    namespace: system
    auth:
      insecure:
        acknowledgeInsecure: true
    service:
      port: 80
      type: ClusterIP
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kopiur.home-operations.com/clusterrepository_v1alpha1.json
apiVersion: kopiur.home-operations.com/v1alpha1
kind: ClusterRepository
metadata:
  name: nas
spec:
  allowedNamespaces:
    all: true
  backend:
    filesystem:
      path: /repo
      volume:
        nfs:
          path: /mnt/tank/k8s/kopiur
          server: shana.ctec.internal
  catalog:
    periodicRefresh: true # opt in to repeated re-scans (default false = scan once)
    refreshInterval: 1h # cadence when periodicRefresh is on (default 1h, minimum 30s)
    retain:
      perIdentity: 100 # newest N rows per username@hostname:path
      maxAgeDays: 90 # no rows for snapshots older than this
  maintenance:
    schedule:
      quick:
        cron: 0 * * * *
        jitter: 10m
      full:
        cron: 0 3 * * *
        jitter: 1h
  moverDefaults:
    cache:
      # Every cache PVC is 5Gi or larger (KOPIUR_CAPACITY default). Kopia's own
      # defaults are 5000 MiB per budget, larger than the whole PVC, so the
      # sweeper never runs and the cache fills the volume. The metadata budget
      # applies twice: kopia caps the index-blobs cache at the same size.
      contentCacheSizeMb: 512
      metadataCacheSizeMb: 1024
  parameters:
    epoch:
      minDuration: 1h
  create:
    enabled: false
  credentialProjection:
    allowed: true
  encryption:
    passwordSecretRef:
      name: kopiur-nas-secret
      namespace: system
      key: KOPIA_PASSWORD
  identityDefaults:
    hostnameExpr: namespace
    usernameExpr: policyName
  server:
    namespace: system
    auth:
      insecure:
        acknowledgeInsecure: true
    service:
      port: 80
      type: ClusterIP
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kopiur.home-operations.com/clusterrepository_v1alpha1.json
apiVersion: kopiur.home-operations.com/v1alpha1
kind: ClusterRepository
metadata:
  name: b2
spec:
  allowedNamespaces:
    all: true
  backend:
    s3:
      bucket: kopia-cbc02009
      prefix: "" # match wherever the old tooling put the repo (often the root)
      endpoint: s3.us-east-005.backblazeb2.com
      region: us-east-1
      auth:
        secretRef:
          name: kopiur-b2-secret
  catalog:
    periodicRefresh: true # opt in to repeated re-scans (default false = scan once)
    refreshInterval: 1h # cadence when periodicRefresh is on (default 1h, minimum 30s)
    retain:
      perIdentity: 100 # newest N rows per username@hostname:path
      maxAgeDays: 90 # no rows for snapshots older than this
  maintenance:
    enabled: false
  create:
    enabled: false
  credentialProjection:
    allowed: true
  encryption:
    passwordSecretRef:
      name: kopiur-b2-secret
      namespace: system
      key: KOPIA_PASSWORD
  identityDefaults:
    hostnameExpr: namespace
    usernameExpr: policyName
  server:
    namespace: system
    auth:
      insecure:
        acknowledgeInsecure: true
    service:
      port: 80
      type: ClusterIP
