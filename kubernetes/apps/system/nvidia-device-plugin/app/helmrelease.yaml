---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: nvidia-device-plugin
spec:
  chart:
    spec:
      chart: nvidia-device-plugin
      version: 0.20.1
      sourceRef:
        kind: HelmRepository
        name: nvdp
      interval: 30m
  interval: 1h
  # https://github.com/NVIDIA/k8s-device-plugin/blob/main/deployments/helm/nvidia-device-plugin/values.yaml
  values:
    runtimeClassName: nvidia
    config:
      map:
        default: |-
          version: v1
          flags:
            migStrategy: none
          # No sharing.timeSlicing on purpose: the dGPU must serve at most
          # one workload at a time, so expose a single nvidia.com/gpu.
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: topology.kubernetes.io
                  operator: In
                  values: ["dgpu"]
            - matchExpressions:
                - key: feature.node.kubernetes.io/pci-10de.present
                  operator: In
                  values:
                    - "true"
            - matchExpressions:
                - key: "nvidia.com/gpu.present"
                  operator: In
                  values:
                    - "true"
    tolerations:
      - key: llm-workload
        operator: Exists
      - key: nvidia.com/gpu
        operator: Exists
        effect: NoSchedule
