---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name terraform-secret
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: *name
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        # Consumed by the 1Password terraform modules (terraform/*/modules/1password-item)
        OP_CONNECT_HOST: http://onepassword-connect.security.svc.cluster.local
        OP_CONNECT_TOKEN: "{{ .op_token }}"
        # Consumed by the pg state backend (libpq env vars)
        PGUSER: "{{ .pg_user }}"
        PGPASSWORD: "{{ .pg_pass }}"
  dataFrom:
    - extract:
        key: 1password
      rewrite:
        - regexp:
            source: "(.*)"
            target: "op_$1"
    - extract:
        key: postgres
      rewrite:
        - regexp:
            source: "(.*)"
            target: "pg_$1"
