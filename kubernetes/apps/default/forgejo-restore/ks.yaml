---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app forgejo-restore
  namespace: &namespace default
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  # No dependsOn: forgejo here. The forgejo secret (PG superuser + app role
  # creds) is synced by its own ExternalSecret, which Flux reconciles
  # independently of the forgejo Kustomization. Depending on forgejo would
  # block this Job during the cutover — precisely when forgejo is suspended /
  # scaled to 0 and the restore must still run. The Job's run-once guard makes
  # ordering with the forgejo app harmless.
  interval: 30m
  path: ./kubernetes/apps/default/forgejo-restore/app
  postBuild:
    substitute:
      APP: *app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: *namespace
  wait: false
