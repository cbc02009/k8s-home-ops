---
# One-time Phase B cutover: restore the pg_dump taken from the old TrueNAS
# forgejo stack into the forgejo-postgres CNPG cluster. The dump lives on the
# existing LFS NFS share (smoltank/apps/forgejo-lfs), so the Job just mounts
# that PVC and runs pg_restore with --clean --if-exists.
#
# This Job lives in its own forgejo-restore Kustomization (ks.yaml next to
# this dir) so the forgejo app can be suspended / scaled to 0 for the cutover
# without blocking this Job's sync from git.
#
# Run order:
#   1. suspend the forgejo Kustomization (flux suspend ks forgejo) and scale
#      the deployment to 0 (kubectl scale deploy/forgejo --replicas=0)
#   2. merge the PR carrying this manifest; Flux applies the Job
#   3. inspect logs: pg_restore should report CREATE/ALTER, no FATAL/ERROR
#   4. scale forgejo back up / unsuspend, verify login + repos + 2FA decrypt
#   5. post-cutover cleanup PR: delete this forgejo-restore app dir
apiVersion: batch/v1
kind: Job
metadata:
  name: forgejo-pg-restore
  namespace: default
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 3600
  template:
    spec:
      restartPolicy: Never
      securityContext:
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 2000
      containers:
        - name: pg-restore
          image: postgres:17.12
          env:
            - name: PGHOST
              value: forgejo-postgres-rw.databases.svc.cluster.local
            - name: PGPORT
              value: "5432"
            - name: PGDATABASE
              value: forgejo
            - name: APP_ROLE
              valueFrom:
                secretKeyRef:
                  name: forgejo
                  key: FORGEJO__database__USER
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: forgejo
                  key: INIT_POSTGRES_SUPER_USER
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: forgejo
                  key: INIT_POSTGRES_SUPER_PASS
          # Superuser credentials come from the `forgejo` secret's
          # INIT_POSTGRES_SUPER_USER / INIT_POSTGRES_SUPER_PASS keys (the
          # postgres 1P item projected into `default`); the app role comes from
          # the same secret's FORGEJO__database__USER. The CNPG `cloudnative-pg`
          # superuser secret only exists in `databases` and is unreachable here.
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              # Run-once guard: if the restored schema already holds data (version
              # table non-empty), the restore has already completed — do not
              # re-run --clean against a live forgejo. Flux can re-create this
              # Job after ttlSecondsAfterFinished evicts it; this keeps it a no-op.
              if psql -At -c "SELECT count(*) FROM public.version;" 2>/dev/null | grep -qE '^[1-9][0-9]*$'; then
                echo "== restore already applied (public.version non-empty) — skipping =="
                exit 0
              fi
              echo "== restore dump =="
              set +e
              pg_restore --clean --if-exists \
                -d "$PGDATABASE" /dump/forgejo-db.dump
              rc=$?
              set -e
              # Reassign all restored objects to the app's non-superuser role
              # so forgejo (which connects as FORGEJO__database__USER) can
              # actually read/write its own schema after cutover. Run as the
              # CNPG superuser. Run before exit $rc so a role-name mismatch
              # can't leave postgres-owned objects behind a green guard pass.
              psql -d "$PGDATABASE" -c "REASSIGN OWNED BY \"$PGUSER\" TO \"$APP_ROLE\";" || true
              echo "== verify tables =="
              psql -c "SELECT count(*) AS n FROM information_schema.tables WHERE table_schema='public';"
              echo "== done =="
              exit $rc
          volumeMounts:
            - name: dump
              mountPath: /dump
              readOnly: true
      volumes:
        - name: dump
          nfs:
            server: shana.ctec.internal
            path: /mnt/smoltank/apps/forgejo-lfs
