---
# One-time Phase B cutover: mirror the old TrueNAS forgejo data directory
# (/mnt/smoltank/apps/forgejo/data — the compose stack's /var/lib/gitea bind,
# containing git/repositories, ssh host keys, and the app-data subdir) into
# the new cluster's `forgejo` data PVC (mounted at /var/lib/gitea by the app).
#
# v2 corrects a path bug in the first run: /src is already /var/lib/gitea (the
# dataset's `data` dir selected with subPath), so the rsync source must be
# /src/ — NOT /src/data/, which is only Gitea's app-data subdir (sessions,
# avatars, attachments) and caused the first run to copy zero git repos.
#
# rsync runs in mirror mode (--delete) so nothing from the fresh install's
# first boot survives, then ownership is normalized to 2000:2000 — the UID/GID
# both the old compose stack (user: 2000:2000) and the new helmrelease
# (runAsUser/fsGroup 2000) use.
#
# Lives in the standalone forgejo-restore Kustomization so the forgejo app can
# stay scaled to 0 during the cutover.
#
# Run order:
#   1. forgejo scaled to 0 (MUST — RWO PVC is shared with the app)
#   2. merge the PR carrying this Job; Flux prunes the v1 Job and applies v2
#   3. inspect logs: source listing must show git/ + ssh/; verify must show all
#      6 repo dirs and the ssh_host_ed25519_key
#   4. only then scale forgejo back up
#   5. post-cutover cleanup PR: delete this whole forgejo-restore app dir
#
# Safety:
#   - preflight FAILS the Job if /src/git/repositories is empty, rather than
#     silently mirroring an empty tree (the v1 failure mode);
#   - a completion marker written only after a successful mirror makes any
#     re-run (after ttlSecondsAfterFinished eviction) skip, so --delete can
#     never touch a live forgejo.
apiVersion: batch/v1
kind: Job
metadata:
  name: forgejo-data-rsync-v2
  namespace: default
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 3600
  template:
    spec:
      restartPolicy: Never
      securityContext:
        runAsUser: 0
        runAsGroup: 0
        fsGroup: 2000
      containers:
        - name: rsync
          image: alpine:3.24
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              # Completion marker: only written after a successful mirror.
              # Skips re-runs after ttl eviction so --delete can never fire
              # against a live forgejo.
              if [ -f /data/.forgejo-cutover-v2-complete ]; then
                echo "== data already synced (completion marker present) — skipping =="
                exit 0
              fi
              echo "== source root (/src = old /var/lib/gitea) =="
              ls -la /src
              # Preflight: the first run mirrored /src/data/ (only app-data)
              # and left every repo broken. Fail loudly if git/ is absent.
              src_repos="$(find /src/git/repositories -mindepth 1 -maxdepth 1 2>/dev/null | wc -l)"
              echo "source repositories=$src_repos"
              if [ "$src_repos" -lt 1 ]; then
                echo "ERROR: no repositories at /src/git/repositories — refusing to rsync" >&2
                exit 1
              fi
              echo "== rsync full /var/lib/gitea tree =="
              apk add --no-cache rsync >/dev/null
              rsync -a --delete --info=stats1 /src/ /data/
              # Normalize ownership to the app's UID/GID (no-op when the
              # source is already 2000:2000; catches stray root-owned files).
              chown -R 2000:2000 /data
              touch /data/.forgejo-cutover-v2-complete
              chown 2000:2000 /data/.forgejo-cutover-v2-complete
              echo "== verify =="
              du -sh /data
              stat -c '%u:%g %n' /data /data/git /data/ssh 2>/dev/null || true
              echo "ssh host key:"
              ls -la /data/ssh/ssh_host_ed25519_key 2>/dev/null || echo "MISSING ssh_host_ed25519_key"
              echo "== repositories =="
              find /data/git/repositories -mindepth 1 -maxdepth 1 -type d 2>/dev/null | head -20
              echo "== done =="
          volumeMounts:
            - name: source
              mountPath: /src
              readOnly: true
              # The exported share is the whole forgejo dataset; the old
              # compose stack's /var/lib/gitea bind was its `data` subdir.
              subPath: data
            - name: data
              mountPath: /data
      volumes:
        # NFS export is the parent dataset /mnt/smoltank/apps/forgejo (holds
        # data/, conf/, database/); subPath: above selects /var/lib/gitea.
        - name: source
          nfs:
            server: shana.ctec.internal
            path: /mnt/smoltank/apps/forgejo
        - name: data
          persistentVolumeClaim:
            claimName: forgejo
