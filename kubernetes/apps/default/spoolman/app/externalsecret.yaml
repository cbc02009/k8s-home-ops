---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name spoolman
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: *name
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        # Postgres Init
        INIT_POSTGRES_USER: &dbuser "{{ .pg_user }}"
        INIT_POSTGRES_PASS: &dbpass "{{ .pg_pass }}"
        INIT_POSTGRES_HOST: &dbhost "{{ .postgres_host }}"
        INIT_POSTGRES_SUPER_PASS: "{{ .postgres_super_pass }}"
        SONARR__POSTGRES__PORT: &dbport "5432"
        INIT_POSTGRES_DBNAME: &dbname spoolman

        # Spoolman
        SPOOLMAN_DB_HOST: *dbhost
        SPOOLMAN_DB_PORT: *dbport
        SPOOLMAN_DB_NAME: *dbname
        SPOOLMAN_DB_USERNAME: *dbuser
        SPOOLMAN_DB_PASSWORD: *dbpass

  dataFrom:
    - extract:
        key: postgres
      rewrite:
        - regexp:
            source: "(.*)"
            target: "postgres_$1"
    - extract:
        key: spoolman
