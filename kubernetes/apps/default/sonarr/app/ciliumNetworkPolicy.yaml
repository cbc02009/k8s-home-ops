---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: sonarr-cnp
  namespace: default
  labels:
    app.kubernetes.io/name: sonarr
    app.kubernetes.io/component: cilium-policy
    app.kubernetes.io/part-of: kguardian
spec:
  endpointSelector:
    matchLabels:
      k8s:app.kubernetes.io/controller: sonarr
      k8s:app.kubernetes.io/instance: sonarr
      k8s:app.kubernetes.io/name: sonarr
  description: >-
    Least-privilege policy for workload sonarr in namespace default, generated by kguardian from observed pod traffic on 2026-11-15.
  ingress:
  - fromEndpoints:
    - matchLabels:
        k8s:app.kubernetes.io/controller: prowlarr
        k8s:app.kubernetes.io/instance: prowlarr
        k8s:app.kubernetes.io/name: prowlarr
    toPorts:
    - ports:
      - port: "80"
        protocol: TCP
  - fromEndpoints:
    - matchLabels:
        k8s:app.kubernetes.io/controller: seerr
        k8s:app.kubernetes.io/instance: seerr
        k8s:app.kubernetes.io/name: seerr
    toPorts:
    - ports:
      - port: "80"
        protocol: TCP
  egress:
  - toEndpoints:
    - matchLabels:
        k8s:app.kubernetes.io/instance: coredns
        k8s:app.kubernetes.io/name: coredns
        k8s:k8s-app: kube-dns
        k8s:io.kubernetes.pod.namespace: kube-system
    toPorts:
    - ports:
      - port: "53"
        protocol: UDP
  - toEndpoints:
    - matchLabels:
        k8s:app.kubernetes.io/controller: qbittorrent
        k8s:app.kubernetes.io/instance: qbittorrent
        k8s:app.kubernetes.io/name: qbittorrent
    toPorts:
    - ports:
      - port: "8080"
        protocol: TCP
  - toEndpoints:
    - matchLabels:
        k8s:app.kubernetes.io/controller: sabnzbd
        k8s:app.kubernetes.io/instance: sabnzbd
        k8s:app.kubernetes.io/name: sabnzbd
    toPorts:
    - ports:
      - port: "80"
        protocol: TCP
  - toCIDR:
    - 104.26.0.163/32
    toPorts:
    - ports:
      - port: "443"
        protocol: TCP
  - toCIDR:
    - 104.26.1.163/32
    toPorts:
    - ports:
      - port: "443"
        protocol: TCP
status: {}
