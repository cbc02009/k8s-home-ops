---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: atuin-cnp
  namespace: default
  labels:
    app.kubernetes.io/name: atuin
    app.kubernetes.io/component: cilium-policy
    app.kubernetes.io/part-of: kguardian
spec:
  endpointSelector:
    matchLabels:
      k8s:app.kubernetes.io/controller: atuin
      k8s:app.kubernetes.io/instance: atuin
      k8s:app.kubernetes.io/name: atuin
  description: >-
    Least-privilege policy for workload atuin in namespace default, generated by kguardian from observed pod traffic on 2026-11-15.
  ingress:
    # host-network peer kube-system/multus on node miri — endpointSelector cannot match host traffic
    - fromEntities:
        - host
        - remote-node
      toPorts:
        - ports:
            - port: "8888"
              protocol: TCP
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:cnpg.io/cluster: postgres
            k8s:cnpg.io/instanceRole: primary
            k8s:io.kubernetes.pod.namespace: databases
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
status: {}
