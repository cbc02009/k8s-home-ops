---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: mealie-cnp
  namespace: default
  labels:
    app.kubernetes.io/name: mealie
    app.kubernetes.io/component: cilium-policy
    app.kubernetes.io/part-of: kguardian
spec:
  endpointSelector:
    matchLabels:
      k8s:app.kubernetes.io/controller: mealie
      k8s:app.kubernetes.io/instance: mealie
      k8s:app.kubernetes.io/name: mealie
  description: >-
    Least-privilege policy for workload mealie in namespace default, generated by kguardian from observed pod traffic on 2026-11-15.
  ingress:
  - fromEndpoints:
    - matchLabels:
        k8s:app.kubernetes.io/component: proxy
        k8s:app.kubernetes.io/managed-by: envoy-gateway
        k8s:app.kubernetes.io/name: envoy
        k8s:gateway.envoyproxy.io/owning-gateway-name: envoy-internal
        k8s:gateway.envoyproxy.io/owning-gateway-namespace: network
        k8s:gateway.networking.k8s.io/gateway-name: envoy-internal
        k8s:io.kubernetes.pod.namespace: network
    toPorts:
    - ports:
      - port: "9000"
        protocol: TCP
  egress:
  - toEndpoints:
    - matchLabels:
        k8s:cnpg.io/cluster: postgres
        k8s:cnpg.io/instanceRole: primary
        k8s:io.kubernetes.pod.namespace: databases
    toPorts:
    - ports:
      - port: "5432"
        protocol: TCP
status: {}
