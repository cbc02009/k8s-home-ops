---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: "${PVC_CLAIM:-${APP}}"
spec:
  accessModes:
    - ${PVC_ACCESSMODES:=ReadWriteOnce}
  dataSourceRef:
    apiGroup: kopiur.home-operations.com
    kind: Restore
    name: ${APP}
  resources:
    requests:
      storage: ${PVC_CAPACITY:=5Gi}
  storageClassName: ${PVC_STORAGECLASS:=ceph-block}
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kopiur.home-operations.com/restore_v1alpha1.json
apiVersion: kopiur.home-operations.com/v1alpha1
kind: Restore
metadata:
  name: ${APP}
spec:
  mover:
    securityContext:
      runAsUser: ${APP_UID:=2000}
      runAsGroup: ${APP_GID:=2000}
  policy:
    onMissingSnapshot: Fail
  repository:
    kind: ClusterRepository
    name: nas
  source:
    identity:
      username: plex
      hostname: media
      sourcePath: /data
      asOf: "2026-08-28T23:30:00Z"
      # snapshotID: k4ad403b2c7852ea739369d3587361b0c
  target:
    populator: {}
---
apiVersion: kopiur.home-operations.com/v1alpha1
kind: SnapshotPolicy
metadata:
  name: plex
spec:
  adoption: Ignore
  mover:
    cache:
      capacity: ${PVC_CAPACITY:=5Gi}
      mode: Ephemeral
      storageClassName: ceph-block
    securityContext:
      runAsUser: ${APP_UID:=2000}
      runAsGroup: ${APP_GID:=2000}
  repository:
    kind: ClusterRepository
    name: nas
  sources:
    - pvc:
        name: "${PVC_CLAIM:-${APP}}"
  retention:
    keepDaily: 14
    keepWeekly: 6
  verification:
    deep:
      schedule:
        cron: H 5 1 * *
    quick:
      schedule:
        cron: H 3 * * *
  volumeSnapshotClassName: ${PVC_SNAPSHOTCLASS:=csi-ceph-blockpool}
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kopiur.home-operations.com/snapshotschedule_v1alpha1.json
apiVersion: kopiur.home-operations.com/v1alpha1
kind: SnapshotSchedule
metadata:
  name: ${APP}
spec:
  policyRef:
    name: ${APP}
  schedule:
    cron: H * * * *
