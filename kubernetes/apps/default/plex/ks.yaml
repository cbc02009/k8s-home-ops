---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/kustomization-kustomize-v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app plex
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  components:
    - ../../../../components/zeroscaler
    - ../../../../components/gpu
    - ../../../../components/volsync-move
  dependsOn:
    - name: volsync
      namespace: system
    - name: rook-ceph-cluster
      namespace: rook-ceph
  interval: 1h
  path: ./kubernetes/apps/default/plex/app
  postBuild:
    substitute:
      HOSTNAME: plex.ctec.run
      APP: *app
      IP: 10.6.0.12
      PVC_CAPACITY: "50Gi"
      APP_UID: "1000"
      APP_GID: "1000"
      MOVER_NAMESPACE: media
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: default
  timeout: 30m
  wait: false
