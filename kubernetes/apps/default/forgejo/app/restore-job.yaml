---
# One-time Phase B cutover: restore the pg_dump taken from the old TrueNAS
# forgejo stack into the forgejo-postgres CNPG cluster. The dump lives on the
# existing LFS NFS share (smoltank/apps/forgejo-lfs), so the Job just mounts
# that PVC and runs pg_restore with --clean --if-exists.
#
# Run order:
#   1. scale the new forgejo deployment to 0 (done below via forgejo helmrelease)
#   2. apply this Job
#   3. inspect logs: pg_restore should report CREATE/ALTER, no FATAL/ERROR
#   4. scale forgejo back up, verify login + repos + 2FA decrypt
apiVersion: batch/v1
kind: Job
metadata:
  name: forgejo-pg-restore
  namespace: default
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 3600
  template:
    spec:
      restartPolicy: Never
      securityContext:
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 2000
      containers:
        - name: pg-restore
          image: postgres:17.12
          env:
            - name: PGHOST
              value: forgejo-postgres-rw.databases.svc.cluster.local
            - name: PGPORT
              value: "5432"
            - name: PGDATABASE
              value: forgejo
            - name: APP_ROLE
              valueFrom:
                secretKeyRef:
                  name: forgejo
                  key: FORGEJO__database__USER
            - name: PGUSER
              value: postgres
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: cloudnative-pg
                  key: password
          # Superuser credentials come from the CNPG cluster secret (cloudnative-pg)
          # mounted via env below; the forgejo role is not a superuser.
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              # Run-once guard: if the restored schema already holds data (version
              # table non-empty), the restore has already completed — do not
              # re-run --clean against a live forgejo. Flux can re-create this
              # Job after ttlSecondsAfterFinished evicts it; this keeps it a no-op.
              if psql -At -c "SELECT count(*) FROM public.version;" 2>/dev/null | grep -qE '^[1-9][0-9]*$'; then
                echo "== restore already applied (public.version non-empty) — skipping =="
                exit 0
              fi
              echo "== restore dump =="
              pg_restore --clean --if-exists \
                -d "$PGDATABASE" /dump/forgejo-db.dump
              # Reassign all restored objects to the app's non-superuser role
              # so forgejo (which connects as FORGEJO__database__USER) can
              # actually read/write its own schema after cutover. Run as the
              # CNPG superuser.
              # The app role name is injected via APP_ROLE env var (from the forgejo secret).
              psql -d "$PGDATABASE" -c "REASSIGN OWNED BY postgres TO \"$APP_ROLE\";"
              echo "== verify tables =="
              psql -c "SELECT count(*) AS n FROM information_schema.tables WHERE table_schema='public';"
              echo "== done =="
          volumeMounts:
            - name: dump
              mountPath: /dump
              readOnly: true
      volumes:
        - name: dump
          nfs:
            server: shana.ctec.internal
            path: /mnt/smoltank/apps/forgejo-lfs
