---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name forgejo
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: *name
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        # The app's regular (non-superuser) role, from the `forgejo` item:
        # used by the main container; created by the 01-init-db init container.
        FORGEJO_DATABASE_USER: "{{ .pg_user }}"
        FORGEJO_DATABASE_PASSWORD: "***"
        # postgres-init (01-init-db init container, helmrelease.yaml): runs
        # as the forgejo-postgres cluster superuser (from the `postgres` item —
        # the same one the `cloudnative-pg` secret in databases projects) and
        # idempotently creates the role + database above.
        INIT_POSTGRES_SUPER_USER: "{{ .postgres_super_user }}"
        INIT_POSTGRES_SUPER_PASS: "{{ .postgres_super_pass }}"
        INIT_POSTGRES_USER: "{{ .pg_user }}"
        INIT_POSTGRES_PASS: "{{ .pg_pass }}"
        INIT_POSTGRES_HOST: "forgejo-postgres-rw.databases.svc.cluster.local"
        INIT_POSTGRES_DBNAME: "forgejo"
  dataFrom:
    - extract:
        key: forgejo
    - extract:
        key: postgres
      rewrite:
        - regexp:
            source: "(.*)"
            target: "postgres_$1"
