---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: sabnzbd-cnp
  namespace: default
  labels:
    app.kubernetes.io/name: sabnzbd
    app.kubernetes.io/component: cilium-policy
    app.kubernetes.io/part-of: kguardian
spec:
  endpointSelector:
    matchLabels:
      k8s:app.kubernetes.io/controller: sabnzbd
      k8s:app.kubernetes.io/instance: sabnzbd
      k8s:app.kubernetes.io/name: sabnzbd
  description: >-
    Least-privilege policy for workload sabnzbd in namespace default, generated by kguardian from observed pod traffic on 2026-11-15.
  ingress:
    # host-network peer observability/victoria-logs-vector on node sakura — endpointSelector cannot match host traffic
  - fromEntities:
    - host
    - remote-node
    toPorts:
    - ports:
      - port: "80"
        protocol: TCP
  - fromEndpoints:
    - matchLabels:
        k8s:app.kubernetes.io/controller: sonarr
        k8s:app.kubernetes.io/instance: sonarr
        k8s:app.kubernetes.io/name: sonarr
    toPorts:
    - ports:
      - port: "80"
        protocol: TCP
  - fromEndpoints:
    - matchLabels:
        k8s:app.kubernetes.io/component: proxy
        k8s:app.kubernetes.io/managed-by: envoy-gateway
        k8s:app.kubernetes.io/name: envoy
        k8s:gateway.envoyproxy.io/owning-gateway-name: envoy-internal
        k8s:gateway.envoyproxy.io/owning-gateway-namespace: network
        k8s:gateway.networking.k8s.io/gateway-name: envoy-internal
        k8s:io.kubernetes.pod.namespace: network
    toPorts:
    - ports:
      - port: "80"
        protocol: TCP
  - fromEndpoints:
    - matchLabels:
        k8s:app.kubernetes.io/controller: radarr
        k8s:app.kubernetes.io/instance: radarr
        k8s:app.kubernetes.io/name: radarr
    toPorts:
    - ports:
      - port: "80"
        protocol: TCP
  - fromEndpoints:
    - matchLabels:
        k8s:app.kubernetes.io/controller: animarr
        k8s:app.kubernetes.io/instance: animarr
        k8s:app.kubernetes.io/name: animarr
    toPorts:
    - ports:
      - port: "80"
        protocol: TCP
  egress:
  - toCIDR:
    - 104.26.3.117/32
    toPorts:
    - ports:
      - port: "443"
        protocol: TCP
  - toCIDR:
    - 239.255.255.250/32
    toPorts:
    - ports:
      - port: "1900"
        protocol: UDP
status: {}
