---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: silverbullet-cnp
  namespace: default
  labels:
    app.kubernetes.io/name: silverbullet
    app.kubernetes.io/component: cilium-policy
    app.kubernetes.io/part-of: kguardian
spec:
  endpointSelector:
    matchLabels:
      k8s:app.kubernetes.io/controller: silverbullet
      k8s:app.kubernetes.io/instance: silverbullet
      k8s:app.kubernetes.io/name: silverbullet
  description: >-
    Least-privilege policy for workload silverbullet in namespace default, generated by kguardian from observed pod traffic on 2026-11-15.
  ingress:
    # host-network peer kguardian/kguardian-controller on node uiharu — endpointSelector cannot match host traffic
    - fromEntities:
        - host
        - remote-node
      toPorts:
        - ports:
            - port: "3000"
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            k8s:app.kubernetes.io/component: proxy
            k8s:app.kubernetes.io/managed-by: envoy-gateway
            k8s:app.kubernetes.io/name: envoy
            k8s:gateway.envoyproxy.io/owning-gateway-name: envoy-internal
            k8s:gateway.envoyproxy.io/owning-gateway-namespace: network
            k8s:gateway.networking.k8s.io/gateway-name: envoy-internal
            k8s:io.kubernetes.pod.namespace: network
      toPorts:
        - ports:
            - port: "3000"
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            k8s:app.kubernetes.io/component: proxy
            k8s:app.kubernetes.io/managed-by: envoy-gateway
            k8s:app.kubernetes.io/name: envoy
            k8s:gateway.envoyproxy.io/owning-gateway-name: envoy-internal
            k8s:gateway.envoyproxy.io/owning-gateway-namespace: network
            k8s:gateway.networking.k8s.io/gateway-name: envoy-internal
            k8s:io.kubernetes.pod.namespace: network
      toPorts:
        - ports:
            - port: "3000"
              protocol: TCP
status: {}
