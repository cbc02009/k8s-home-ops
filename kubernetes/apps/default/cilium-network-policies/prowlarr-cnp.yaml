---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: prowlarr-cnp
  namespace: default
  labels:
    app.kubernetes.io/name: prowlarr
    app.kubernetes.io/component: cilium-policy
    app.kubernetes.io/part-of: kguardian
spec:
  endpointSelector:
    matchLabels:
      k8s:app.kubernetes.io/controller: prowlarr
      k8s:app.kubernetes.io/instance: prowlarr
      k8s:app.kubernetes.io/name: prowlarr
  description: >-
    Least-privilege policy for workload prowlarr in namespace default, generated by kguardian from observed pod traffic on 2026-11-15.
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:app.kubernetes.io/instance: coredns
            k8s:app.kubernetes.io/name: coredns
            k8s:k8s-app: kube-dns
            k8s:io.kubernetes.pod.namespace: kube-system
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
status: {}
