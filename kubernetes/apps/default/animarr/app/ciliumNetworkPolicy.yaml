---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: animarr-cnp
  namespace: default
  labels:
    app.kubernetes.io/name: animarr
    app.kubernetes.io/component: cilium-policy
    app.kubernetes.io/part-of: kguardian
spec:
  endpointSelector:
    matchLabels:
      k8s:app.kubernetes.io/controller: animarr
      k8s:app.kubernetes.io/instance: animarr
      k8s:app.kubernetes.io/name: animarr
  description: >-
    Least-privilege policy for workload animarr in namespace default, generated by kguardian from observed pod traffic on 2026-11-15.
  ingress:
    # host-network peer kube-system/multus on node uiharu — endpointSelector cannot match host traffic
  - fromEntities:
    - host
    - remote-node
    toPorts:
    - ports:
      - port: "80"
        protocol: TCP
  - fromEndpoints:
    - matchLabels:
        k8s:app.kubernetes.io/component: proxy
        k8s:app.kubernetes.io/managed-by: envoy-gateway
        k8s:app.kubernetes.io/name: envoy
        k8s:gateway.envoyproxy.io/owning-gateway-name: envoy-internal
        k8s:gateway.envoyproxy.io/owning-gateway-namespace: network
        k8s:gateway.networking.k8s.io/gateway-name: envoy-internal
        k8s:io.kubernetes.pod.namespace: network
    toPorts:
    - ports:
      - port: "80"
        protocol: TCP
  egress:
  - toEndpoints:
    - matchLabels:
        k8s:app.kubernetes.io/instance: coredns
        k8s:app.kubernetes.io/name: coredns
        k8s:k8s-app: kube-dns
        k8s:io.kubernetes.pod.namespace: kube-system
    toPorts:
    - ports:
      - port: "53"
        protocol: UDP
  - toEndpoints:
    - matchLabels:
        k8s:cnpg.io/cluster: postgres
        k8s:cnpg.io/instanceRole: primary
        k8s:io.kubernetes.pod.namespace: databases
    toPorts:
    - ports:
      - port: "5432"
        protocol: TCP
  - toEndpoints:
    - matchLabels:
        k8s:app.kubernetes.io/controller: qbittorrent
        k8s:app.kubernetes.io/instance: qbittorrent
        k8s:app.kubernetes.io/name: qbittorrent
    toPorts:
    - ports:
      - port: "8080"
        protocol: TCP
  - toEndpoints:
    - matchLabels:
        k8s:app.kubernetes.io/controller: prowlarr
        k8s:app.kubernetes.io/instance: prowlarr
        k8s:app.kubernetes.io/name: prowlarr
    toPorts:
    - ports:
      - port: "80"
        protocol: TCP
  - toEndpoints:
    - matchLabels:
        k8s:app.kubernetes.io/controller: sabnzbd
        k8s:app.kubernetes.io/instance: sabnzbd
        k8s:app.kubernetes.io/name: sabnzbd
    toPorts:
    - ports:
      - port: "80"
        protocol: TCP
  - toCIDR:
    - 104.21.57.70/32
    toPorts:
    - ports:
      - port: "443"
        protocol: TCP
  - toCIDR:
    - 104.26.0.163/32
    toPorts:
    - ports:
      - port: "443"
        protocol: TCP
  - toCIDR:
    - 104.26.1.163/32
    toPorts:
    - ports:
      - port: "443"
        protocol: TCP
  - toCIDR:
    - 172.64.80.1/32
    toPorts:
    - ports:
      - port: "443"
        protocol: TCP
  - toCIDR:
    - 186.2.163.20/32
    toPorts:
    - ports:
      - port: "443"
        protocol: TCP
  - toCIDR:
    - 51.178.75.216/32
    toPorts:
    - ports:
      - port: "443"
        protocol: TCP
status: {}
