---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app forgejo-runner-old
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: *app
  values:
    configMaps:
      config:
        suffix: config
        data:
          config.yaml: |-
            log:
              level: info

            runner:
              file: .runner
              capacity: 1
              envs:
                CLEEB: true
                DOCKER_HOST: tcp://127.0.0.1:2376
                DOCKER_TLS_VERIFY: 1
                DOCKER_CERT_PATH: /certs/client
              env_file: .env
              timeout: 3h
              insecure: false
              fetch_timeout: 5s
              fetch_interval: 2s
              labels:
                - ubuntu-latest:docker://ghcr.io/catthehacker/ubuntu:act-latest

            cache:
              enabled: true
              dir: "/cache"
              host: ""
              port: 0

            container:
              network: "host"
              enable_ipv6: false
              privileged: false
              options: -v /certs/client:/certs/client
              docker_host: ""

            host:
              workdir_parent:

            server:
              # Modern connection-declaration flow (Forgejo 15+): the runner
              # authenticates with the pre-created runner UUID + token pair
              # from the instance admin UI, replacing the deprecated
              # `forgejo-runner register` legacy-token command.
              # The template below is rendered by the `setup` init container,
              # which substitutes __RUNNER_UUID__ from the secret.
              connections:
                gitctec:
                  url: https://git.ctec.run
                  uuid: __RUNNER_UUID__
                  token_url: file:/data/runner-token
    controllers:
      forgejo-runner-old:
        type: statefulset
        replicas: 1

        pod:
          securityContext:
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch

        statefulset:
          volumeClaimTemplates:
            - name: data
              globalMounts:
                - path: /data
              accessMode: "ReadWriteOnce"
              size: 1Gi

        initContainers:
          setup:
            image:
              repository: code.forgejo.org/forgejo/runner
              tag: 12.13.2@sha256:eb6e7bc21973382d261e6eb883dbd27b8cb56939d33a3bfd79a1352b7f9a33a0
            command:
              - sh
              - -c
              - |
                set -e
                # Stage the connection token (0600, on the data PVC) and render
                # the UUID into the config template. Runs on EVERY start so a
                # rotated secret (Stakater pod restart) is picked up.
                printf '%s' "$RUNNER_TOKEN" > /data/runner-token
                chmod 600 /data/runner-token
                sed "s/__RUNNER_UUID__/$RUNNER_UUID/" /config/config.yaml > /data/config-rendered.yaml
                echo "Runner connection staged for https://git.ctec.run"
            env:
              # Connection-declaration credentials (Forgejo 15+): UUID + token
              # pair from Site Admin > Actions > Runners > Create new runner.
              - name: RUNNER_TOKEN
                valueFrom:
                  secretKeyRef:
                    name: forgejo-runner-secret
                    key: registration_token
              - name: RUNNER_UUID
                valueFrom:
                  secretKeyRef:
                    name: forgejo-runner-secret
                    key: runner_uuid
        containers:
          daemon:
            image:
              repository: docker
              tag: 29.10.1-dind@sha256:fbbc96e0af32cdc190aff92ba97a1281a115351a723afe21af78879cc55126b0
            resources:
              requests:
                cpu: 10m
                memory: 194Mi
              limits:
                memory: 194Mi
            securityContext:
              privileged: true
            env:
              - name: DOCKER_TLS_CERTDIR
                value: /certs
          app:
            image:
              repository: code.forgejo.org/forgejo/runner
              tag: 12.13.2@sha256:eb6e7bc21973382d261e6eb883dbd27b8cb56939d33a3bfd79a1352b7f9a33a0
            resources:
              requests:
                cpu: 10m
                memory: 100Mi
              limits:
                memory: 100Mi
            command:
              - "sh"
              - "-c"
              - "while ! nc -z localhost 2376 </dev/null; do echo 'waiting for docker daemon...'; sleep 5; done; forgejo-runner --config /data/config-rendered.yaml daemon"
            env:
              - name: DOCKER_HOST
                value: tcp://localhost:2376
              - name: DOCKER_CERT_PATH
                value: /certs/client
              - name: DOCKER_TLS_VERIFY
                value: "1"
        annotations:
          reloader.stakater.com/auto: "true"

    service:
      app:
        controller: *app
        ports:
          http:
            port: 45315

    persistence:
      config:
        type: configMap
        identifier: config
        globalMounts:
          - path: /config

      certs:
        type: emptyDir
      cache:
        type: emptyDir
