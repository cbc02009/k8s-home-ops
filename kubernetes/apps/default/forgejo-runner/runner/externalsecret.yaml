---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name forgejo-runner-k8s-secret
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: *name
    creationPolicy: Owner
  # Connection pair for the rootless runner (Forgejo admin UI > Actions >
  # Runners > Create new runner), stored in the `forgejo` 1Password item as
  # registration_token2 / runner_uuid2. Explicit property refs (not dataFrom)
  # so the item's other fields (the runner-old pair) stay out of this Secret.
  # Keys `token` / `uuid` match the runner-k8s chart's forgejo.secretKeys.
  data:
    - secretKey: token
      remoteRef:
        key: forgejo
        property: registration_token2
    - secretKey: uuid
      remoteRef:
        key: forgejo
        property: runner_uuid2
