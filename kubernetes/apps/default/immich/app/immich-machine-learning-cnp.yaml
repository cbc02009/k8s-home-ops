---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: immich-machine-learning-cnp
  namespace: default
  labels:
    app.kubernetes.io/name: immich-machine-learning
    app.kubernetes.io/component: cilium-policy
    app.kubernetes.io/part-of: kguardian
spec:
  endpointSelector:
    matchLabels:
      k8s:app.kubernetes.io/controller: machine-learning
      k8s:app.kubernetes.io/instance: immich
      k8s:app.kubernetes.io/name: immich
      k8s:igpu-workload: "true"
  description: >-
    Least-privilege policy for workload immich-machine-learning in namespace default, generated by kguardian from observed pod traffic on 2026-11-15.
  ingress:
    # host-network peer kube-system/multus on node miri — endpointSelector cannot match host traffic
    - fromEntities:
        - host
        - remote-node
      toPorts:
        - ports:
            - port: "3003"
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            k8s:app.kubernetes.io/controller: microservices
            k8s:app.kubernetes.io/instance: immich
            k8s:app.kubernetes.io/name: immich
            k8s:igpu-workload: "true"
      toPorts:
        - ports:
            - port: "3003"
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            k8s:app.kubernetes.io/controller: server
            k8s:app.kubernetes.io/instance: immich
            k8s:app.kubernetes.io/name: immich
            k8s:igpu-workload: "true"
      toPorts:
        - ports:
            - port: "3003"
              protocol: TCP
status: {}
