---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: immich-server-cnp
  namespace: default
  labels:
    app.kubernetes.io/name: immich-server
    app.kubernetes.io/component: cilium-policy
    app.kubernetes.io/part-of: kguardian
spec:
  endpointSelector:
    matchLabels:
      k8s:app.kubernetes.io/controller: server
      k8s:app.kubernetes.io/instance: immich
      k8s:app.kubernetes.io/name: immich
      k8s:igpu-workload: "true"
  description: >-
    Least-privilege policy for workload immich-server in namespace default, generated by kguardian from observed pod traffic on 2026-11-15.
  ingress:
    # host-network peer kube-system/multus on node sakura — endpointSelector cannot match host traffic
    - fromEntities:
        - host
        - remote-node
      toPorts:
        - ports:
            - port: "2283"
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            k8s:app.kubernetes.io/component: proxy
            k8s:app.kubernetes.io/managed-by: envoy-gateway
            k8s:app.kubernetes.io/name: envoy
            k8s:gateway.envoyproxy.io/owning-gateway-name: envoy-internal
            k8s:gateway.envoyproxy.io/owning-gateway-namespace: network
            k8s:gateway.networking.k8s.io/gateway-name: envoy-internal
            k8s:io.kubernetes.pod.namespace: network
      toPorts:
        - ports:
            - port: "2283"
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            k8s:app.kubernetes.io/component: proxy
            k8s:app.kubernetes.io/managed-by: envoy-gateway
            k8s:app.kubernetes.io/name: envoy
            k8s:gateway.envoyproxy.io/owning-gateway-name: envoy-internal
            k8s:gateway.envoyproxy.io/owning-gateway-namespace: network
            k8s:gateway.networking.k8s.io/gateway-name: envoy-internal
            k8s:io.kubernetes.pod.namespace: network
      toPorts:
        - ports:
            - port: "2283"
              protocol: TCP
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:app.kubernetes.io/controller: machine-learning
            k8s:app.kubernetes.io/instance: immich
            k8s:app.kubernetes.io/name: immich
      toPorts:
        - ports:
            - port: "3003"
              protocol: TCP
status: {}
