---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: immich-microservices-cnp
  namespace: default
  labels:
    app.kubernetes.io/name: immich-microservices
    app.kubernetes.io/component: cilium-policy
    app.kubernetes.io/part-of: kguardian
spec:
  endpointSelector:
    matchLabels:
      k8s:app.kubernetes.io/controller: microservices
      k8s:app.kubernetes.io/instance: immich
      k8s:app.kubernetes.io/name: immich
      k8s:igpu-workload: "true"
  description: >-
    Least-privilege policy for workload immich-microservices in namespace default, generated by kguardian from observed pod traffic on 2026-11-15.
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:app.kubernetes.io/instance: coredns
            k8s:app.kubernetes.io/name: coredns
            k8s:k8s-app: kube-dns
            k8s:io.kubernetes.pod.namespace: kube-system
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
    - toEndpoints:
        - matchLabels:
            k8s:cnpg.io/cluster: postgres-immich
            k8s:cnpg.io/instanceRole: primary
            k8s:io.kubernetes.pod.namespace: databases
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            k8s:app: immich-dragonfly-db
            k8s:app.kubernetes.io/name: dragonfly
            k8s:role: master
      toPorts:
        - ports:
            - port: "6379"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            k8s:app.kubernetes.io/controller: machine-learning
            k8s:app.kubernetes.io/instance: immich
            k8s:app.kubernetes.io/name: immich
      toPorts:
        - ports:
            - port: "3003"
              protocol: TCP
status: {}
