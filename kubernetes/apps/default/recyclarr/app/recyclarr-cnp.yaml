---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: recyclarr-cnp
  namespace: default
  labels:
    app.kubernetes.io/name: recyclarr
    app.kubernetes.io/component: cilium-policy
    app.kubernetes.io/part-of: kguardian
spec:
  endpointSelector:
    matchLabels:
      k8s:app.kubernetes.io/controller: recyclarr
      k8s:app.kubernetes.io/instance: recyclarr
      k8s:app.kubernetes.io/name: recyclarr
  description: >-
    Least-privilege policy for workload recyclarr in namespace default, generated by kguardian from observed pod traffic on 2026-11-15.
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:app.kubernetes.io/instance: coredns
            k8s:app.kubernetes.io/name: coredns
            k8s:k8s-app: kube-dns
            k8s:io.kubernetes.pod.namespace: kube-system
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
    - toEndpoints:
        - matchLabels:
            k8s:app.kubernetes.io/controller: radarr
            k8s:app.kubernetes.io/instance: radarr
            k8s:app.kubernetes.io/name: radarr
      toPorts:
        - ports:
            - port: "80"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            k8s:app.kubernetes.io/controller: sonarr
            k8s:app.kubernetes.io/instance: sonarr
            k8s:app.kubernetes.io/name: sonarr
      toPorts:
        - ports:
            - port: "80"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            k8s:app.kubernetes.io/controller: animarr
            k8s:app.kubernetes.io/instance: animarr
            k8s:app.kubernetes.io/name: animarr
      toPorts:
        - ports:
            - port: "80"
              protocol: TCP
    - toCIDR:
        - 140.82.112.3/32
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
    - toCIDR:
        - 140.82.112.4/32
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
    - toCIDR:
        - 140.82.113.3/32
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
    - toCIDR:
        - 140.82.113.4/32
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
    - toCIDR:
        - 140.82.114.3/32
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
    - toCIDR:
        - 140.82.114.4/32
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
status: {}
