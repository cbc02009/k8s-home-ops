---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: radarr-cnp
  namespace: default
  labels:
    app.kubernetes.io/name: radarr
    app.kubernetes.io/component: cilium-policy
    app.kubernetes.io/part-of: kguardian
spec:
  endpointSelector:
    matchLabels:
      k8s:app.kubernetes.io/controller: radarr
      k8s:app.kubernetes.io/instance: radarr
      k8s:app.kubernetes.io/name: radarr
  description: >-
    Least-privilege policy for workload radarr in namespace default, generated by kguardian from observed pod traffic on 2026-11-15.
  ingress:
    # host-network peer kube-system/multus on node miri — endpointSelector cannot match host traffic
  - fromEntities:
    - host
    - remote-node
    toPorts:
    - ports:
      - port: "80"
        protocol: TCP
  - fromEndpoints:
    - matchLabels:
        k8s:app.kubernetes.io/controller: prowlarr
        k8s:app.kubernetes.io/instance: prowlarr
        k8s:app.kubernetes.io/name: prowlarr
    toPorts:
    - ports:
      - port: "80"
        protocol: TCP
  - fromEndpoints:
    - matchLabels:
        k8s:app.kubernetes.io/controller: seerr
        k8s:app.kubernetes.io/instance: seerr
        k8s:app.kubernetes.io/name: seerr
    toPorts:
    - ports:
      - port: "80"
        protocol: TCP
  - fromEndpoints:
    - matchLabels:
        k8s:app.kubernetes.io/component: proxy
        k8s:app.kubernetes.io/managed-by: envoy-gateway
        k8s:app.kubernetes.io/name: envoy
        k8s:gateway.envoyproxy.io/owning-gateway-name: envoy-internal
        k8s:gateway.envoyproxy.io/owning-gateway-namespace: network
        k8s:gateway.networking.k8s.io/gateway-name: envoy-internal
        k8s:io.kubernetes.pod.namespace: network
    toPorts:
    - ports:
      - port: "80"
        protocol: TCP
  egress:
  - toEndpoints:
    - matchLabels:
        k8s:cnpg.io/cluster: postgres
        k8s:cnpg.io/instanceRole: primary
        k8s:io.kubernetes.pod.namespace: databases
    toPorts:
    - ports:
      - port: "5432"
        protocol: TCP
  - toEndpoints:
    - matchLabels:
        k8s:app.kubernetes.io/controller: qbittorrent
        k8s:app.kubernetes.io/instance: qbittorrent
        k8s:app.kubernetes.io/name: qbittorrent
    toPorts:
    - ports:
      - port: "8080"
        protocol: TCP
  - toEndpoints:
    - matchLabels:
        k8s:app.kubernetes.io/controller: prowlarr
        k8s:app.kubernetes.io/instance: prowlarr
        k8s:app.kubernetes.io/name: prowlarr
    toPorts:
    - ports:
      - port: "80"
        protocol: TCP
  - toEndpoints:
    - matchLabels:
        k8s:app.kubernetes.io/controller: sabnzbd
        k8s:app.kubernetes.io/instance: sabnzbd
        k8s:app.kubernetes.io/name: sabnzbd
    toPorts:
    - ports:
      - port: "80"
        protocol: TCP
  - toCIDR:
    - 104.21.3.105/32
    toPorts:
    - ports:
      - port: "443"
        protocol: TCP
  - toCIDR:
    - 172.64.80.1/32
    toPorts:
    - ports:
      - port: "443"
        protocol: TCP
status: {}
