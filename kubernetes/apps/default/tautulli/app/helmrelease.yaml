---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app tautulli
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: *app
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:

    defaultPodOptions:
      tolerations:
        - key: llm-workload
          operator: Exists
          effect: NoSchedule
      securityContext:
        runAsUser: 2000
        runAsGroup: 2000
        fsGroup: 2000

    controllers:
      tautulli:

        containers:
          app:
            image:
              repository: ghcr.io/home-operations/tautulli
              tag: 2.19.1

            env:
              TZ: America/New_York

            resources:
              requests:
                cpu: 92m
                memory: 384Mi
              limits:
                memory: 512Mi

    service:
      app:
        controller: *app
        ports:
          http:
            port: &port 8181

    route:
      app:
        hostnames:
          - "{{ .Release.Name }}.ctec.run"
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: https


    persistence:
      config:
        existingClaim: *app
        globalMounts:
          - path: /config
