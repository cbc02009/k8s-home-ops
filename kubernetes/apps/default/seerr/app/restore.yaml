---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: "${PVC_CLAIM:-${APP}}"
spec:
  accessModes:
    - ${PVC_ACCESSMODES:=ReadWriteOnce}
  dataSourceRef:
    apiGroup: kopiur.home-operations.com
    kind: Restore
    name: ${APP}
  resources:
    requests:
      storage: ${PVC_CAPACITY:=5Gi}
  storageClassName: ${PVC_STORAGECLASS:=ceph-block}
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kopiur.home-operations.com/restore_v1alpha1.json
apiVersion: kopiur.home-operations.com/v1alpha1
kind: Restore
metadata:
  name: ${APP}
spec:
  mover:
    securityContext:
      runAsUser: ${APP_UID:=2000}
      runAsGroup: ${APP_GID:=2000}
  policy:
    onMissingSnapshot: Fail
  repository:
    kind: ClusterRepository
    name: nas
  source:
    identity:
      username: seerr
      hostname: downloads
      # sourcePath: /data
      snapshotID: k4ad403b2c7852ea739369d3587361b0c
  target:
    populator: {}
---
apiVersion: kopiur.home-operations.com/v1alpha1
kind: SnapshotPolicy
metadata:
  name: seerr
spec:
  repository:
    kind: ClusterRepository
    name: nas
  sources:
    - pvc:
        name: "${PVC_CLAIM:-${APP}}"
  # CONTINUE the original lineage: keep writing under billing/postgres-data so the
  # new cluster's snapshots dedup against the carried-over history. Remove this
  # block to fork a fresh timeline under payments/postgres-data instead.
  identity:
    username: ${APP}
    hostname: default
  retention:
    keepDaily: 14
    keepWeekly: 6
