---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: grimmory-cnp
  namespace: default
  labels:
    app.kubernetes.io/name: grimmory
    app.kubernetes.io/component: cilium-policy
    app.kubernetes.io/part-of: kguardian
spec:
  endpointSelector:
    matchLabels:
      k8s:app.kubernetes.io/controller: grimmory
      k8s:app.kubernetes.io/instance: grimmory
      k8s:app.kubernetes.io/name: grimmory
  description: >-
    Least-privilege policy for workload grimmory in namespace default, generated by kguardian from observed pod traffic on 2026-11-15.
  ingress:
    # host-network peer kube-system/cilium on node miri — endpointSelector cannot match host traffic
  - fromEntities:
    - host
    - remote-node
    toPorts:
    - ports:
      - port: "6060"
        protocol: TCP
  - fromEndpoints:
    - matchLabels:
        k8s:app.kubernetes.io/component: proxy
        k8s:app.kubernetes.io/managed-by: envoy-gateway
        k8s:app.kubernetes.io/name: envoy
        k8s:gateway.envoyproxy.io/owning-gateway-name: envoy-external
        k8s:gateway.envoyproxy.io/owning-gateway-namespace: network
        k8s:gateway.networking.k8s.io/gateway-name: envoy-external
        k8s:io.kubernetes.pod.namespace: network
    toPorts:
    - ports:
      - port: "6060"
        protocol: TCP
  egress:
  - toEndpoints:
    - matchLabels:
        k8s:app.kubernetes.io/instance: coredns
        k8s:app.kubernetes.io/name: coredns
        k8s:k8s-app: kube-dns
        k8s:io.kubernetes.pod.namespace: kube-system
    toPorts:
    - ports:
      - port: "53"
        protocol: UDP
  - toCIDR:
    - 104.18.37.155/32
    toPorts:
    - ports:
      - port: "443"
        protocol: TCP
  - toCIDR:
    - 172.64.150.101/32
    toPorts:
    - ports:
      - port: "443"
        protocol: TCP
status: {}
