---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: postgres-backup-forgejo
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: postgres-backup-forgejo
  values:
    controllers:
      main:
        type: cronjob
        cronjob:
          schedule: "@daily"
          ttlSecondsAfterFinished: 43200
        pod:
          securityContext:
            runAsUser: 2000
            runAsGroup: 2000
            runAsNonRoot: true
            fsGroup: 2000
            fsGroupChangePolicy: OnRootMismatch
          enableServiceLinks: false
        containers:
          backup:
            image:
              repository: docker.io/prodrigestivill/postgres-backup-local
              tag: 18@sha256:f70742ebe42b2277689b028d1fd15aa80f77cffa01da163cc9f85a6ff1866e7f
            command: ["/backup.sh"]
            envFrom:
              - secretRef:
                  name: postgres-backup-forgejo
            env:
              - name: POSTGRES_HOST
                value: forgejo-postgres.ctec.run
              - name: POSTGRES_DB
                value: "forgejo"
              - name: POSTGRES_CLUSTER
                value: "true"
              - name: BACKUP_KEEP_DAYS
                value: "7"
              - name: BACKUP_KEEP_WEEKS
                value: "4"
              - name: BACKUP_KEEP_MONTHS
                value: "6"
              - name: BACKUP_KEEP_MINS
                value: "7200"
              - name: POSTGRES_EXTRA_OPTS
                value: "-b -C -c -Z6"
              - name: B2_BUCKET
                value: cbc02009-forgejo-backup
          rclone:
            image:
              repository: docker.io/rclone/rclone
              tag: 1.76.0@sha256:7cbeec24a44f206067597c0368be4de90ae19a64d5113c7d1938bd737a81e466
            command: ["/bin/sh", "-c"]
            args:
              - >-
                while true; do
                rclone copy /backups "b2:${B2_BUCKET}/postgres/forgejo"
                --transfers 4 --checkers 8 --log-level ERROR;
                sleep 300;
                done
            envFrom:
              - secretRef:
                  name: postgres-backup-forgejo

    persistence:
      backups:
        enabled: true
        type: nfs
        server: shana.ctec.internal
        path: /mnt/tank/k8s/postgres-backup-forgejo
        globalMounts:
          - path: /backups
