---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: postgres-backup-forgejo
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: postgres-backup-forgejo
  values:
    controllers:
      main:
        type: cronjob
        cronjob:
          schedule: "@daily"
          ttlSecondsAfterFinished: 43200
        pod:
          securityContext:
            runAsUser: 2000
            runAsGroup: 2000
            runAsNonRoot: true
            fsGroup: 2000
            fsGroupChangePolicy: OnRootMismatch
          enableServiceLinks: false
        containers:
          backup:
            image:
              repository: docker.io/prodrigestivill/postgres-backup-local
              tag: 18@sha256:f70742ebe42b2277689b028d1fd15aa80f77cffa01da163cc9f85a6ff1866e7f
            # drop a sentinel on the shared NFS mount once the dump completes (review B3)
            command: ["/bin/sh", "-c", "/backup.sh && touch /backups/.backup-done"]
            envFrom:
              - secretRef:
                  name: postgres-backup-forgejo
            env:
              - name: POSTGRES_HOST
                value: forgejo-postgres.ctec.run
              - name: POSTGRES_DB
                value: "forgejo"
              - name: POSTGRES_CLUSTER
                value: "true"
              - name: BACKUP_KEEP_DAYS
                value: "7"
              - name: BACKUP_KEEP_WEEKS
                value: "4"
              - name: BACKUP_KEEP_MONTHS
                value: "6"
              - name: BACKUP_KEEP_MINS
                value: "7200"
              - name: POSTGRES_EXTRA_OPTS
                value: "-b -C -c -Z6"
          rclone:
            image:
              repository: docker.io/rclone/rclone
              tag: 1.76.0@sha256:7cbeec24a44f206067597c0368be4de90ae19a64d5113c7d1938bd737a81e466
            # Finite sync (review B3): rclone is not an init-capable sidecar in
            # app-template 5.3.0, so it waits (max 6h) for the backup container's
            # .backup-done sentinel, copies once, and EXITS -- the pod completes and
            # ttlSecondsAfterFinished fires. On first run the pre-existing local dumps
            # seed the B2 bucket.
            command:
              - /bin/sh
              - -c
              - >-
                rm -f /backups/.backup-done;
                for _ in $(seq 360); do [ -f /backups/.backup-done ] && break; sleep 60; done;
                rclone copy /backups "b2:cbc02009-forgejo-backup/postgres/forgejo"
                --transfers 4 --checkers 8 --log-level ERROR
            envFrom:
              - secretRef:
                  name: postgres-backup-forgejo

    persistence:
      backups:
        enabled: true
        type: nfs
        server: shana.ctec.internal
        path: /mnt/tank/k8s/postgres-backup-forgejo
        globalMounts:
          - path: /backups
