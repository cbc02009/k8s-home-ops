---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/postgresql.cnpg.io/cluster_v1.json
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: &pgname forgejo-postgres
spec:
  enableSuperuserAccess: true
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:18.7-standard-trixie@sha256:23719505c7cc417b043ffd9998b44ab8d57fec1d92f0bf11b231a1754a5962f2
  postgresql:
    parameters:
      shared_buffers: 256MB
      work_mem: 16MB
      max_connections: "100"
      effective_io_concurrency: "100"
      random_page_cost: "1.2"
  primaryUpdateStrategy: unsupervised
  resources:
    requests:
      cpu: 100m
      memory: 1Gi
    limits:
      memory: 2Gi
  storage:
    size: 20Gi
    storageClass: openebs-hostpath
  superuserSecret:
    name: cloudnative-pg
  bootstrap:
    initdb:
      database: forgejo
      secret:
        name: cloudnative-pg
  managed:
    services:
      additional:
        - selectorType: rw
          serviceTemplate:
            metadata:
              name: *pgname
              annotations:
                external-dns.kubernetes.io/hostname: forgejo-postgres.ctec.run
                lbipam.cilium.io/ips: 10.6.0.23
                gatus.home-operations.com/enabled: "true"
                gatus.home-operations.com/endpoint: |
                  name: forgejo-postgres
                  conditions:
                    - "[CONNECTED] == true"
            spec:
              type: LoadBalancer
      disabledDefaultServices: ["r", "ro"]
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/monitoring.coreos.com/podmonitor_v1.json
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: &cluster forgejo-postgres
spec:
  podMetricsEndpoints:
    - port: metrics
  selector:
    matchLabels:
      cnpg.io/cluster: *cluster
      cnpg.io/podRole: instance
