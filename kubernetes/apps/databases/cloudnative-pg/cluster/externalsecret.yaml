---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name cloudnative-pg
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: *name
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        username: "{{ .super_user }}"
        password: "{{ .super_pass }}"
        aws-access-key-id: "{{ .access_key }}"
        aws-secret-access-key: "{{ .secret_key }}"
        garage-access-key-id: "{{ .garage_access_key }}"
        garage-secret-access-key: "{{ .garage_secret_key }}"
        # forgejo's offsite B2 barman target: creds from the `forgejo`
        # item's b2_access_key / b2_secret_key fields (projected with the
        # forgejo_ prefix by the second dataFrom extract below). The
        # b2-forgejo ObjectStore reads these two keys.
        b2-access-key-id: "{{ .forgejo_b2_access_key }}"
        b2-secret-access-key: "{{ .forgejo_b2_secret_key }}"
  dataFrom:
    - extract:
        key: postgres
    - extract:
        key: forgejo
      rewrite:
        - regexp:
            source: "(.*)"
            target: "forgejo_$1"
