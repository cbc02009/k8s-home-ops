---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app swarmui
  namespace: llm
spec:
  chartRef:
    kind: OCIRepository
    name: *app
  dependsOn: []
  interval: 1h
  values:
    defaultPodOptions:
      priorityClassName: gpu-interactive
      runtimeClassName: nvidia
    # defaultPodOptions:
    #   resourceClaims:
    #     - name: gpu
    #       resourceClaimTemplateName: swarmui-gpu
    # Parked at replicas 0 with the full GPU request in place: this is the
    # only switch for one-way preemption of the llmkube pods (gpu-preemptible,
    # -100) on mayne's single dGPU. Bring it up for image generation:
    #   flux suspend helmrelease swarmui -n llm
    #   kubectl scale deployment swarmui -n llm --replicas=1
    # and hand the GPU back (llmkube rebinds its pending pod automatically):
    #   kubectl scale deployment swarmui -n llm --replicas=0
    #   flux resume helmrelease swarmui -n llm
    # Suspend the HelmRelease, not just the Kustomization: the Flux Helm
    # controller owns this Deployment's replicas and reverts manual scaling.
    controllers:
      swarmui:
        replicas: 0
        annotations:
          reloader.stakater.com/auto: "true"
        # The image's entrypoint (upstream launch-standard-docker.sh) exits
        # without launching if /SwarmUI/dlbackend is root-owned. The PVC's
        # subPath directories are created by the kubelet as root and the pod
        # fsGroup is not applied to subPath subdirectories, so this init
        # container (root, the image's own `fixch` repair) chowns the four
        # persistent subPaths to the app's uid/gid before the app starts.
        initContainers:
          fix-perms:
            image:
              repository: ghcr.io/cbc02009/swarmui
              tag: 66ac87fcc41b5163d6b372658bdf85374a4c8158@sha256:5700e97df54ec3e3ad68e9eda928f823506bf5e707686d03965de476ff0bb88e
            command:
              - chown
              - -R
              - "${APP_UID}:${APP_GID}"
              - /SwarmUI/dlbackend
              - /SwarmUI/Data
              - /SwarmUI/src/BuiltinExtensions/ComfyUIBackend/DLNodes
              - /SwarmUI/src/BuiltinExtensions/ComfyUIBackend/CustomWorkflows
            securityContext:
              runAsUser: 0
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                cpu: "3"
                memory: 8Gi
        pod:
          securityContext:
            runAsUser: ${APP_UID}
            runAsGroup: ${APP_GID}
            fsGroup: ${APP_GID}
            fsGroupChangePolicy: "OnRootMismatch"
          nodeSelector:
            topology.kubernetes.io: "dgpu"
          tolerations:
            - key: llm-workload
              operator: Exists
              effect: NoSchedule
        containers:
          app:
            image:
              repository: ghcr.io/cbc02009/swarmui
              tag: 66ac87fcc41b5163d6b372658bdf85374a4c8158@sha256:5700e97df54ec3e3ad68e9eda928f823506bf5e707686d03965de476ff0bb88e
            env:
              TZ: ${CONFIG_TZ}
            resources:
              requests:
                cpu: 500m
                memory: 10.5Gi
                nvidia.com/gpu: 1
              limits:
                memory: 22.5Gi
                nvidia.com/gpu: 1
    service:
      app:
        controller: swarmui
        ports:
          http:
            port: &port 7801
    route:
      app:
        hostnames:
          - ${HOSTNAME}
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - name: *app
                port: *port

    persistence:
      data:
        existingClaim: "{{ .Release.Name }}"
        globalMounts:
          - path: /SwarmUI/Data
            subPath: data
          - path: /SwarmUI/dlbackend
            subPath: dlbackend
          - path: /SwarmUI/src/BuiltinExtensions/ComfyUIBackend/DLNodes
            subPath: dlnodes
          - path: /SwarmUI/src/BuiltinExtensions/ComfyUIBackend/CustomWorkflows
            subPath: workflows
      output:
        type: nfs
        server: ${CONFIG_TRUENAS_HOST}
        path: /mnt/smoltank/swarmui/output
        globalMounts:
          - path: /SwarmUI/Output
      models:
        type: nfs
        server: ${CONFIG_TRUENAS_HOST}
        path: /mnt/smoltank/swarmui/models
        globalMounts:
          - path: /SwarmUI/Models
