---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
# 1Password item: `wikindie` (login type), fields: user_name, user_pass,
# jwt_secret. The item is fetched through the existing onepassword-connect
# ClusterSecretStore. (Field names use user_name/user_pass rather than
# username/password: ESO's 1Password provider has trouble resolving the
# generic 'password' field on login items.)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: wikindie
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: wikindie-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        WIKINDIE_USER: "{{ .user_name }}:{{ .user_pass }}"
        JWT_SECRET: "{{ .jwt_secret }}"
  dataFrom:
    - extract:
        key: wikindie
