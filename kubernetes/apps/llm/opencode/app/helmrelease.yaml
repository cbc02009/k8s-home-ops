---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app opencode
spec:
  chartRef:
    kind: OCIRepository
    name: *app
  interval: 15m
  dependsOn: []
  values:
    defaultPodOptions:
      automountServiceAccountToken: false
      securityContext:
        runAsUser: 2000
        runAsGroup: 2000
        fsGroup: 2000
        fsGroupChangePolicy: OnRootMismatch
    controllers:
      opencode:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/joryirving/opencode
              tag: 2.3.0@sha256:2db8d1a83eaf101ee56ec7a31b22d259faf5f6169797450dccd163738ceb2b89
            command: ["/etc/opencode/entrypoint.sh"]
            env:
              HOME: &homepath /home/opencode
              LITELLM_API_KEY:
                valueFrom:
                  secretKeyRef:
                    name: litellm-key-opencode
                    key: api-key
              OPENCODE_CONFIG: /etc/opencode/opencode.json
              TZ: ${CONFIG_TZ}
            envFrom:
              - secretRef:
                  name: opencode
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: &port 4096
                  initialDelaySeconds: 30
                  periodSeconds: 30
                  failureThreshold: 5
              readiness:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: *port
                  initialDelaySeconds: 15
                  periodSeconds: 15
                  failureThreshold: 6
            resources:
              requests:
                cpu: 100m
                memory: 512Mi
              limits:
                memory: 8Gi
          codeserver:
            image:
              repository: ghcr.io/coder/code-server
              tag: 4.145.2@sha256:09565f9e07f5624554e295e8bab0e2fec4a7c533eb3cff459ed6596a4d3d7c1c
            env:
              HOME: *homepath
              TZ: ${CONFIG_TZ}
              GH_TOKEN:
                valueFrom:
                  secretKeyRef:
                    name: opencode
                    key: GH_TOKEN
              GITHUB_TOKEN:
                valueFrom:
                  secretKeyRef:
                    name: opencode
                    key: GITHUB_TOKEN
            args:
              [
                "--auth",
                "none",
                "--user-data-dir",
                "/home/opencode/.vscode",
                "--extensions-dir",
                "/home/opencode/.vscode",
                "--port",
                "12321",
                "/home/opencode/projects",
              ]
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                memory: 1Gi
    service:
      app:
        ports:
          http:
            port: *port
          codeserver:
            port: &codeserverPort 12321
    route:
      app:
        hostnames:
          - opencode.ctec.run
        parentRefs:
          - name: envoy-internal
            namespace: network
        rules:
          - backendRefs:
              - name: "{{ .Release.Name }}"
                port: *port
      api:
        hostnames:
          - opencode-api.ctec.run
        parentRefs:
          - name: envoy-internal
            namespace: network
        rules:
          - backendRefs:
              - name: "{{ .Release.Name }}"
                port: *port
      codeserver:
        hostnames:
          - opencode-code.ctec.run
        parentRefs:
          - name: envoy-internal
            namespace: network
        rules:
          - backendRefs:
              - name: "{{ .Release.Name }}"
                port: *codeserverPort
    persistence:
      home:
        existingClaim: *app
        globalMounts:
          - path: *homepath
      config:
        type: configMap
        name: opencode-config
        defaultMode: 0755
        globalMounts:
          - path: /etc/opencode
