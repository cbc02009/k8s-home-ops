---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app kanzo
spec:
  components:
    - ../../../../components/pvc
  interval: 1h
  path: ./kubernetes/apps/llm/kanzo/app
  postBuild:
    substitute:
      APP: *app
      PVC_CAPACITY: 1Gi
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: llm
  wait: false
