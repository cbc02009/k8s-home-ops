---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
# kanzo (https://github.com/emanuele-em/kanzo) is a self-hosted kanban /
# second-brain tool: ONE static musl binary that serves the board at :4242,
# keeps all state under its home directory, and doubles as an MCP server for
# agents. First run creates the data folder in its home dir.
#
# There is no docker image, so:
#   - an init container (python, only for its stdlib urllib/hashlib) runs the
#     fetch-kanzo.py bootstrap from a ConfigMap below: it downloads the pinned
#     release tarball, verifies its published sha256, and installs the binary
#     into the shared /bin-vol emptyDir (skipped on restarts when the pinned
#     version is already installed); it also pins `listen = "0.0.0.0"` in the
#     PVC's config.toml - upstream binds 127.0.0.1 by default, which the
#     kubelet's tcp probes and the service cannot reach (they dial the pod
#     IP), so the pod would be liveness-killed in a loop;
#   - the main container execs /bin-vol/kanzo directly against the kanzo PVC
#     mounted at /kanzo (KANZO_HOME). No python needed at runtime.
#
# Both containers run the same python:3.15-slim image - already a pull-cache
# resident here via litellm-admin-mcp, so no new registry pull. The main
# container uses the image only as a shell for the static binary.
#
# The default pod ids (2000:2000) apply here: kanzo has no user-specific
# requirements, it just writes ordinary files.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kanzo
spec:
  chartRef:
    kind: OCIRepository
    name: kanzo
  interval: 1h
  values:
    defaultPodOptions:
      securityContext:
        fsGroup: 2000
        fsGroupChangePolicy: OnRootMismatch
    configMaps:
      scripts:
        data:
          # Pinned kanzo bootstrap. Bump TAG (and the published SHA256 from
          # the release's .sha256 sidecar) to upgrade kanzo.
          fetch-kanzo.py: |
            #!/usr/bin/env python3
            """One-shot bootstrap: install the pinned kanzo release into /bin-vol
            and pin the HTTP listener config in the PVC home (/kanzo).

            Runs in the init container. The main container execs /bin-vol/kanzo.
            Re-runs are cheap: if the pinned version marker matches, no download.
            """
            import hashlib
            import os
            import re
            import shutil
            import tarfile
            import urllib.request

            TAG = "v0.4.2"
            REPO = "emanuele-em/kanzo"
            ASSET = "kanzo-x86_64-unknown-linux-musl.tar.xz"
            URL = f"https://github.com/{REPO}/releases/download/{TAG}/{ASSET}"
            # From the release's kanzo-x86_64-unknown-linux-musl.tar.xz.sha256 sidecar.
            SHA256 = "146c24e93c943158fae8fe35f070f49414a1f4754832312361dba895d3cbefea"
            DEST_DIR = "/bin-vol"
            EXTRACT_DIR = "/tmp/kanzo-extract"


            def download(url: str, dest: str) -> None:
                print(f"downloading {url}", flush=True)
                tmp = dest + ".part"
                with urllib.request.urlopen(url, timeout=60) as resp, open(tmp, "wb") as f:
                    shutil.copyfileobj(resp, f)
                os.replace(tmp, dest)


            def verify(path: str, expected: str) -> None:
                h = hashlib.sha256()
                with open(path, "rb") as f:
                    for chunk in iter(lambda: f.read(1 << 20), b""):
                        h.update(chunk)
                if h.hexdigest() != expected:
                    os.unlink(path)
                    raise SystemExit(f"sha256 mismatch for {path}: {h.hexdigest()} != {expected}")
                print(f"sha256 ok: {expected}", flush=True)


            def ensure_listen_config() -> None:
                """Pin config.toml's listen to 0.0.0.0 (upstream default is 127.0.0.1).

                The kubelet tcp probes and the service dial the pod IP; with the
                loopback default nothing outside the container can connect, so
                the pod is liveness-killed in a loop ~90s after every start.
                """
                path = "/kanzo/config.toml"
                wanted = 'listen = "0.0.0.0"'
                current = ""
                if os.path.exists(path):
                    with open(path) as f:
                        current = f.read()
                patched, n = re.subn(r"(?m)^listen\s*=.*$", wanted, current)
                if n == 0:
                    prefix = current.rstrip("\n") + "\n" if current.strip() else ""
                    patched = prefix + wanted + "\n"
                if patched != current:
                    tmp = path + ".new"
                    with open(tmp, "w") as f:
                        f.write(patched)
                    os.replace(tmp, path)
                    print(f"config.toml: pinned {wanted} (upstream default is loopback)", flush=True)


            def main() -> None:
                # Run before the version-marker early-return so the listener
                # config is ensured on every init run, not only on fetches.
                ensure_listen_config()
                binary = os.path.join(DEST_DIR, "kanzo")
                marker = os.path.join(DEST_DIR, ".kanzo-version")
                if os.path.exists(binary) and os.path.exists(marker):
                    with open(marker) as f:
                        if f.read().strip() == TAG:
                            print(f"kanzo {TAG} already installed in {DEST_DIR}; skipping fetch", flush=True)
                            return
                tarball = os.path.join(DEST_DIR, "kanzo-release.tar.xz")
                download(URL, tarball)
                verify(tarball, SHA256)
                os.makedirs(EXTRACT_DIR, exist_ok=True)
                with tarfile.open(tarball, "r:xz") as tf:
                    # filter="data": refuse absolute paths / symlinks escaping the dest.
                    tf.extractall(EXTRACT_DIR, filter="data")
                src = os.path.join(EXTRACT_DIR, "kanzo-x86_64-unknown-linux-musl", "kanzo")
                if not os.path.exists(src):
                    raise SystemExit(f"binary not found in release tarball: {src}")
                staging = binary + ".new"
                shutil.move(src, staging)
                os.chmod(staging, 0o755)
                os.replace(staging, binary)
                with open(marker, "w") as f:
                    f.write(TAG)
                os.unlink(tarball)
                shutil.rmtree(EXTRACT_DIR, ignore_errors=True)
                print(f"installed kanzo {TAG} -> {binary}", flush=True)


            if __name__ == "__main__":
                main()
    controllers:
      main:
        type: deployment
        replicas: 1
        initContainers:
          kanzo-fetch:
            image:
              repository: docker.io/library/python
              tag: 3.15-slim@sha256:65a65fc7b30b06cb6df4930fd4650697cb23f4c2698ab81fc87e4b031bc36928
              pullPolicy: IfNotPresent
            command:
              - python3
              - /kanzo-scripts/fetch-kanzo.py
            securityContext:
              allowPrivilegeEscalation: false
              runAsNonRoot: true
              runAsUser: 2000
              runAsGroup: 2000
              seccompProfile:
                type: RuntimeDefault
        containers:
          kanzo:
            image:
              repository: docker.io/library/python
              tag: 3.15-slim@sha256:65a65fc7b30b06cb6df4930fd4650697cb23f4c2698ab81fc87e4b031bc36928
              pullPolicy: IfNotPresent
            command:
              - /bin-vol/kanzo
            args:
              # --no-open: never try to open a browser (headless);
              # --home: all state in the PVC; --port: explicit, independent
              # of whatever the data dir's config.toml may default to.
              - --no-open
              - --port
              - "4242"
              - --home
              - /kanzo
            env:
              # Redundant with --home but keeps any spawned kanzo subcommand
              # (e.g. `kanzo mcp` from an agent) pointed at the same state.
              - name: KANZO_HOME
                value: /kanzo
            ports:
              - name: http
                containerPort: 4242
            # The board at :4242 may gate the UI behind auth, so its HTTP
            # status codes are not a stable readiness signal - probe the
            # TCP port instead.
            probes:
              readiness:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: http
                  initialDelaySeconds: 5
                  periodSeconds: 10
              liveness:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: http
                  initialDelaySeconds: 15
                  periodSeconds: 30
            securityContext:
              allowPrivilegeEscalation: false
              runAsNonRoot: true
              runAsUser: 2000
              runAsGroup: 2000
              seccompProfile:
                type: RuntimeDefault
            # kanzo is a 4.7 MB / ~5 MB-RAM single-process binary - rightsize
            # for that instead of the previous 1Gi envelope.
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                cpu: 500m
                memory: 256Mi
    service:
      http:
        ports:
          http:
            port: 4242
            protocol: HTTP
            primary: true
    route:
      kanzo:
        hostnames:
          - kanzo.ctec.run
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: https
    persistence:
      # Pinned-binary location, shared between init and main containers.
      # Volatile: re-fetched on every pod recreation by the init container.
      bin:
        type: emptyDir
        globalMounts:
          - path: /bin-vol
      # Bootstrap scripts, mounted read-only (ConfigMap volume default) into
      # both containers; only the init container executes them.
      scripts:
        type: configMap
        identifier: scripts
        globalMounts:
          - path: /kanzo-scripts
      # kanzo state (boards, notes) - created by kanzo itself on first run.
      data:
        existingClaim: kanzo
        globalMounts:
          - path: /kanzo
