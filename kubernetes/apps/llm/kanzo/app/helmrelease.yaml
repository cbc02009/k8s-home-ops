---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
# kanzo (https://github.com/emanuele-em/kanzo) is a self-hosted kanban /
# second-brain tool: ONE static musl binary that serves the board at :4242,
# keeps all state under its home directory, and doubles as an MCP server for
# agents. First run creates the data folder in its home dir.
#
# There is no docker image, so:
#   - an init container (python, only for its stdlib urllib/hashlib) runs the
#     fetch-kanzo.py bootstrap from a ConfigMap below: it downloads the pinned
#     release tarball, verifies its published sha256, and installs the binary
#     into the shared /bin-vol emptyDir (skipped on restarts when the pinned
#     version is already installed); it also pins `listen = "0.0.0.0"` in the
#     PVC's config.toml - see the sidecar block for why 0.0.0.0 is still
#     safe;
#   - the main container execs /bin-vol/kanzo directly against the kanzo PVC
#     mounted at /kanzo (KANZO_HOME). No python needed at runtime.
#
# Both containers run the same python:3.15-slim image - already a pull-cache
# resident here via litellm-admin-mcp, so no new registry pull. The main
# container uses the image only as a shell for the static binary.
#
# The default pod ids (2000:2000) apply here: kanzo has no user-specific
# requirements, it just writes ordinary files.
#
# A third container, the proxy sidecar, exists because kanzo refuses
# requests "from other sites" (web.rs `protect`, v0.4.2): the Host header
# must be localhost/loopback, the Origin header only http://<same host>
# (never https), and any NON-LOOPBACK CLIENT IP requires share mode
# (web.rs `guest()` + `guard.lan()`). That is unreachable from a cluster
# gateway by design - DNS-rebinding and cross-site hardening with no
# config knob (SECURITY.md: "a way around any of these is a
# vulnerability"). Upstream's own documented pattern for this is a local
# reverse proxy that does the same-site check itself and then hands kanzo
# "local" requests: Host: localhost:4242, no Origin header, connecting
# over loopback. Our proxy does exactly that (vendor-exact), so kanzo is
# kept loopback-only: `listen = "127.0.0.1"` in the PVC config.toml
# (fetch-kanzo.py pins it) and the service probes/forwards :80 -> the
# sidecar :4243 -> kanzo :4242 over 127.0.0.1. Board exposure is then the
# proxy's rules, vendor-exact (exe.dev/deploy/kanzo): allow Origin empty
# (non-browser clients) or https://kanzo.ctec.run (the board itself);
# anything else gets 403; kanzo receives Host: localhost:4242 and no
# Origin header, so it treats every proxied request as local.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kanzo
spec:
  chartRef:
    kind: OCIRepository
    name: kanzo
  interval: 1h
  values:
    defaultPodOptions:
      securityContext:
        fsGroup: 2000
        fsGroupChangePolicy: OnRootMismatch
    configMaps:
      scripts:
        data:
          # Pinned kanzo bootstrap. Bump TAG (and the published SHA256 from
          # the release's .sha256 sidecar) to upgrade kanzo.
          fetch-kanzo.py: |
            #!/usr/bin/env python3
            """One-shot bootstrap: install the pinned kanzo release into /bin-vol
            and pin the HTTP listener config in the PVC home (/kanzo).

            Runs in the init container. The main container execs /bin-vol/kanzo.
            Re-runs are cheap: if the pinned version marker matches, no download.
            """
            import hashlib
            import os
            import re
            import shutil
            import tarfile
            import urllib.request

            TAG = "v0.4.2"
            REPO = "emanuele-em/kanzo"
            ASSET = "kanzo-x86_64-unknown-linux-musl.tar.xz"
            URL = f"https://github.com/{REPO}/releases/download/{TAG}/{ASSET}"
            # From the release's kanzo-x86_64-unknown-linux-musl.tar.xz.sha256 sidecar.
            SHA256 = "146c24e93c943158fae8fe35f070f49414a1f4754832312361dba895d3cbefea"
            DEST_DIR = "/bin-vol"
            EXTRACT_DIR = "/tmp/kanzo-extract"


            def download(url: str, dest: str) -> None:
                print(f"downloading {url}", flush=True)
                tmp = dest + ".part"
                with urllib.request.urlopen(url, timeout=60) as resp, open(tmp, "wb") as f:
                    shutil.copyfileobj(resp, f)
                os.replace(tmp, dest)


            def verify(path: str, expected: str) -> None:
                h = hashlib.sha256()
                with open(path, "rb") as f:
                    for chunk in iter(lambda: f.read(1 << 20), b""):
                        h.update(chunk)
                if h.hexdigest() != expected:
                    os.unlink(path)
                    raise SystemExit(f"sha256 mismatch for {path}: {h.hexdigest()} != {expected}")
                print(f"sha256 ok: {expected}", flush=True)


            def ensure_listen_config() -> None:
                """Pin config.toml's listen to 127.0.0.1 (upstream's own default).

                The proxy sidecar is kanzo's only real client and it connects
                over loopback; binding the pod IP would expose the board to
                anything that can reach the pod, bypassing kanzo's same-site
                guard. Kubelet probes and the service hit the sidecar instead.
                """
                path = "/kanzo/config.toml"
                wanted = 'listen = "127.0.0.1"'
                current = ""
                if os.path.exists(path):
                    with open(path) as f:
                        current = f.read()
                patched, n = re.subn(r"(?m)^listen\s*=.*$", wanted, current)
                if n == 0:
                    prefix = current.rstrip("\n") + "\n" if current.strip() else ""
                    patched = prefix + wanted + "\n"
                if patched != current:
                    tmp = path + ".new"
                    with open(tmp, "w") as f:
                        f.write(patched)
                    os.replace(tmp, path)
                    print(f"config.toml: pinned {wanted} (upstream default is loopback)", flush=True)


            def main() -> None:
                # Run before the version-marker early-return so the listener
                # config is ensured on every init run, not only on fetches.
                ensure_listen_config()
                binary = os.path.join(DEST_DIR, "kanzo")
                marker = os.path.join(DEST_DIR, ".kanzo-version")
                if os.path.exists(binary) and os.path.exists(marker):
                    with open(marker) as f:
                        if f.read().strip() == TAG:
                            print(f"kanzo {TAG} already installed in {DEST_DIR}; skipping fetch", flush=True)
                            return
                tarball = os.path.join(DEST_DIR, "kanzo-release.tar.xz")
                download(URL, tarball)
                verify(tarball, SHA256)
                os.makedirs(EXTRACT_DIR, exist_ok=True)
                with tarfile.open(tarball, "r:xz") as tf:
                    # filter="data": refuse absolute paths / symlinks escaping the dest.
                    tf.extractall(EXTRACT_DIR, filter="data")
                src = os.path.join(EXTRACT_DIR, "kanzo-x86_64-unknown-linux-musl", "kanzo")
                if not os.path.exists(src):
                    raise SystemExit(f"binary not found in release tarball: {src}")
                staging = binary + ".new"
                shutil.move(src, staging)
                os.chmod(staging, 0o755)
                os.replace(staging, binary)
                with open(marker, "w") as f:
                    f.write(TAG)
                os.unlink(tarball)
                shutil.rmtree(EXTRACT_DIR, ignore_errors=True)
                print(f"installed kanzo {TAG} -> {binary}", flush=True)


            if __name__ == "__main__":
                main()
      proxy:
        data:
          # Same-site gate in front of kanzo, following the vendor's own
          # recipe (exe.dev/deploy/kanzo "Put it behind the proxy"): kanzo
          # refuses "other sites" by design, so this nginx listens on :4243
          # (the service's real endpoint), rejects any browser request whose
          # Origin is neither empty (curl / MCP agents / non-browser) nor
          # our own board URL, then forwards to kanzo over loopback with
          # Host: localhost:4242 and no Origin header - which is all kanzo
          # accepts (web.rs `protect`, v0.4.2: Host must be loopback-ish,
          # Origin only http://<same-host>, non-loopback clients need share
          # mode). No TLS here: the gateway route terminates TLS already.
          nginx.conf: |
            worker_processes 1;
            pid /tmp/nginx.pid;
            error_log /dev/stderr warn;
            events { worker_connections 128; }
            http {
              access_log off;
              client_body_temp_path /tmp/client_temp;
              proxy_temp_path /tmp/proxy_temp;
              fastcgi_temp_path /tmp/fastcgi_temp;
              uwsgi_temp_path /tmp/uwsgi_temp;
              scgi_temp_path /tmp/scgi_temp;
              server {
                listen 4243;
                client_max_body_size 32m;
                location / {
                  set $same_site 0;
                  if ($http_origin = "") { set $same_site 1; }
                  if ($http_origin = "https://kanzo.ctec.run") { set $same_site 1; }
                  if ($same_site = 0) { return 403; }
                  proxy_pass http://127.0.0.1:4242;
                  proxy_http_version 1.1;
                  proxy_set_header Host localhost:4242;
                  proxy_set_header Origin "";
                  proxy_set_header Connection "";
                  proxy_buffering off;
                  proxy_read_timeout 1h;
                }
              }
            }
    controllers:
      main:
        type: deployment
        replicas: 1
        initContainers:
          kanzo-fetch:
            image:
              repository: docker.io/library/python
              tag: 3.15-slim@sha256:65a65fc7b30b06cb6df4930fd4650697cb23f4c2698ab81fc87e4b031bc36928
              pullPolicy: IfNotPresent
            command:
              - python3
              - /kanzo-scripts/fetch-kanzo.py
            securityContext:
              allowPrivilegeEscalation: false
              runAsNonRoot: true
              runAsUser: 2000
              runAsGroup: 2000
              seccompProfile:
                type: RuntimeDefault
        containers:
          kanzo:
            image:
              repository: docker.io/library/python
              tag: 3.15-slim@sha256:65a65fc7b30b06cb6df4930fd4650697cb23f4c2698ab81fc87e4b031bc36928
              pullPolicy: IfNotPresent
            command:
              - /bin-vol/kanzo
            args:
              # --no-open: never try to open a browser (headless);
              # --home: all state in the PVC; --port: explicit, independent
              # of whatever the data dir's config.toml may default to.
              - --no-open
              - --port
              - "4242"
              - --home
              - /kanzo
            env:
              # Redundant with --home but keeps any spawned kanzo subcommand
              # (e.g. `kanzo mcp` from an agent) pointed at the same state.
              - name: KANZO_HOME
                value: /kanzo
            ports:
              - name: http
                containerPort: 4242
            # No probes on kanzo itself: it binds 127.0.0.1 only, and kubelet
            # probes dial the pod IP, so any probe here would fail and kill
            # the container. The proxy sidecar's probes cover the whole
            # chain (nginx -> loopback -> kanzo).
            probes:
              readiness:
                enabled: false
              liveness:
                enabled: false
            securityContext:
              allowPrivilegeEscalation: false
              runAsNonRoot: true
              runAsUser: 2000
              runAsGroup: 2000
              seccompProfile:
                type: RuntimeDefault
            # kanzo is a 4.7 MB / ~5 MB-RAM single-process binary - rightsize
            # for that instead of the previous 1Gi envelope.
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                cpu: 500m
                memory: 256Mi
          # Same-site proxy gate (see the proxy ConfigMap comment): the only
          # container the service routes to, and the only thing allowed to
          # talk to kanzo over loopback.
          proxy:
            image:
              repository: docker.io/library/nginx
              tag: 1.29-alpine@sha256:5616878291a2eed594aee8db4dade5878cf7edcb475e59193904b198d9b830de
              pullPolicy: IfNotPresent
            command: ["nginx", "-c", "/kanzo-proxy/nginx.conf", "-g", "daemon off;"]
            ports:
              - name: proxy
                containerPort: 4243
            # httpGet (not tcpSocket) so the probe traverses nginx -> kanzo:
            # kubelet sends no Origin header, which the same-site gate
            # allows, and kanzo sees a loopback client from the sidecar -
            # so a 200 here proves the whole chain serves.
            probes:
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: proxy
                  initialDelaySeconds: 3
                  periodSeconds: 10
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: proxy
                  initialDelaySeconds: 10
                  periodSeconds: 30
            securityContext:
              allowPrivilegeEscalation: false
              runAsNonRoot: true
              runAsUser: 2000
              runAsGroup: 2000
              seccompProfile:
                type: RuntimeDefault
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                cpu: 500m
                memory: 256Mi
    service:
      http:
        ports:
          http:
            port: 4242
            protocol: HTTP
            primary: true
            # Terminated on the proxy sidecar (:4243), not kanzo itself - the
            # sidecar enforces the same-site gate and forwards to kanzo over
            # loopback.
            targetPort: proxy
    route:
      kanzo:
        hostnames:
          - kanzo.ctec.run
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: https
    persistence:
      # Pinned-binary location, shared between init and main containers.
      # Volatile: re-fetched on every pod recreation by the init container.
      bin:
        type: emptyDir
        globalMounts:
          - path: /bin-vol
      # Bootstrap scripts, mounted read-only (ConfigMap volume default) into
      # both containers; only the init container executes them.
      scripts:
        type: configMap
        identifier: scripts
        globalMounts:
          - path: /kanzo-scripts
      # The proxy sidecar's nginx.conf (see the proxy ConfigMap block above).
      proxy-conf:
        type: configMap
        identifier: proxy
        advancedMounts:
          main:
            proxy:
              - path: /kanzo-proxy
                readOnly: true
      # kanzo state (boards, notes) - created by kanzo itself on first run.
      data:
        existingClaim: kanzo
        globalMounts:
          - path: /kanzo
