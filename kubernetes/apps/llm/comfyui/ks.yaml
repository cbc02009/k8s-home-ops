---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app comfyui
spec:
  interval: 1h
  components:
    - ../../../../components/kopiur
  dependsOn:
    - name: kopiur
      namespace: system
    - name: nvidia-device-plugin
      namespace: system
  path: ./kubernetes/apps/llm/comfyui/app
  postBuild:
    substitute:
      APP: *app
      PVC_CAPACITY: 10Gi
      HOSTNAME: comfyui.ctec.run
  wait: false
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: llm
