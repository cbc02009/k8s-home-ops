---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: camofox
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: camofox-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        # Same value in both keys on purpose: the access key gates every
        # route so the REST API is not open to the whole cluster, the API
        # key gates cookie import. Agents send one bearer (their
        # CAMOFOX_API_KEY) and the server accepts the access key as a
        # superkey for the API-key routes.
        CAMOFOX_ACCESS_KEY: "{{ .api_key }}"
        CAMOFOX_API_KEY: "{{ .api_key }}"
  dataFrom:
    - extract:
        key: camofox
