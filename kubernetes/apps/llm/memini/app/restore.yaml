---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kopiur.home-operations.com/restore_v1alpha1.json
apiVersion: kopiur.home-operations.com/v1alpha1
kind: Restore
metadata:
  name: ${APP}
spec:
  mover:
    securityContext:
      runAsUser: ${APP_UID:=2000}
      runAsGroup: ${APP_GID:=2000}
  # TEMPORARY — cross-namespace restore: aim at the pre-rename `ai` snapshot
  # series until the data is back under `memini@llm`, then revert this file.
  policy:
    onMissingSnapshot: Fail
  repository:
    kind: ClusterRepository
    name: nas
  source:
    # No sourcePath: match any path for the identity; offset default = latest.
    identity:
      username: memini
      hostname: ai
  target:
    populator: {}
