---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kopiur.home-operations.com/restore_v1alpha1.json
apiVersion: kopiur.home-operations.com/v1alpha1
kind: Restore
metadata:
  name: ${APP}
spec:
  mover:
    securityContext:
      runAsUser: ${APP_UID:=2000}
      runAsGroup: ${APP_GID:=2000}
  # TEMPORARY — cross-namespace restore: aim at the pre-rename `ai` snapshot
  # series until the data is back under `memini@llm`, then revert this file.
  policy:
    onMissingSnapshot: Fail
  repository:
    kind: ClusterRepository
    name: nas
  source:
    # The kopia identity triple is username@hostname:sourcePath and the mover
    # matches the path EXACTLY — an absent sourcePath queries `memini@ai:` and
    # matches nothing. The pre-rename ai series was written under /pvc/memini
    # (see tools/rename-ai-to-llm/restores/memini.yaml).
    identity:
      username: memini
      hostname: ai
      sourcePath: /pvc/memini
  target:
    populator: {}
