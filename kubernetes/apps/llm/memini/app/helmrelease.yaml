---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app memini
spec:
  chartRef:
    kind: OCIRepository
    name: *app
  interval: 15m
  dependsOn: []
  install:
    remediation:
      retries: 3
  upgrade:
    timeout: 20m
    cleanupOnFail: true
    remediation:
      retries: 3
      remediateLastFailure: false
  values:
    fullnameOverride: memini
    controllers:
      main:
        # postgres backend: no PVC; replicas > 1 possible if ever needed
        type: deployment
        annotations:
          reloader.stakater.com/auto: "true"
        # Provisioning (postgres backend): home-operations/postgres-init
        # (the same pattern as open-webui's 01-init-db) runs as the cluster
        # superuser using the INIT_POSTGRES_* keys in the `memini` secret:
        # it creates the `memini` role and database, then executes
        # /initdb/memini.sql (postgres-init.yaml), which creates the vchord
        # extension - not a trusted extension (vchord.control:
        # superuser=true), so only a superuser can create it. The app's own
        # first-boot `CREATE EXTENSION IF NOT EXISTS vchord CASCADE` then
        # no-ops. Idempotent: pod (re)starts re-run it as no-ops.
        initContainers:
          01-init-db:
            image:
              repository: ghcr.io/home-operations/postgres-init
              tag: '18.7.0'
            envFrom: &envFrom
              - secretRef:
                  name: memini
            # Mounts the postgres-init-sql persistence item (below) at
            # /initdb/memini.sql; postgres-init executes it after creating
            # the database.
        containers:
          main:
            env:
              MEMINI_API_KEYS_FILE: /etc/memini/api-keys.yaml
              MEMINI_BACKEND: postgres
              # The DSN (and the INIT_POSTGRES_* keys the 01-init-db init
              # container below consumes) arrive via envFrom from the
              # `memini` secret, templated in externalsecret.yaml from the
              # 1Password `memini` item - no password in this manifest.
              MEMINI_DEFAULT_NAMESPACE: default
              MEMINI_EMBED_BASE_URL: http://litellm.llm.svc.cluster.local:4000/v1
              MEMINI_EMBED_MODEL: embed # Qwen3-Embedding-0.6B, 1024-dim, 32k ctx
              MEMINI_EMBED_DIMS: "1024"
              MEMINI_EMBED_QUERY_PREFIX: "Instruct: Given a user message, retrieve relevant past memories\nQuery: "
              MEMINI_EMBED_MAX_CONCURRENCY: 32
              MEMINI_RECALL_EMBED_TIMEOUT: 15s
              MEMINI_WRITE_EMBED_TIMEOUT: 30s
              MEMINI_WRITE_DEDUP_SCORE: "0.80"
              MEMINI_WRITE_DEDUP_ACTION: coalesce
              MEMINI_DEDUP_TIERS: episodic,semantic,procedural
              MEMINI_DEDUP_SIMILARITY: 0.80
              MEMINI_SHORT_TERM_CAP: 300
              MEMINI_ASSESS_BATCH: "5"
              MEMINI_LLM_BASE_URL: http://litellm.llm.svc.cluster.local:4000/v1
              # Z.AI Coding Plan's GLM flash lane (zai-pool). The memory LLM
              # lane now drains the non-rolling Z.AI weekly credits instead of
              # living on the resident 27B; when the Coding Plan's 5h/weekly
              # window dries, zai-pool's fallback chain lands on local-pool, so
              # the 27B stays the floor rather than the primary. The -chat
              # variant (0.7/0.8/penalty 1.5, 16K out) remains the alternative
              # if the assessment calls ever need conversational sampling; it
              # also needs MEMINI_LLM_MAX_TOKENS <= 16384.
              MEMINI_LLM_MODEL: zai-pool
              # MEMINI_LLM_MODEL: qwen3.8-27b-chat
              # Upstream default (4096 via maxTokensOr). 24576 let the 27B decode
              # far past the 60s async consolidation job cap (hardcoded in v0.7.39,
              # internal/service/consolidate.go:27), so the slow merges died on
              # "context deadline exceeded" (14-15/hour in the
              # last week, ~a quarter of all consolidation decisions; the rest
              # were fine) -> those memories got stored raw instead of merged,
              # and the MeminiConsolidateErrors alert ran hot.
              MEMINI_LLM_MAX_TOKENS: "4096"
              MEMINI_DISTILL_TIMEOUT: 600s
              # Keep distillation on so the classifier runs; otherwise all writes land in
              # the working tier and never graduate unless the 24h promoter fires.
              MEMINI_DISTILL_ON_WRITE: "true"
              # Default 24h is fragile under GitOps restarts (the ticker resets on boot).
              # 1h gives a memory multiple chances to promote before any routine rollout.
              MEMINI_PROMOTE_INTERVAL: "1h"
              MEMINI_ASSESSED_SALIENCE_WEIGHT: "0.6"
              MEMINI_REEMBED_ON_MODEL_CHANGE: true
              MEMINI_RERANK: http://litellm.llm.svc.cluster.local:4000/v1
              MEMINI_RERANK_MODEL: rerank
              MEMINI_RERANK_MAX_CONCURRENCY: 2
              MEMINI_RERANK_TIMEOUT: 45s
              MEMINI_PROMOTE_MIN_ACCESS: "3"
              MEMINI_DEMOTE_AFTER: 72h
              MEMINI_RERANK_POOL: "5"
              MEMINI_RERANK_MAX_DOC_CHARS: "4096"
              # Must stay >= POOL * MAX_DOC_CHARS + query + envelope, else memini
              # shards one recall into N *serial* requests and pays the query N times.
              # 5 * 4096 + 512 + 44 = 21036. Paired with rerank contextSize 16384.
              MEMINI_RERANK_MAX_BATCH_CHARS: "24000"
              MEMINI_EMBED_API_KEY:
                valueFrom:
                  secretKeyRef:
                    name: litellm-key-memini
                    key: api-key
              MEMINI_LLM_API_KEY:
                valueFrom:
                  secretKeyRef:
                    name: litellm-key-memini
                    key: api-key
              MEMINI_RERANK_API_KEY:
                valueFrom:
                  secretKeyRef:
                    name: litellm-key-memini
                    key: api-key
              MEMINI_TIMEOUT_MS: "55000"
            envFrom: *envFrom
            probes:
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: 8080
                  initialDelaySeconds: 10
                  periodSeconds: 10
                  failureThreshold: 180
            resources:
              requests:
                cpu: 25m
                memory: 128Mi
              limits:
                memory: 512Mi
      fsck:
        enabled: true
        cronjob:
          schedule: "0 5 * * *"
        containers:
          fsck:
            env:
              MEMINI_API_KEY:
                valueFrom:
                  secretKeyRef:
                    name: memini
                    key: MEMINI_API_KEY
    persistence:
      # The chart's default renders a 5Gi sqlite data PVC (mounted at /data,
      # and into the fsck cronjob as well). All memini data lives in the
      # postgres-ai cluster, so the PVC and its mounts must stay disabled —
      # do not drop this block.
      data:
        enabled: false
      api-keys:
        enabled: true
      # SQL the 01-init-db init container runs as the cluster superuser after
      # creating the role/database (vchord is not a trusted extension, so
      # only the superuser can create it). Mounted into that init container
      # only, via advancedMounts.
      postgres-init-sql:
        type: configMap
        name: memini-postgres-init
        advancedMounts:
          main:
            01-init-db:
              - path: /initdb/memini.sql
                subPath: memini.sql
    route:
      ui:
        enabled: true
        hostnames:
          - ${HOSTNAME}
        parentRefs:
          - name: envoy-external
            namespace: network
    serviceMonitor:
      main:
        enabled: true
    grafanaDashboards:
      enabled: true
      folder: llm
