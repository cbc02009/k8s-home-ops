---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/monitoring.coreos.com/prometheusrule_v1.json
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: memini
spec:
  groups:
    - name: memini.rules
      rules:
        - alert: MeminiRecallDegraded
          expr: |-
            sum(increase(memini_recall_degraded_total[30m])) > 0
          annotations:
            summary: >-
              Memini recall degraded — rerank or embed unavailable, results are falling back
              to unranked order
          labels:
            severity: warning
        # v0.7.39: memini_embed_errors_total counts every failed Embed call, including
        # benign caller-side cancels (hermes aborting a remember mid-flight logs
        # "embed: context canceled", the row is stored vectorless with
        # pending_embed=true, and the backfill loop re-embeds it within one tick —
        # nothing is lost). Those arrive ~1/h, so a raw error-count alert latches
        # ~40min per event and reads as permanently firing. The real signal is the
        # repair queue: vectorless rows piling up faster than backfill drains them
        # means the embed backend itself is down (caller cancels drain in a single
        # tick, so they stay silent). Recall-side impact keeps its own alert above
        # (MeminiRecallDegraded).
        - alert: MeminiEmbedBackfillLag
          expr: |-
            max(memini_embed_backfill_pending) > 20
          for: 15m
          annotations:
            summary: >-
              Memini has {{ $value | printf "%.0f" }} memories waiting for an embed
              repair — the embed backend is failing or too slow to keep up
          labels:
            severity: warning
        - alert: MeminiRerankSaturated
          expr: |-
            min_over_time(memini_rerank_in_flight[15m]) >= 2
          for: 15m
          annotations:
            summary: >-
              Memini rerank has been at its concurrency limit for 15m — CPU inference is
              not keeping up with recall volume
          labels:
            severity: warning
        # Recalibrated 2026-11-21: the 30/day threshold assumed a single human
        # session volume (6-13/day upstream baseline). This cluster runs multiple
        # hermes profiles continuously, so a healthy distiller mints 20-40 semantic
        # facts/hour (~500-1000/day) and the old rule fired permanently. 100+/h for
        # 2h is the real runaway signal (a distill loop or an unbounded session
        # feed), not ordinary load.
        - alert: MeminiFactMintingHigh
          expr: |-
            sum(increase(memini_store_upserts_total{op="insert",tier="semantic"}[1h])) > 100
          for: 2h
          annotations:
            summary: >-
              Memini minted {{ $value | printf "%.0f" }} semantic facts in the last hour and has
              stayed above 100/h — normal for this cluster is 20-40/h, so a sustained rate this
              high means a distill loop or an unbounded session feed
          labels:
            severity: warning
        - alert: MeminiLifecycleStalled
          expr: |-
            sum(increase(memini_store_upserts_total{op="insert",tier=~"semantic|procedural"}[7d])) > 100
            and
            sum(increase(memini_demoted_total[7d]) + increase(memini_dedup_tombstoned_total[7d])) < 5
          for: 6h
          annotations:
            summary: >-
              Memini is accumulating durable facts with almost no demotion or dedup — debris is
              piling up in recall
          labels:
            severity: warning
        - alert: MeminiDistillStalled
          expr: |-
            sum(increase(memini_store_upserts_total{op="insert",tier="episodic"}[6h])) > 10
            and
            sum(increase(memini_store_upserts_total{op="insert",tier="semantic"}[6h])) == 0
          for: 1h
          annotations:
            summary: >-
              Memini is capturing turns but distilling no facts — the distill LLM is likely
              returning empty or unparseable output
          labels:
            severity: warning
        - alert: MeminiConsolidateErrors
          expr: |-
            sum(increase(memini_consolidate_results_total{result="error"}[1h])) > 3
          for: 30m
          annotations:
            summary: >-
              Memini consolidation LLM calls are failing ({{ $value | printf "%.0f" }} errors/h)
          labels:
            severity: warning
