---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name memini-pg
spec:
  # Same pattern as the other postgres-ai consumers (litellm, open-webui):
  # the app's own credential pair comes from the workload's 1Password item
  # (the `memini` item, extended with pg_user/pg_pass), and the cluster
  # superuser keys come from the shared `postgres` item for the createdb
  # bootstrap Job.
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: *name
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        # memini's own role and dedicated database on the shared postgres-ai
        # cluster (both created by the memini-createdb Job before first use).
        dsn: "postgres://{{ .pg_user }}:{{ .pg_pass }}@postgres-ai-rw.databases.svc.cluster.local:5432/memini"
        # Postgres init (same env names open-webui's init uses)
        INIT_POSTGRES_SUPER_USER: "{{ .postgres_super_user }}"
        INIT_POSTGRES_SUPER_PASS: "{{ .postgres_super_pass }}"
        INIT_POSTGRES_USER: "{{ .pg_user }}"
        INIT_POSTGRES_PASS: "{{ .pg_pass }}"
        INIT_POSTGRES_HOST: "postgres-ai-rw.databases.svc.cluster.local"
        INIT_POSTGRES_DBNAME: "memini"
  dataFrom:
    - extract:
        key: memini
    - extract:
        key: postgres
      rewrite:
        - regexp:
            source: "(.*)"
            target: "postgres_$1"
