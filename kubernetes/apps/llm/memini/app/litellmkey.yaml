---
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMVirtualKey
metadata:
  name: memini
spec:
  proxyRef: litellm
  keyAlias: Memini
  secretName: litellm-key-memini
  secretKey: api-key
  # Exactly what the main container requests: the resident 27B LLM lane
  # (both variants, so the -chat alternative in helmrelease.yaml is
  # permission-free) plus the embed/rerank models of the memory pipeline.
  # No pool lanes: the memory pipeline stays pinned to the resident 27B.
  models:
  - qwen3.8-27b
  - qwen3.8-27b-chat
  - embed
  - rerank
