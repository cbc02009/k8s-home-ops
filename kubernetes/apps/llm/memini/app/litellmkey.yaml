---
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMVirtualKey
metadata:
  name: memini
spec:
  proxyRef: litellm
  keyAlias: Memini
  secretName: litellm-key-memini
  secretKey: api-key
  # Exactly what the main container requests: zai-pool (the memory LLM lane;
  # its fallback chain resolves to the local pool), the 27B names (the floor
  # of that chain, and the -chat alternative in helmrelease.yaml), plus the
  # embed/rerank models of the memory pipeline.
  models:
  - zai-pool
  - qwen3.8-27b
  - qwen3.8-27b-chat
  - embed
  - rerank
