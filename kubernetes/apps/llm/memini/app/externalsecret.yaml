---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
# Master API key for the memini server, plus its Postgres configuration, all
# from a single 1Password item (same pattern as open-webui's externalsecret):
#
#   - MEMINI_API_KEY is the bearer token the admin UI signs in with; the
#     server's own key file is rendered from the same value by the chart.
#
#   - The postgres backend lives on the shared `postgres-ai` CNPG cluster
#     (apps/databases/cloudnative-pg/cluster/postgres-ai.yaml). The `memini`
#     item holds the app's own role (pg_user / pg_pass); the `postgres` item
#     holds the cluster superuser (the same one the `cloudnative-pg` secret
#     in the databases section projects, so both stay in sync through
#     1Password).
#
#   - The app container reads only the MEMINI_* keys from this secret (via
#     envFrom). The `01-init-db` init container (helmrelease.yaml; the same
#     ghcr.io/home-operations/postgres-init pattern as open-webui's) reads
#     the INIT_POSTGRES_* keys: it creates the role and database as the
#     superuser, then executes /initdb/memini.sql (postgres-init.yaml) as
#     the superuser - vchord is not a trusted extension
#     (vchord.control: superuser=true), so it must be created by a
#     superuser before memini's first boot (the app's own
#     `CREATE EXTENSION IF NOT EXISTS vchord CASCADE` then no-ops).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name memini
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: *name
    template:
      data:
        MEMINI_API_KEY: "{{ .master_api_key }}"
        # App-role DSN (upstream memini example:
        # postgres://user:pass@host:5432/memini?sslmode=disable).
        MEMINI_POSTGRES_DSN: "postgres://{{ .pg_user }}:{{ .pg_pass }}@postgres-ai-rw.databases.svc.cluster.local:5432/memini?sslmode=disable"
        # postgres-init init container (open-webui pattern): create the
        # role and database as the cluster superuser.
        INIT_POSTGRES_SUPER_USER: "{{ .postgres_super_user }}"
        INIT_POSTGRES_SUPER_PASS: "{{ .postgres_super_pass }}"
        INIT_POSTGRES_USER: "{{ .pg_user }}"
        INIT_POSTGRES_PASS: "{{ .pg_pass }}"
        INIT_POSTGRES_HOST: "postgres-ai-rw.databases.svc.cluster.local"
        INIT_POSTGRES_DBNAME: "memini"
  dataFrom:
    - extract:
        key: memini
    - extract:
        key: postgres
      rewrite:
        - regexp:
            source: "(.*)"
            target: "postgres_$1"
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name memini-api-keys
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: *name
    template:
      data:
        api-keys.yaml: |
          keys:
            - name: openwebui
              secret: "{{ .openwebui_memini_api_key }}"
              default_namespace: openwebui
            - name: hermes
              secret: "{{ .hermes_memini_api_key }}"
              default_namespace: hermes
              # Shared home leg, same binding as the cbc02009 admin key below.
              # Lets hermes' multiplexed gateway read/write the personal
              # namespace (MEMINI_HOME on the hermes client side) even though
              # it sits outside the hermes subtree; per-profile children stay
              # reachable through the default_namespace subtree as before.
              home: personal/cbc02009
            - name: opencode
              secret: "{{ .opencode_api_key }}"
              default_namespace: opencode
            - name: cbc02009
              secret: "{{ .admin_pass }}"
              home: personal/cbc02009
              default_namespace: cbc02009
              admin: true
  dataFrom:
    - extract:
        key: memini
    - extract:
        key: open-webui
      rewrite:
        - regexp:
            source: "(.*)"
            target: "openwebui_$1"
    - extract:
        key: hermes
      rewrite:
        - regexp:
            source: "(.*)"
            target: "hermes_$1"
