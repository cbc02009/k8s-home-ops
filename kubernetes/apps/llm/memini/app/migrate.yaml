---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.config.k8s.io/v1beta1
# One-shot migration: reads the legacy SQLite store (PVC `memini`, mounted
# read-only) and POSTs every memory to the postgres-backed memini server
# (script in migrate-script.yaml). Idempotent — records keep their
# deterministic id, so a re-run after a partial failure is safe. Delete the
# Job object once it completes; the manifest may stay (a re-run is a no-op
# for already-imported records) or be removed in a follow-up commit.
apiVersion: batch/v1
kind: Job
metadata:
  name: memini-migrate
  labels:
    app.kubernetes.io/name: memini
spec:
  backoffLimit: 10
  activeDeadlineSeconds: 7200
  template:
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
      containers:
        - name: migrate
          image: python:3.12-slim@sha256:5e2bdb1b0d542d5039cffb8181c65930093949194a65c365dfb1b0fe13a4fa5b
          command:
            - python
            - /etc/memini-migrate/migrate.py
          env:
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
            - name: MEMINI_URL
              value: http://memini.llm.svc.cluster.local:8080
            - name: MEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: memini
                  key: MEMINI_API_KEY
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 256Mi
          volumeMounts:
            - name: script
              mountPath: /etc/memini-migrate
              readOnly: true
            - name: data
              mountPath: /data
              readOnly: true
      volumes:
        - name: script
          configMap:
            name: memini-migrate-script
        - name: data
          persistentVolumeClaim:
            claimName: memini
