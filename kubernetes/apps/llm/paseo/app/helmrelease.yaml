---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app paseo
spec:
  chartRef:
    kind: OCIRepository
    name: *app
  interval: 15m
  dependsOn: []
  values:
    global:
      # The chart would otherwise generate a default ServiceAccount named
      # after the release, conflicting with serviceaccount.yaml.
      createDefaultServiceAccount: false
    defaultPodOptions:
      # The paseo ServiceAccount carries read-only cluster access (see
      # serviceaccount.yaml); app-template defaults automount to false.
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
    controllers:
      paseo:
        annotations:
          reloader.stakater.com/auto: "true"
        type: deployment
        strategy: Recreate
        serviceAccount:
          name: paseo
        pod:
          # Agent sessions run long; give in-flight work time to finish.
          terminationGracePeriodSeconds: 3600
        initContainers:
          clone:
            image:
              # Self-built ghcr.io/cbc02009/paseo is pending; joryirving's
              # image (opencode + home-ops toolchain) is the stopgap.
              repository: ghcr.io/joryirving/paseo
              tag: 0.15.4@sha256:d4a7e3b47860ef629c134d90d48381429d123fe787431a7bfcd66cc5bd7d278e
            command: ["/bin/bash", "-c"]
            args:
              - |
                # Best-effort pre-clone so agent sessions start with the repo
                # and the bot git identity. Every step is guarded and the
                # script always exits 0, so a failure here (no git, no token,
                # no network, bad permissions) never blocks the daemon.
                # Only bare $vars are used: Flux postBuild envsubst (strict)
                # aborts the build on any braced variable it cannot resolve.
                export HOME=/home/paseo
                umask 077
                mkdir -p "$HOME" /workspace/worktrees 2>/dev/null
                if command -v git >/dev/null 2>&1; then
                  git config --global user.name "mahoro-ai" 2>/dev/null
                  git config --global user.email "354213225+mahoro-ai@users.noreply.github.com" 2>/dev/null
                  git config --global init.defaultBranch main 2>/dev/null
                  git config --global --add safe.directory '*' 2>/dev/null
                  if [ -n "$GH_TOKEN" ]; then
                    printf 'https://x-access-token:%s@github.com\n' "$GH_TOKEN" > "$HOME/.git-credentials" 2>/dev/null
                    git config --global credential.helper store 2>/dev/null
                  fi
                  umask 022
                  if [ ! -d /workspace/k8s-home-ops/.git ]; then
                    git clone --filter=blob:none https://github.com/cbc02009/k8s-home-ops.git /workspace/k8s-home-ops \
                      || echo "WARN: k8s-home-ops clone failed; clone it from a session instead"
                  else
                    git -C /workspace/k8s-home-ops fetch --all --prune 2>/dev/null
                  fi
                else
                  echo "git unavailable; skipping repo pre-clone"
                fi
                exit 0
            env:
              - name: GH_TOKEN
                valueFrom:
                  secretKeyRef:
                    name: paseo
                    key: GH_TOKEN
        containers:
          app:
            image:
              # Self-built ghcr.io/cbc02009/paseo is pending; joryirving's
              # image (opencode + home-ops toolchain) is the stopgap.
              repository: ghcr.io/joryirving/paseo
              tag: 0.15.4@sha256:d4a7e3b47860ef629c134d90d48381429d123fe787431a7bfcd66cc5bd7d278e
            # The image's CMD is the builder's paseo-start wrapper, which
            # aborts without PASEO_PASSWORD/LITELLM_API_KEY and installs the
            # builder's own paseo.json/opencode.json. Bypass it: run the stock
            # entrypoint (under tini) with no args so the daemon starts on its
            # default config: listen 0.0.0.0:6767, web UI on, no relay, no auth.
            # A PASEO_PASSWORD can be set later for defense-in-depth.
            command: ["/usr/bin/tini", "--", "/bin/bash", "-c"]
            args: ["exec /usr/local/bin/paseo-docker-entrypoint"]
            env:
              - name: TZ
                value: ${CONFIG_TZ}
            envFrom:
              # Bot github token (GH_TOKEN / GITHUB_TOKEN) for agent sessions.
              - secretRef:
                  name: paseo
            probes:
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/health
                    port: &port 6767
                  failureThreshold: 60
                  periodSeconds: 10
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/health
                    port: *port
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/health
                    port: *port
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop: ["ALL"]
              # readOnlyRootFilesystem is a follow-up hardening step: enable
              # once the daemon's write paths are confirmed to stay on the PVC
              # (/home/paseo) and /tmp.
            resources:
              requests:
                cpu: 100m
                memory: 512Mi
              limits:
                memory: 8Gi
    service:
      app:
        ports:
          http:
            port: *port
    route:
      app:
        # LAN only: envoy-internal is the private LB (internal.ctec.run).
        # No envoy-external / Cloudflare tunnel route.
        hostnames:
          - paseo.ctec.run
        parentRefs:
          - name: envoy-internal
            namespace: network
        rules:
          - backendRefs:
              - identifier: app
                port: http
    persistence:
      data:
        existingClaim: *app
        globalMounts:
          # Daemon state (PASEO_HOME, agent creds, git identity) plus the
          # code workspace Paseo sessions and worktrees operate in.
          - path: /home/paseo
            subPath: home
          - path: /workspace
            subPath: workspace
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
