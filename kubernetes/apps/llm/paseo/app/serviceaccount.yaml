---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: paseo
---
# Read-only cluster access for the agent sessions the daemon spawns.
# Deliberately no write rules: cluster changes go through the GitOps repo.
# The toolhive MCP gateway remains available for broader tool access.
#
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/rbac.authorization.k8s.io/clusterrolebinding_v1.json
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: llm-paseo-view
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: view
subjects:
  - kind: ServiceAccount
    name: paseo
    namespace: llm
