---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name paseo
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: *name
    template:
      engineVersion: v2
      data:
        GH_TOKEN: "{{ .bot_github_token }}"
        GITHUB_TOKEN: "{{ .bot_github_token }}"
  dataFrom:
    # Bot token (mahoro-ai) — same item the opencode and hermes apps use.
    - extract:
        key: mahoro-github
      rewrite:
        - regexp:
            source: "(.*)"
            target: "bot_$1"
