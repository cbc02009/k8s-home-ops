---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app paseo
spec:
  components:
    - ../../../../components/kopiur
  dependsOn:
    - name: external-secrets
      namespace: security
  interval: 1h
  path: ./kubernetes/apps/llm/paseo/app
  postBuild:
    substitute:
      APP: *app
      # The image runs as its built-in paseo user (uid/gid 1000).
      APP_GID: "1000"
      APP_UID: "1000"
      PVC_CAPACITY: 20Gi
  wait: false
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: llm
