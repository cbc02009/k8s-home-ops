---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/litellm.home-operations.com/litellmvirtualkey_v1alpha1.json
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMVirtualKey
metadata:
  name: hermes
spec:
  proxyRef: litellm
  keyAlias: Hermes
  secretName: litellm-key-hermes
  secretKey: api-key
  # Empty list permits every model on the proxy. Enumerating lanes here can't
  # keep up with pool members: an allow-listed pool gives no control over
  # which backend serves a request, which defeats diagnosis. With no
  # allow-list the agent can address any individual model directly for
  # testing/verification. Chat/agentic routing is unaffected — it still
  # flows through config.yaml's complexity router and its pools.
  models: []
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/pushsecret_v1alpha1.json
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: hermes
spec:
  secretStoreRefs:
  - name: onepassword-connect
    kind: ClusterSecretStore
  selector:
    secret:
      name: litellm-key-hermes
  data:
  - match:
      secretKey: api-key
      remoteRef:
        remoteKey: litellm
        property: hermes_api_key
