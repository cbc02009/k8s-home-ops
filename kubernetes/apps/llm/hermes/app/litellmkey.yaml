---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/litellm.home-operations.com/litellmvirtualkey_v1alpha1.json
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMVirtualKey
metadata:
  name: hermes
spec:
  proxyRef: litellm
  keyAlias: Hermes
  secretName: litellm-key-hermes
  secretKey: api-key
  # Exactly the lanes config.yaml references: the default (auto, plus the
  # pool lanes its complexity router resolves to), the fallback chain, the
  # delegation roles and the auxiliary. No embed/rerank (the memini plugin
  # talks to the memini server, which holds its own key for those), and no
  # go-coder/go-strong/go-max single lanes (opencode's escalation lanes;
  # hermes escalates via the pools).
  models:
  - auto
  # Simple/medium lane the complexity router resolves to (27B + Go free rungs).
  - local-free-pool
  - reasoning-pool
  - local-pool
  - qwen3.8-27b
  - qwen3.8-27b-chat
  - implementation-pool
  - frontier-pool
  - go-pool
  - go-chat
  # Z.AI Coding Plan lane: the mutual fallback for the Go lanes (its weekly
  # credits do not roll over, so the traffic is wanted, not just tolerated).
  - zai-pool
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/pushsecret_v1alpha1.json
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: hermes
spec:
  secretStoreRefs:
  - name: onepassword-connect
    kind: ClusterSecretStore
  selector:
    secret:
      name: litellm-key-hermes
  data:
  - match:
      secretKey: api-key
      remoteRef:
        remoteKey: litellm
        property: hermes_api_key
