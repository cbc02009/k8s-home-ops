---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name hermes
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: *name
    template:
      data:
        GITHUB_TOKEN: "{{ .bot_github_token }}"
        GH_TOKEN: "{{ .bot_github_token }}"
        LITELLM_API_KEY: "{{ .litellm_hermes_api_key }}"
        MEMINI_API_KEY: "{{ .memini_api_key }}"
        # Discord bot: token + owner allowlist from the hermes item. The
        # home channel doubles as the only server channel the bot answers
        # in (mention-free there) and where cron/proactive messages land;
        # DMs from allowed users are unaffected by the channel restriction.
        DISCORD_BOT_TOKEN: "{{ .discord_bot_token }}"
        DISCORD_ALLOWED_USERS: "{{ .discord_allowed_users }}"
        DISCORD_HOME_CHANNEL: "{{ .discord_home_channel }}"
        DISCORD_ALLOWED_CHANNELS: "{{ .discord_home_channel }}"
        DISCORD_FREE_RESPONSE_CHANNELS: "{{ .discord_home_channel }}"
        # The home channel is mention-free (free-response); without this flag
        # Hermes replies inline, stacking every conversation in one shared
        # channel. Enabling auto-threading opens a thread per top-level
        # message (Slack-style) so each task gets an isolated conversation.
        # Requires DISCORD_AUTO_THREAD (default on); replies and voice-linked
        # channels still reply inline, and DISCORD_NO_THREAD_CHANNELS wins.
        DISCORD_FREE_RESPONSE_AUTO_THREAD: "true"
  dataFrom:
    - extract:
        key: hermes
    - extract:
        key: litellm
      rewrite:
        - regexp:
            source: "(.*)"
            target: "litellm_$1"
    - extract:
        key: mahoro-github
      rewrite:
        - regexp:
            source: "(.*)"
            target: "bot_$1"
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name hermes-dashboard
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: *name
    template:
      data:
        HERMES_DASHBOARD_OIDC_CLIENT_ID: "{{ .oidc_id }}"
        HERMES_DASHBOARD_OIDC_ISSUER: https://auth.ctec.run/application/o/hermes/
  dataFrom:
    - extract:
        key: hermes
