---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name hermes
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  # Single-field fetch. For 1Password remoteRefs, `key` is the item title
  # and `property` the field within it (default "password"). The
  # mahoro-ai-forgejo login item also carries a default "Email address"
  # field whose name contains a space (an invalid secret-key character), so
  # a dataFrom whole-item extract is unusable for it.
  data:
    - secretKey: forgejo_api_key
      remoteRef:
        key: mahoro-ai-forgejo
        property: api_key
  target:
    name: *name
    template:
      data:
        # Camofox access
        CAMOFOX_API_KEY: "{{ .camofox_api_key }}"
        # GitHub: no token in this secret anymore. git authenticates to
        # github.com over SSH with the deploy key delivered by the
        # hermes-git-ssh ExternalSecret (git-ssh.yaml), and a deploy key
        # cannot be used against the GitHub REST API — the sanctioned
        # GitHub API path is the toolhive github-mcp server.
        #
        # Forgejo (git.cnas.dev): token for the mahoro-ai bot user, used
        # for git over HTTPS and the Forgejo API. The init container
        # writes it into .git-credentials for the git.cnas.dev host.
        FORGEJO_TOKEN: "{{ .forgejo_api_key }}"
        LITELLM_API_KEY: "{{ .litellm_hermes_api_key }}"
        MEMINI_API_KEY: "{{ .memini_api_key }}"
        # OpenCode console usage key (hermes item, field usage_key): a
        # read-only (Usage: Read) opencode.ai console key for usage and
        # per-agent research. Deliberately aliased to OC_USAGE_READER:
        # the canonical OPENCODE_GO_API_KEY name is a managed Hermes
        # provider credential that the child-env scrub strips from agent
        # session shells, while this unmanaged name survives it (verified
        # against the session env builder).
        OC_USAGE_READER: "{{ .usage_key }}"
        # Discord bot: token + owner allowlist from the hermes item. The
        # home channel doubles as the only server channel the bot answers
        # in (mention-free there) and where cron/proactive messages land;
        # DMs from allowed users are unaffected by the channel restriction.
        DISCORD_BOT_TOKEN: "{{ .discord_bot_token }}"
        DISCORD_ALLOWED_USERS: "{{ .discord_allowed_users }}"
        DISCORD_HOME_CHANNEL: "{{ .discord_home_channel }}"
        DISCORD_ALLOWED_CHANNELS: "{{ .discord_home_channel }}"
        DISCORD_FREE_RESPONSE_CHANNELS: "{{ .discord_home_channel }}"
        # The home channel is mention-free (free-response); without this flag
        # Hermes replies inline, stacking every conversation in one shared
        # channel. Enabling auto-threading opens a thread per top-level
        # message (Slack-style) so each task gets an isolated conversation.
        # Requires DISCORD_AUTO_THREAD (default on); replies and voice-linked
        # channels still reply inline, and DISCORD_NO_THREAD_CHANNELS wins.
        DISCORD_FREE_RESPONSE_AUTO_THREAD: "true"
  dataFrom:
    - extract:
        key: hermes
    - extract:
        key: litellm
      rewrite:
        - regexp:
            source: "(.*)"
            target: "litellm_$1"
    - extract:
        key: camofox
      rewrite:
        - regexp:
            source: "(.*)"
            target: "camofox_$1"
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name hermes-dashboard
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: *name
    template:
      data:
        HERMES_DASHBOARD_OIDC_CLIENT_ID: "{{ .oidc_id }}"
        HERMES_DASHBOARD_OIDC_ISSUER: https://auth.ctec.run/application/o/hermes/
  dataFrom:
    - extract:
        key: hermes
