---
# yaml-language-server: $schema=https://kubernetes-schemas.home-operations.com/v1_configmap.json
apiVersion: v1
kind: ConfigMap
metadata:
  name: hermes-config
  namespace: llm
  labels:
    app.kubernetes.io/part-of: hermes
data:
  config.yaml: |
    model:
      # Complexity router: simple/medium traffic shares the hybrid
      # free-pool (resident 27B as ~43% primary via weight, plus Go's
      # zero-allowance free rungs); only complex/reasoning turns burn the
      # shared Go allowance (reasoning-pool). Sessions re-classify per user
      # turn (no hour-long freeze) but replay the held decision across an
      # agent loop's tool continuations, so a long loop neither re-classifies
      # per step nor switches tiers mid-loop.
      default: auto
      provider: litellm
      # The router's window isn't discoverable via /v1/models, so without this
      # hermes assumes 256k and computes a 192k compression trigger.
      # 2026-11-24: pinned at 524288 (trigger = 0.50 x pin = ~256k, residual
      # ~256k). 524288 is the smallest pin above the compressor's 512k
      # _SMALL_CTX_WINDOW_LIMIT, so the configured 0.50 threshold actually
      # governs — below 512k the code floors the trigger at 75% regardless
      # of compression.threshold. Measured live working set is ~100-120k
      # tokens, so a ~256k trigger gives ~2x headroom: compaction fires
      # only on genuinely large sessions while average prefill stays
      # roughly half of what a 1M pin (trigger ~500k) costs per turn.
      context_length: 524288
    fallback_providers:
      # Last resort if the whole pool chain fails: the local pool first
      # (the resident 27B rung answers when it is up; the free Go rungs
      # answer when it is not — no cost while healthy), then the Z.AI
      # Coding Plan lane (the mutual fallback for the Go pool — its weekly
      # credits do not roll over), then workhorse-pool as the cloud
      # overflow. The bare qwen3.8-27b rung was dropped as the first hop:
      # it waits on the same preemptible pod the pool already contains,
      # so listing it first only re-introduced the long wait on a down
      # 27B that the pool lanes were built to avoid.
      - provider: litellm
        model: free-pool
      - provider: litellm
        model: zai-pool
      - provider: litellm
        model: workhorse-pool
    providers:
      litellm:
        base_url: http://litellm.llm:4000/v1
        api_key: $${LITELLM_API_KEY}
        # OpenCode Go (the workhorse-pool / reasoning-pool / frontier rungs) rejects
        # requests without a session id (400 MissingSessionID): LiteLLM
        # forwards x-litellm-session-id as x-opencode-session but never
        # invents one. Opt in per provider entry so hermes sends its stable
        # per-conversation key on every request through this relay — fixes
        # the 400s and keeps each conversation pinned to one Go backend
        # (warm prompt cache).
        session_affinity_header: x-litellm-session-id
    toolsets:
      - hermes-cli
      - hermes-discord
    terminal:
      backend: local
      cwd: /opt/data/workspace
      timeout: 180
      persistent_shell: true
    memory:
      provider: memini
      auto_migrate: true
      # 2026-11-24: doubled from stock (2200/1375). Pod logs showed the built-in
      # MEMORY.md/USER.md stores pinned at 93%/92% with writes rejected at the
      # cap; memini recall is unaffected by these limits and stays the long-term
      # store. Cost is ~1300 extra prompt tokens/session on a 262k context.
      memory_char_limit: 4400
      user_char_limit: 2750
    compression:
      enabled: true
      threshold: 0.50
      target_ratio: 0.20
      protect_last_n: 20
    agent:
      max_turns: 90
      gateway_timeout: 1800
      restart_drain_timeout: 60
      api_max_retries: 2
      reasoning_effort: medium
    approvals:
      mode: smart
    display:
      platforms:
        discord:
          tool_progress: "off"
    streaming:
      enabled: false
    delegation:
      roles:
        # Fast 1M-context cloud lane for parallel exploration and review.
        explorer:
          provider: litellm
          model: workhorse-pool
          max_concurrent_children: 4
        # Stable local lane: the always-resident 27B — free and always available.
        agentic-local:
          provider: litellm
          model: free-pool
          max_concurrent_children: 1
        implementer:
          provider: litellm
          model: implementation-pool
        reviewer:
          provider: litellm
          model: workhorse-pool
        # Rare deep-consultation role on the rationed flagship lane.
        oracle:
          provider: litellm
          model: frontier-pool
          max_concurrent_children: 1
        # Cheap always-on cloud vision (no-training Go lane) — replaces the
        # decommissioned strata local engine.
        vision-cloud:
          provider: litellm
          model: workhorse-pool
          max_concurrent_children: 1
      max_iterations: 250
    gateway:
      # One gateway process serves every profile (routed turns). The
      # per-profile s6 slots under /run/hermes-service are created at boot
      # but stay down; only the default slot's gateway runs. This tracks the
      # live pod, which has served all profiles this way; flipping it to
      # false would stop every non-default profile's bot from being served
      # on the next deploy. Per-profile isolation comes from the framework's
      # routed-turn machinery (secret scopes, the memini namespace pins in
      # the HelmRelease env), not from per-profile gateway processes.
      multiplex_profiles: true
    webapp:
      # The browser-hosted Desktop workspace (v0.23.0+), served by the
      # gateway's own HTTP listener. Enabling it moves that listener from
      # the API-server port (8642) to webapp.port (9120).
      enabled: true
      # A wildcard bind engages the sign-in gate; the provider is the
      # dashboard's OIDC config (HERMES_DASHBOARD_OIDC_* in the app
      # container). public_url is the address the reverse proxy serves
      # the Webapp at, and it fixes the OIDC callback origin:
      # https://hermes.ctec.run/auth/callback.
      host: 0.0.0.0
      port: 9120
      public_url: https://hermes.ctec.run
    # Sign-in gate. issuer/client_id/client_secret come from env
    # (HERMES_DASHBOARD_OIDC_*); only the scope list lives here because it
    # is static. offline_access is REQUIRED for refresh tokens: Authentik
    # mints a refresh token only when the authorization request carries
    # that scope, and rejects a refresh without it (invalid_scope). Without
    # it every session is access-token-only and dies with the 1h AT.
    dashboard:
      oauth:
        self_hosted:
          scopes: openid profile email offline_access
    security:
      redact_secrets: true
    privacy:
      redact_pii: true
    platform_toolsets:
      cli:
        - hermes-cli
        # Opt-in: the built-in multi-profile kanban board is OFF by default
        # (hermes `tools` default-off list). Enabling it here turns on the
        # kanban_* tools for every profile (the base config is the parent that
        # each profile home is created from), so all agents can create/read/
        # move cards and request review on the shared board.
        - kanban
      discord:
        - hermes-discord
        - kanban
    mcp_servers:
      toolhive-ops:
        url: http://vmcp-mcp-gateway-ops.llm.svc.cluster.local:4483/mcp
      toolhive-dev:
        url: http://vmcp-mcp-gateway-dev.llm.svc.cluster.local:4483/mcp
    auxiliary:
      # Always-on cheap cloud vision (no-training Go lane).
      vision:
        provider: litellm
        model: workhorse-pool
      # Cloud aux lanes (2026-11-24): primaries moved off qwen3.8-27b-chat —
      # the gpu-preemptible engine goes Pending when SwarmUI holds the GPU,
      # and each lane then burned its whole timeout on a dead primary before
      # the chain kicked in (approval exhausted 60s + all fallbacks on
      # 2026-11-24). workhorse-pool is the shared Go lane (1M window, ~1s
      # answers). The fallback chains keep free-pool: when the
      # resident 27B is up, its free rung covers outages of the paid lane
      # at no extra cost.
      compression:
        provider: litellm
        model: zai-pool
        timeout: 180
        fallback_chain:
          - provider: litellm
            model: free-pool
          - provider: litellm
            model: workhorse-pool
      web_extract:
        provider: litellm
        model: workhorse-pool
        timeout: 120
        fallback_chain:
          - provider: litellm
            model: free-pool
      approval:
        provider: litellm
        model: workhorse-pool
        timeout: 60
        fallback_chain:
          - provider: litellm
            model: free-pool
      session_search:
        provider: litellm
        model: workhorse-pool
        timeout: 120
        fallback_chain:
          - provider: litellm
            model: free-pool
    _config_version: 55
