---
# TRANSIENT migration pin (ai -> llm namespace rename) — same pattern as the
# downloads -> default move (cf. plex/qbittorrent app/restore.yaml in git
# history). hermes's chat data is NOT re-downloadable: its kopia snapshots
# live under the old `ai` namespace identity (hermes@ai:/pvc/hermes), and the
# ai SnapshotPolicy CRs were pruned with the namespace, so the shared
# component's fromPolicy-based Restore cannot see them and would silently
# continue with an EMPTY volume (spec.policy.onMissingSnapshot: Continue —
# this bit litellm during the cutover). This file instead restores from the
# raw kopia identity (onMissingSnapshot: Fail — loud if the snapshot is
# missing) and re-declares the claim, policy and schedule under the new
# `llm` identity so backups continue.
# REMOVE this file (and re-enable components/kopiur in ../ks.yaml) once
# `kubectl -n llm get snapshotpolicy hermes` shows fresh llm snapshots of the
# restored data.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: "${PVC_CLAIM:-${APP}}"
spec:
  accessModes:
    - ${PVC_ACCESSMODES:=ReadWriteOnce}
  dataSourceRef:
    apiGroup: kopiur.home-operations.com
    kind: Restore
    name: ${APP}
  resources:
    requests:
      storage: ${PVC_CAPACITY:=5Gi}
  storageClassName: ${PVC_STORAGECLASS:=ceph-block}
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kopiur.home-operations.com/restore_v1alpha1.json
apiVersion: kopiur.home-operations.com/v1alpha1
kind: Restore
metadata:
  name: ${APP}
spec:
  mover:
    securityContext:
      runAsUser: ${APP_UID:=2000}
      runAsGroup: ${APP_GID:=2000}
  policy:
    onMissingSnapshot: Fail
  repository:
    kind: ClusterRepository
    name: nas
  source:
    identity:
      username: ${APP}
      hostname: ai
      sourcePath: /pvc/${APP}
  target:
    populator: {}
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kopiur.home-operations.com/snapshotpolicy_v1alpha1.json
apiVersion: kopiur.home-operations.com/v1alpha1
kind: SnapshotPolicy
metadata:
  name: ${APP}
  annotations:
    kopiur.home-operations.com/allow-identity-change: "true"
spec:
  compression:
    compressor: zstd
  mover:
    cache:
      capacity: ${PVC_CAPACITY:=5Gi}
      mode: Ephemeral
      storageClassName: ${PVC_STORAGECLASS:=ceph-block}
    securityContext:
      runAsUser: ${APP_UID:=2000}
      runAsGroup: ${APP_GID:=2000}
  repository:
    kind: ClusterRepository
    name: nas
  retention:
    keepLatest: 3
    keepHourly: 24
    keepDaily: 7
    keepWeekly: 4
  sources:
    - pvc:
        name: "${KOPIUR_CLAIM:-${APP}}"
  volumeSnapshotClassName: ${PVC_SNAPSHOTCLASS:=csi-ceph-blockpool}
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kopiur.home-operations.com/snapshotschedule_v1alpha1.json
apiVersion: kopiur.home-operations.com/v1alpha1
kind: SnapshotSchedule
metadata:
  name: ${APP}
spec:
  policyRef:
    name: ${APP}
  schedule:
    cron: H * * * *
