---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: hermes
spec:
  chartRef:
    kind: OCIRepository
    name: hermes
  interval: 15m
  dependsOn: []
  values:
    defaultPodOptions:
      securityContext:
        fsGroup: 10000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: { type: RuntimeDefault }
    controllers:
      hermes:
        annotations:
          reloader.stakater.com/auto: "true"
        initContainers:
          init:
            image:
              repository: docker.io/library/alpine
              tag: "3.24"
            env:
              # envsubst expands ${LITELLM_API_KEY} in config.yaml (see below).
              - name: LITELLM_API_KEY
                valueFrom:
                  secretKeyRef:
                    name: hermes
                    key: LITELLM_API_KEY
              # Required by the git credential setup below; set -u aborts
              # the init script if it is not present in the container env.
              - name: GITHUB_TOKEN
                valueFrom:
                  secretKeyRef:
                    name: hermes
                    key: GITHUB_TOKEN
              # Required by the git credential setup below; set -u aborts
              # the init script if it is not present in the container env.
              - name: FORGEJO_TOKEN
                valueFrom:
                  secretKeyRef:
                    name: hermes
                    key: FORGEJO_TOKEN
            command:
              - sh
              - -c
              - |
                set -euo pipefail
                # git is needed for the credential/clone setup below (alpine
                # ships without it); gettext provides envsubst.
                apk add --no-cache gettext git >/dev/null
                # The kopiur mover reads this PVC as uid 10000 (shared kopiur
                # component). Files left by pre-s6 root-running image
                # generations (e.g. /opt/data/.bash_history) and by the
                # since-removed code-server sidecar (uid 1000) are owned by
                # other uids, and the app image's stage2 hook deliberately
                # only chowns its known subpaths, never the volume top
                # level — so the mover hit PermissionDenied on snapshot.
                # Repair the whole tree up front; the per-file chowns below
                # keep files written by this script aligned too.
                chown -R 10000:10000 /opt/data
                cp /tmp/config.yaml /opt/data/config.yaml
                # Expand env-var references from the pod env before hermes
                # reads the config. v0.21.5 stopped expanding LITELLM_API_KEY
                # in provider values at config-load time, which broke model
                # calls with 401s from LiteLLM. envsubst has access to the
                # same env (LITELLM_API_KEY is injected via the hermes secret
                # envFrom). No dollar-brace literals in this script on
                # purpose: the hermes kustomization runs strict flux postBuild
                # substitution and any unescaped one fails the whole build
                # (configmap.yaml shows the double-dollar escape convention
                # for values that must survive it).
                envsubst < /opt/data/config.yaml > /opt/data/config.yaml.tmp
                mv /opt/data/config.yaml.tmp /opt/data/config.yaml
                chown 10000:10000 /opt/data/config.yaml

                # Configure git for the mahoro-ai sockpuppet account.
                # Credentials come from the hermes secret (GITHUB_TOKEN for
                # github.com, FORGEJO_TOKEN for git.cnas.dev). Use
                # HOME=/opt/data so the app container (which also uses
                # HOME=/opt/data) inherits the config from the PVC.
                export HOME=/opt/data
                git config --global user.name "mahoro-ai"
                git config --global user.email "354213225+mahoro-ai@users.noreply.github.com"
                git config --global init.defaultBranch main
                git config --global credential.helper 'store --file /opt/data/.git-credentials'
                # Set (not --add): --add appends on every boot and the
                # multivalued key accumulated dozens of identical entries;
                # set replaces the list and self-heals old duplicates.
                git config --global safe.directory '*'
                # Host-scoped identity: repos on git.cnas.dev commit as the
                # Forgejo mahoro-ai account (noreply address), everything else
                # keeps the GitHub sockpuppet identity above. The includeIf
                # glob matches any repo cloned over HTTPS from that host; the
                # single-quoted key survives the shell, and git config makes
                # the write idempotent across restarts.
                git config --global 'includeIf.hasconfig:remote.*.url:https://git.cnas.dev/**.path' /opt/data/.gitconfig-forgejo
                printf '[user]\n\tname = mahoro-ai\n\temail = mahoro-ai@noreply.git.cnas.dev\n' > /opt/data/.gitconfig-forgejo
                umask 077
                {
                  printf 'https://x-access-token:%s@github.com\n' "$GITHUB_TOKEN"
                  printf 'https://mahoro-ai:%s@git.cnas.dev\n' "$FORGEJO_TOKEN"
                } > /opt/data/.git-credentials
                umask 022
                chown 10000:10000 /opt/data/.git-credentials
                chmod 600 /opt/data/.git-credentials
                chown 10000:10000 /opt/data/.gitconfig 2>/dev/null || true
                chown 10000:10000 /opt/data/.gitconfig-forgejo 2>/dev/null || true
                # The hermes gateway overrides the pod-level HOME=/opt/data
                # with /opt/data/home for the sessions it spawns, so git run
                # from a session reads /opt/data/home/.gitconfig (which is
                # empty) and sees no identity, no credential helper, and no
                # includeIf. Bridge the scopes with a one-line include so
                # session-side git behaves exactly like pod-side git.
                mkdir -p /opt/data/home
                git config --file /opt/data/home/.gitconfig include.path /opt/data/.gitconfig
                chown 10000:10000 /opt/data/home/.gitconfig 2>/dev/null || true

                # Clone the home-ops repo if it isn't already present.
                mkdir -p /opt/data/workspace
                if [[ ! -d /opt/data/workspace/k8s-home-ops/.git ]]; then
                  git clone --filter=blob:none https://github.com/cbc02009/k8s-home-ops.git /opt/data/workspace/k8s-home-ops \
                    || echo "WARN: k8s-home-ops clone failed; clone it from a session instead"
                fi
                chown -R 10000:10000 /opt/data/workspace/k8s-home-ops 2>/dev/null || true

                # Clone the nas-ops repo (Forgejo on git.cnas.dev) if it
                # isn't already present. Runs after the credential file is
                # written, so private repos on that host clone too.
                if [[ ! -d /opt/data/workspace/nas-ops/.git ]]; then
                  git clone --filter=blob:none https://git.cnas.dev/cbc02009/nas-ops.git /opt/data/workspace/nas-ops \
                    || echo "WARN: nas-ops clone failed; clone it from a session instead"
                fi
                chown -R 10000:10000 /opt/data/workspace/nas-ops 2>/dev/null || true

                # Install the memini memory-provider plugin from the upstream
                # standalone mirror eleboucher/memini-hermes (a release-synced
                # copy of integrations/hermes/plugin/memini — the blessed
                # owner/repo form). Pinned to a commit, guarded by a .ref
                # marker so normal restarts stay offline and it only refetches
                # when the pin changes. The mirror is untagged, so bump this
                # SHA by hand. The handle_tool_call **kwargs fix landed in
                # v0.7.29; revisit tag-tracking (renovate github-tags) only if
                # the mirror ever starts cutting tags.
                MEMINI_PLUGIN_REF=ad5e12b3ade70e0afaa011513aa97920d2b66b46
                PLUGIN_DIR=/opt/data/plugins/memini
                if [ "$(cat "$PLUGIN_DIR/.ref" 2>/dev/null)" != "$MEMINI_PLUGIN_REF" ]; then
                  BASE="https://raw.githubusercontent.com/eleboucher/memini-hermes/$MEMINI_PLUGIN_REF"
                  if wget -qO /tmp/memini-init.py "$BASE/__init__.py" && wget -qO /tmp/memini-plugin.yaml "$BASE/plugin.yaml"; then
                    rm -rf "$PLUGIN_DIR"
                    mkdir -p "$PLUGIN_DIR"
                    mv /tmp/memini-init.py "$PLUGIN_DIR/__init__.py"
                    mv /tmp/memini-plugin.yaml "$PLUGIN_DIR/plugin.yaml"
                    printf '%s' "$MEMINI_PLUGIN_REF" > "$PLUGIN_DIR/.ref"
                    chown -R 10000:10000 "$PLUGIN_DIR"
                  else
                    echo "WARN: memini plugin fetch failed; starting with whatever is present"
                  fi
                fi

                # Apply the in-repo per-profile namespace patch to the pinned
                # plugin (idempotent: a no-op when its marker comment is
                # already present, a warning when the upstream anchor moved).
                # Fetched from this repo, so a pin bump above (which
                # refetches the upstream file) is followed by an automatic
                # re-apply of this same reviewed patch. A failed fetch or
                # apply leaves the upstream plugin untouched, which is
                # today's behavior: one shared namespace for all profiles.
                apk add --no-cache python3 >/dev/null
                if [ -f "$PLUGIN_DIR/__init__.py" ]; then
                  if wget -qO /tmp/memini-per-profile-ns.py "https://raw.githubusercontent.com/cbc02009/k8s-home-ops/main/kubernetes/apps/llm/hermes/app/memini-per-profile-namespace.py"; then
                    python3 /tmp/memini-per-profile-ns.py || echo "WARN: per-profile namespace patch failed to apply; keeping the upstream plugin"
                    chown -R 10000:10000 "$PLUGIN_DIR" 2>/dev/null || true
                  else
                    echo "WARN: per-profile namespace patch fetch failed; keeping the upstream plugin"
                  fi
                fi
        containers:
          app:
            image: &image
              repository: nousresearch/hermes-agent
              tag: v0.23.1@sha256:276d44685c65c0cb2a25f190b63c65c8906f9dc76486fb1c05ae71b5826bda08
            args: ["gateway", "run"]
            env:
              # The memini plugin (memini-hermes ad5e12b3) reads
              # MEMINI_BASE_URL; MEMINI_URL was ignored and it dialed its
              # http://localhost:8080 default (connection refused on every
              # call). .svc.local is also not served by this cluster's
              # CoreDNS (search domains are *.svc.cluster.local).
              MEMINI_BASE_URL: http://memini.llm.svc.cluster.local:8080
              # The gateway multiplexes every profile through one process,
              # and a routed profile's .env is never loaded into
              # os.environ, so a per-profile MEMINI_NAMESPACE cannot come
              # from the profiles' .env files. The in-repo plugin patch
              # (app/memini-per-profile-namespace.py, applied by the init
              # container below) therefore reads one static, non-secret pin
              # per profile instead, keyed by upper-cased profile name.
              # Every profile keeps the shared "hermes" root as an
              # ancestor: durable facts stored at the root (and in the home
              # leg) cascade down to each profile, while each profile's own
              # transcripts live in its own child namespace instead of one
              # shared catch-all.
              MEMINI_NAMESPACE: hermes
              MEMINI_NAMESPACE_DEFAULT: hermes
              MEMINI_NAMESPACE_CLUSTEROPS: hermes/clusterops
              MEMINI_NAMESPACE_MAKER: hermes/maker
              MEMINI_NAMESPACE_MODELOPS: hermes/modelops
              MEMINI_NAMESPACE_MTG: hermes/mtg
              MEMINI_NAMESPACE_REVIEWER: hermes/reviewer
              MEMINI_NAMESPACE_TALOS: hermes/talos
              # Shared home leg: personal/user-level facts (the
              # personal/cbc02009 namespace) merge into every profile's
              # recall on both the read and write sides. The hermes key
              # carries no server-side home binding, so this client-side
              # value is authoritative.
              MEMINI_HOME: personal/cbc02009
              HERMES_HOME: /opt/data
              HOME: /opt/data
              TZ: ${CONFIG_TZ}
              CAMOFOX_URL: http://camofox.llm.svc.cluster.local:9377
              # The Webapp (browser-hosted Desktop workspace) is served by
              # this gateway process on a non-loopback bind, so it engages
              # the sign-in gate. It has no auth provider of its own: it
              # uses the dashboard's OIDC config, which must therefore be
              # present here or the Webapp stays off. Public PKCE client,
              # so no client secret is needed.
              HERMES_DASHBOARD_OIDC_CLIENT_ID:
                valueFrom:
                  secretKeyRef:
                    name: hermes-dashboard
                    key: HERMES_DASHBOARD_OIDC_CLIENT_ID
              HERMES_DASHBOARD_OIDC_ISSUER:
                valueFrom:
                  secretKeyRef:
                    name: hermes-dashboard
                    key: HERMES_DASHBOARD_OIDC_ISSUER
              # Explicit rather than via the envFrom sweep below: the init
              # container needs it for the git.cnas.dev credential line, and
              # an explicit non-optional ref fails loudly at pod start if the
              # ExternalSecret ever lags, instead of surfacing as empty-token
              # git failures later.
              FORGEJO_TOKEN:
                valueFrom:
                  secretKeyRef:
                    name: hermes
                    key: FORGEJO_TOKEN
            envFrom:
              - secretRef:
                  name: hermes
            resources:
              requests:
                cpu: 100m
                memory: 2Gi
              limits:
                memory: 4Gi
            ports:
              # The gateway's single HTTP listener. With webapp.enabled in
              # config.yaml it serves the Webapp on 9120 instead of the
              # API-server port (8642).
              - containerPort: &port 9120
                name: webapp
                protocol: TCP
          dashboard:
            image: *image
            env:
              # The gateway's listener moved to the Webapp port.
              GATEWAY_HEALTH_URL: http://localhost:9120
              TZ: ${CONFIG_TZ}
              HERMES_DASHBOARD_PUBLIC_URL: https://hermes-dash.ctec.run
            envFrom:
              - secretRef:
                  name: hermes-dashboard
            args:
              - dashboard
              - --host
              - "0.0.0.0"
            resources:
              requests:
                cpu: 500m
              limits:
                memory: 1Gi
            ports:
              - containerPort: &dashboard_port 9119
                name: dashboard
                protocol: TCP
    service:
      app:
        controller: hermes
        ports:
          webapp:
            port: *port
            appProtocol: kubernetes.io/wss
      dashboard:
        controller: hermes
        ports:
          http:
            port: *dashboard_port
            appProtocol: kubernetes.io/wss
    route:
      dashboard:
        hostnames: ["hermes-dash.ctec.run"]
        parentRefs:
          - name: envoy-internal
            namespace: network
        rules:
          - backendRefs:
              - identifier: dashboard
                port: http
      webapp:
        hostnames: ["hermes.ctec.run"]
        parentRefs:
          - name: envoy-internal
            namespace: network
        rules:
          - backendRefs:
              - identifier: app
                port: webapp
            # The Webapp holds long-lived chat WebSockets open; don't let
            # the gateway's request timeout cut them.
            timeouts:
              request: 0s
    persistence:
      config:
        existingClaim: "{{ .Release.Name }}"
        globalMounts:
          - path: /opt/data
      configmap:
        type: configMap
        name: "{{ .Release.Name }}-config"
        defaultMode: 0755
        globalMounts:
          - path: /tmp/config.yaml
            subPath: config.yaml
