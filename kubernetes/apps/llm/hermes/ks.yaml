---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app hermes
spec:
  components:
    - ../../../../components/kopiur
  dependsOn:
    - name: litellm
  interval: 1h
  path: ./kubernetes/apps/llm/hermes/app
  postBuild:
    substitute:
      APP: *app
      PVC_CAPACITY: 20Gi
      APP_UID: "10000"
      APP_GID: "10000"
  wait: false
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: llm
  # TRANSIENT migration pin (ai -> llm namespace rename): hermes's chat data is
  # NOT re-downloadable, and its kopia snapshots were taken under the OLD `ai`
  # namespace identity (hermes@ai:/pvc/hermes). The kopiur component resolves
  # `fromPolicy` in the restore's own namespace, which has no snapshots until
  # the first llm snapshot cycle completes — without this pin a PVC re-creation
  # silently continues with an EMPTY volume (spec.policy.onMissingSnapshot:
  # Continue; this bit litellm during the cutover).
  # Applied pre-postBuild, hence the literal ${APP} placeholders.
  # REMOVE this patch once the llm SnapshotPolicy has produced hermes snapshots.
  patches:
    - patch: |-
        apiVersion: kopiur.home-operations.com/v1alpha1
        kind: Restore
        metadata:
          name: ${APP}
        spec:
          source:
            fromPolicy:
              namespace: ai
              sourcePath: /pvc/${APP}
