---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app hermes
spec:
  # TRANSIENT (ai -> llm rename): the shared kopiur component is disabled
  # while ./app/restore.yaml restores hermes's data from the old `ai` kopia
  # identity (the component's fromPolicy-based Restore can't see snapshots
  # whose policy CR was pruned with the old namespace). Re-enable it and
  # delete ./app/restore.yaml once llm has its own hermes snapshots.
  components:
    # - ../../../../components/kopiur
  dependsOn:
    - name: litellm
  interval: 1h
  path: ./kubernetes/apps/llm/hermes/app
  postBuild:
    substitute:
      APP: *app
      PVC_CAPACITY: 20Gi
      APP_UID: "10000"
      APP_GID: "10000"
  wait: false
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: llm
