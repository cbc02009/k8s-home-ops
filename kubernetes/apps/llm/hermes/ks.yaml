---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app hermes
spec:
  # Hermes uses its own kopiur component (apps/llm/hermes/kopiur) instead of the
  # shared one, because its mover must run as a privileged root mover: the hermes
  # app container writes files owned by root (uid 0), which the shared component's
  # ${APP_UID}=10000 mover cannot read (snapshot fails with PermissionDenied).
  components:
    - ../kopiur
  dependsOn:
    - name: litellm
  interval: 1h
  path: ./kubernetes/apps/llm/hermes/app
  postBuild:
    substitute:
      APP: *app
      PVC_CAPACITY: 20Gi
  wait: false
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: llm
