---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kopiur.home-operations.com/snapshotpolicy_v1alpha1.json
apiVersion: kopiur.home-operations.com/v1alpha1
kind: SnapshotPolicy
metadata:
  annotations:
    kopiur.home-operations.com/allow-identity-change: "true"
  name: ${APP}
spec:
  compression:
    compressor: zstd
  # The hermes app container runs as root (uid 0) — its image defines no USER
  # and no runAsUser is pinned — so the files it writes (e.g. .bash_history)
  # are owned by root. The shared kopiur component runs the mover as
  # ${APP_UID}=10000, which cannot read root-only files and the snapshot dies
  # with PermissionDenied (kopia "open /pvc/hermes/.bash_history: permission
  # denied"). Root the mover and let it hold DAC_OVERRIDE so it can read them.
  mover:
    cache:
      capacity: ${PVC_CAPACITY:=5Gi}
      mode: Ephemeral
      storageClassName: ${PVC_STORAGECLASS:=ceph-block}
    privilegedMode: true
    securityContext:
      runAsGroup: 0
      runAsNonRoot: false
      runAsUser: 0
  repository:
    kind: ClusterRepository
    name: nas
  retention:
    keepDaily: 7
    keepHourly: 24
    keepLatest: 3
    keepWeekly: 4
  sources:
    - pvc:
        name: ${KOPIUR_CLAIM:-${APP}}
  volumeSnapshotClassName: ${PVC_SNAPSHOTCLASS:=csi-ceph-blockpool}
