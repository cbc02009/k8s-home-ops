---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app lens
spec:
  chart:
    spec:
      # Path to the chart inside the pinned GitRepository checkout.
      chart: ./helm/lens
      sourceRef:
        kind: GitRepository
        name: lens-chart
      interval: 1h
  interval: 30m
  values:
    image:
      # Self-built in cbc02009/container-images (apps/lens) from the pinned
      # upstream tag (no published Lens image exists yet). The digest below
      # is the index published by the Release workflow for v1.108.0-rc.1,
      # with SLSA provenance attestation (source revision
      # 5eab92066c62d2188a34986cda847dc694eb28bc).
      repository: ghcr.io/cbc02009/lens
      digest: sha256:db6b77c4e75d050b7c9ebedc46554681282e6a857a36dfd110dcfe781241db96
    # Browser origin for the standalone UI; also the ingestion URL agents
    # use for /v1/traces. The gateway calls the in-cluster service directly
    # via LITELLM_LENS_URL (set in litellmproxy.yaml).
    publicUrl: https://lens.ctec.run
    gateway:
      # Connect the LiteLLM gateway: the values in lens-connection must match
      # the gateway's LITELLM_LENS_SERVICE_TOKEN / LENS_GATEWAY_SECRET (see
      # externalsecret.yaml here and litellm/app/externalsecret.yaml).
      enabled: true
      secretName: lens-connection
      secretKey: gateway-secret
    serviceTokenSecret:
      name: lens-connection
      key: service-token
    clickhouse:
      # Bundled ClickHouse + Keeper (the supported topology: one server, no
      # distributed tables or cross-server failover).
      storageClassName: ceph-block
