---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: lens-connection
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: lens-connection
    creationPolicy: Owner
  # Shared gateway connection secrets (each an `openssl rand -hex 32` value in
  # the `litellm-lens` 1Password item). The LiteLLM gateway reads the same
  # fields into its own secret (kubernetes/apps/llm/litellm/app/externalsecret.yaml).
  data:
    - secretKey: service-token
      remoteRef:
        key: litellm-lens
        property: service-token
    - secretKey: gateway-secret
      remoteRef:
        key: litellm-lens
        property: gateway-secret
