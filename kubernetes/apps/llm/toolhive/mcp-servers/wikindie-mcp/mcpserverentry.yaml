---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/toolhive.stacklok.dev/mcpserverentry_v1alpha1.json
apiVersion: toolhive.stacklok.dev/v1alpha1
kind: MCPServerEntry
metadata:
  name: wikindie
spec:
  # Wikindie ships a built-in Streamable-HTTP MCP server on the app's own
  # port (/mcp, bearer API-key auth). The service hostname is already
  # allowlisted in the app's WIKINDIE_ALLOWED_HOSTS for exactly this use.
  # In-cluster (cluster.local) endpoints are blocked by default, so
  # allowPrivateEndpoint must be set or the entry fails validation
  # (RemoteURLValidated=False -> phase:Failed) and its tools are never
  # registered in the mcp-tools group (kguardian-mcp precedent).
  allowPrivateEndpoint: true
  remoteUrl: http://wikindie.llm.svc.cluster.local:3000/mcp
  transport: streamable-http
  groupRef:
    name: mcp-tools
  headerForward:
    addHeadersFromSecret:
      - headerName: Authorization
        valueSecretRef:
          name: wikindie-mcp-secret
          key: authorization
