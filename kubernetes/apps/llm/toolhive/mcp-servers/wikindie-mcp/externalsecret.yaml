---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
# 1Password item `wikindie`, field `api_key` — a wikindie-generated `wk_`
# API key (app UI: Connect to AI), not one of the item's login fields
# (user_name/user_pass/jwt_secret feed the wikindie app ExternalSecret).
# Rendered as a pre-composed Authorization header consumed by the
# MCPServerEntry headerForward in ./mcpserverentry.yaml.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: wikindie-mcp
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: wikindie-mcp-secret
    creationPolicy: Owner
    template:
      data:
        authorization: "Bearer {{ .api_key }}"
  dataFrom:
    - extract:
        key: wikindie
