---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name toolhive-mikrotik
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: *name
    template:
      data:
        ROUTER_BACKBONE_USER: "{{ .mikrotik_api_user }}"
        ROUTER_BACKBONE_PASS: "{{ .mikrotik_api_key }}"
        ROUTER_OFFICE_USER: "{{ .mikrotik_api_user }}"
        ROUTER_OFFICE_PASS: "{{ .mikrotik_api_key }}"
        ROUTER_MEDIA_USER: "{{ .mikrotik_api_user }}"
        ROUTER_MEDIA_PASS: "{{ .mikrotik_api_key }}"
        ROUTER_CLUSTER_USER: "{{ .mikrotik_api_user }}"
        ROUTER_CLUSTER_PASS: "{{ .mikrotik_api_key }}"
        SWITCH_1GB_USER: "{{ .mikrotik_api_user }}"
        SWITCH_1GB_PASS: "{{ .mikrotik_api_key }}"
        SWITCH_WORKBENCH_USER: "{{ .mikrotik_api_user }}"
        SWITCH_WORKBENCH_PASS: "{{ .mikrotik_api_key }}"
  data:
    # The MikroTik REST credentials from the same 1Password item the user
    # maintains (fields api_user and api_key). Single-field fetch per the
    # forgejo-mcp pattern: avoid whole-item dataFrom.
    - secretKey: mikrotik_api_user
      remoteRef:
        key: mikrotik
        property: api_user
    - secretKey: mikrotik_api_key
      remoteRef:
        key: mikrotik
        property: api_key
