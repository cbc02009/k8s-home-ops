---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/toolhive.stacklok.dev/mcpserver_v1alpha1.json
apiVersion: toolhive.stacklok.dev/v1alpha1
kind: MCPServer
metadata:
  name: kubectl
spec:
  image: docker.io/rohitghumare64/kubectl-mcp-server:2.0.0@sha256:f1f57aa5d4952f3c49e4d9bb8071a143d0812bdc8253922d51eeca8a2615ea29
  transport: streamable-http
  proxyMode: streamable-http
  proxyPort: 8080
  mcpPort: 8000
  resources:
    requests:
      cpu: 100m
      memory: 1280Mi
    limits:
      cpu: 500m
      memory: 1536Mi
  serviceAccount: kubectl-mcp-readonly
  podTemplateSpec:
    spec:
      volumes:
        # The operator hardens the container with readOnlyRootFilesystem and
        # runAsUser 1000. The 2.0.0 image's WORKDIR is /home/mcp, mode 0700 and
        # owned by uid 10001, so the pod's uid 1000 cannot even stat() inside
        # it: pydantic-settings resolves its default dotenv file as the
        # relative path ".env" at import time and the resulting EACCES
        # crashes the server before it binds (PermissionError: [Errno 13]
        # Permission denied: '.env'). A writable emptyDir at /tmp, combined
        # with workingDir and HOME below, moves every startup lookup off the
        # unsearchable directory -- the same pattern mtg-mcp and
        # litellm-admin-mcp use.
        - name: tmp
          emptyDir: {}
      containers:
        - name: mcp
          workingDir: /tmp
          args:
            - --transport
            - streamable-http
            - --host
            - 0.0.0.0
            - --port
            - "8000"
            - --read-only
            # 2.0.0 refuses to bind a non-loopback address without OAuth or
            # this flag (ensure_network_exposure_allowed, exits 2). The
            # ToolHive proxy reaches the server over the pod network, so
            # 0.0.0.0 is required; the cluster network is the protection.
            - --allow-unauthenticated
          env:
            - name: MCP_K8S_PROVIDER
              value: in-cluster
            - name: PYTHONUNBUFFERED
              value: "1"
            # fastmcp's platformdirs home (~/.local/share/fastmcp) and any
            # other $HOME lookup must land in the writable emptyDir, not the
            # unreadable image home.
            - name: HOME
              value: /tmp
          volumeMounts:
            - name: tmp
              mountPath: /tmp
  groupRef:
    name: mcp-tools-ops
