---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/toolhive.stacklok.dev/mcpserver_v1beta1.json
apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPServer
metadata:
  name: kubesearch
spec:
  # perfectra1n/kubesearch-mcp: search engine over Flux HelmReleases and Argo
  # Applications across hundreds of public home-ops repositories (kubesearch.dev).
  # The server downloads the upstream SQLite index from GitHub releases and
  # queries it locally, so it needs no Kubernetes API access.
  image: ghcr.io/perfectra1n/kubesearch-mcp:1.3.0@sha256:4620f09fffb30672b429b9bbffb8a657d34dcee420729598c3f65732a3c89079
  # The image defaults to Streamable HTTP and serves the MCP endpoint at /mcp;
  # the ToolHive transparent proxy forwards the /mcp path to mcpPort unchanged.
  transport: streamable-http
  proxyPort: 8080
  mcpPort: 3000
  # The http transport is stateless, so no session affinity is needed.
  sessionAffinity: None
  env:
    # The index is cached in /data; the container runs as uid 1000 (node) and
    # needs a writable volume there for the databases and the clone pool.
    - name: KUBESEARCH_CACHE_DIR
      value: /data
    # Refresh the daily index release once a day.
    - name: KUBESEARCH_REFRESH_HOURS
      value: "24"
    # Keep the always-warm clone pool small — it holds the most-starred indexed
    # repos permanently cloned under /data.
    - name: KUBESEARCH_POOL_SIZE
      value: "5"
  podTemplateSpec:
    spec:
      # The server clones and greps public Git repositories on demand; it does
      # not talk to the Kubernetes API, so no service account token is mounted.
      automountServiceAccountToken: false
      containers:
        - name: mcp
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          emptyDir:
            sizeLimit: 2Gi
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 1Gi
  groupRef:
    name: mcp-tools
