---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name toolhive-truenas
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: *name
    template:
      data:
        # Both fields come from the hermes 1Password item: truenas_api_user
        # names the key's owner (the server sends it to auth.login_ex) and
        # truenas_api_key is the key itself (READONLY_ADMIN privilege per
        # upstream docs). Single-field fetches -- the hermes item carries
        # many unrelated credentials, so no dataFrom whole-item extract.
        TRUENAS_API_USER: "{{ .truenas_api_user }}"
        TRUENAS_API_KEY: "{{ .truenas_api_key }}"
  data:
    - secretKey: truenas_api_user
      remoteRef:
        key: hermes
        property: truenas_api_user
    - secretKey: truenas_api_key
      remoteRef:
        key: hermes
        property: truenas_api_key
