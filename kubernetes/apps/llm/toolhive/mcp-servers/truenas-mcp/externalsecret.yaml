---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name toolhive-truenas
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: *name
    template:
      data:
        # Both fields come from the truenas 1Password item: api_user names the
        # key's owner (the server sends it to auth.login_ex) and api_key is the
        # key itself (READONLY_ADMIN privilege per upstream docs).
        TRUENAS_API_USER: "{{ .api_user }}"
        TRUENAS_API_KEY: "{{ .api_key }}"
  data:
    - secretKey: api_user
      remoteRef:
        key: truenas
        property: api_user
    - secretKey: api_key
      remoteRef:
        key: truenas
        property: api_key
