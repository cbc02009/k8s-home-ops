---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name toolhive-forgejo
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: *name
    template:
      data:
        # The Forgejo api_key from the same 1Password item the Hermes pod
        # uses (mahoro-ai-forgejo, field api_key) - deliberately NOT the
        # GitHub token (mahoro-github). Single-field fetch: the item is a
        # Login type whose "Email address" field breaks whole-item dataFrom.
        token: "{{ .forgejo_api_key }}"
  data:
    - secretKey: forgejo_api_key
      remoteRef:
        key: mahoro-ai-forgejo
        property: api_key
