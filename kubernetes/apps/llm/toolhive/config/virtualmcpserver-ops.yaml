---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/toolhive.stacklok.dev/virtualmcpserver_v1beta1.json
# Split gateway for the mcp-tools-ops group (the old mcp-gateway-internal is left in
# place until clients re-point; see PR discussion).
#
# No tool optimizer: vMCP lists the ~328 backend tools directly in tools/list
# with the {workload}_ prefix. That flat list is the surface Hermes agents
# discover against (their tool index is a lexical search over exactly these
# names), whereas the optimizer mode #6110 introduced replaced them with
# find_tool/call_tool meta-tools the index could not see, degrading discovery.
# Re-enabling the optimizer also pins the gateway to MCP 2025-11-25 (Modern
# clients negotiate down to Legacy) and needs the toolhive-embed OPENAI_API_KEY
# env re-added to the pod template.
apiVersion: toolhive.stacklok.dev/v1beta1
kind: VirtualMCPServer
metadata:
  name: mcp-gateway-ops
spec:
  groupRef:
    name: mcp-tools-ops
  config:
    aggregation:
      conflictResolution: prefix
      conflictResolutionConfig:
        prefixFormat: "{workload}_"
  incomingAuth:
    type: anonymous
  outgoingAuth:
    source: discovered
  podTemplateSpec:
    spec:
      containers:
        - name: vmcp
          resources:
            requests:
              memory: 256Mi
            limits:
              memory: 2Gi
  sessionStorage:
    address: toolhive-config-dragonfly-db.llm.svc.cluster.local:6379
    db: 0
    keyPrefix: "toolhive:vmcp-ops:"
    # passwordRef:
    #   key: password
    #   name: toolhive-config-redis
    provider: redis
