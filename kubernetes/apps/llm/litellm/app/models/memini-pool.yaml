---
# memini-pool: memory consolidation lane.
# Rung 1: deepseek-v4.1-flash (opencode_go) with reasoning_effort none -
#   gate-tested 2026-11-22 via the -gate-test lane: JSON verdicts,
#   ~1.5 s at max_tokens 4096, reasoning_tokens 0, same with or without
#   x-litellm-session-id.
# Rung 2: zai glm-5.3-flash floor (falls through on error/rate-limit;
# 2026-11-24: replaced the local 27b floor so memory consolidation never
# depends on the mayne GPU - SwarmUI preemption stalled memini calls there).
# memini max_tokens is 4096 (well under the zai rung's 131072 output cap).

apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMModel
metadata:
  name: memini-pool-deepseek-v4.1-flash
  labels:
    litellm.home-operations.com/managed-by: flux
spec:
  modelName: memini-pool
  proxyRef: litellm
  params:
    model: opencode_go/deepseek-v4.1-flash
    apiKey: "os.environ/OPENCODE_GO_API_KEY"
    additional:
      order: 1
      weight: 2
      max_parallel_requests: 2
      reasoning_effort: none
      allowed_openai_params:
        - reasoning_effort
  info:
    mode: chat
    maxInputTokens: 1000000
    maxOutputTokens: 131072
    supportsFunctionCalling: true
    supportsVision: true
    supportsPromptCaching: true
    # 2026-11-20 fix: cache_read was 6e-09 (= $0.006/M, 10x low). The
    # under-pricing is material because ~94% of deepseek's traffic is
    # cache-read (94,597 of 100,757 tok on the 11-18 bench). List price
    # is $0.06/M = 6e-08.
    extra:
      input_cost_per_token: 3e-07
      output_cost_per_token: 1.2e-06
      cache_read_input_token_cost: 6e-08
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/litellm.home-operations.com/litellmmodel_v1alpha1.json
# 2026-11-24: 27B floor replaced by zai glm-5.3-flash - memory
# consolidation must not depend on the mayne GPU (SwarmUI preemption made
# the old floor unavailable and stalled memini calls). The zai lane is the
# standing fallback for every other lane's Go-window exhaustion.
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMModel
metadata:
  name: memini-pool-zai-glm-5.3-flash
  labels:
    litellm.home-operations.com/managed-by: flux
spec:
  modelName: memini-pool
  proxyRef: litellm
  params:
    model: zai/glm-5.3-flash
    apiBase: https://api.z.ai/api/coding/paas/v4
    apiKey: "os.environ/ZAI_API_KEY"
    additional:
      order: 2
      weight: 1
      max_parallel_requests: 2
  info:
    mode: chat
    maxInputTokens: 1048576
    maxOutputTokens: 131072
    supportsFunctionCalling: true
    supportsVision: true
    supportsPromptCaching: true
    extra:
      input_cost_per_token: 1.5e-07
      output_cost_per_token: 5e-07
      cache_read_input_token_cost: 3e-08
