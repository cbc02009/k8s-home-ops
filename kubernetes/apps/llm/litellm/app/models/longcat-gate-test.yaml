---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/litellm.home-operations.com/litellmmodel_v1alpha1.json
# TEMPORARY (2026-11-16): gate test for LongCat 2.5 Free after the Go
# workspace "Global" regions opt-in. In go-pool this deployment sits at
# order 7 (deepest rung), so a normal go-pool request only reaches it when
# every higher rung is in cooldown and the region gate cannot be
# distinguished from the session gate. This single-deployment group makes
# every request for `longcat-gate-test` land on opencode_go/longcat-2.5-free
# exactly once, with the x-litellm-session-id forwarded upstream as
# x-opencode-session by the proxy. Delete this file (and the kustomization
# entry) as soon as the 200/400 verdict is in.
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMModel
metadata:
  name: longcat-gate-test
spec:
  modelName: longcat-gate-test
  proxyRef: litellm
  params:
    model: opencode_go/longcat-2.5-free
    apiKey: os.environ/OPENCODE_GO_API_KEY
  info:
    mode: chat
    maxInputTokens: 1000000
    maxOutputTokens: 262144
    supportsFunctionCalling: true
    supportsVision: true
    extra:
      input_cost_per_token: 0
      output_cost_per_token: 0
      cache_read_input_token_cost: 0
