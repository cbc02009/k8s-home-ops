---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/litellm.home-operations.com/litellmmodel_v1alpha1.json
# Complexity router: one model name that picks the right lane. Simple and
# medium work share the local-free-pool — the always-resident 27B at 50%
# (weight 2) mixed with OpenCode Go's zero-allowance free rungs — so half of
# that traffic is offloaded from the local GPU. Hard reasoning/coding
# escalates to reasoning-pool. The classifier runs on 27b-chat (always
# resident) with the built-in 'agentic' rubric: routine installs, builds,
# multi-file edits and standard debugging anchor at MEDIUM, so ordinary
# engineering traffic avoids the allowance-metered Go pools.
# classification_mode 'user_turn' re-classifies on every new human ask (a
# session can move tiers between asks, no hour-long freeze) but replays the
# held decision on an agent loop's tool continuations, so a long loop neither
# re-classifies per step nor switches tiers mid-loop. Pool members are picked
# per request by the proxy's simple-shuffle, so sessions hop within the pool;
# the Go session id keeps per-conversation affinity (prompt cache) on the
# cloud rungs. The 27B member (order 1) is the failover floor if Go drops a
# free model.
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMModel
metadata:
  name: auto
  labels:
    litellm.home-operations.com/managed-by: flux
spec:
  modelName: auto
  proxyRef: litellm
  params:
    model: auto_router/complexity_router
    additional:
      complexity_router_default_model: qwen3.8-27b
      complexity_router_config:
        tiers:
          SIMPLE: local-free-pool
          MEDIUM: local-free-pool
          COMPLEX: reasoning-pool
          REASONING: reasoning-pool
        classifier_type: llm
        classifier_llm_config:
          model: qwen3.8-27b-chat
          timeout_ms: 20000
          classification_rubric: agentic
        classifier_fallback: default_model
        classification_mode: user_turn
        session_affinity: false
        session_affinity_ttl_seconds: 3600
