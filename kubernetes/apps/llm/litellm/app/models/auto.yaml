---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/litellm.home-operations.com/litellmmodel_v1alpha1.json
# Complexity router: one model name that picks the right lane. SIMPLE and
# MEDIUM work share free-pool — the always-resident 27B as the ~43%
# primary (weight 6) mixed with OpenCode Go's zero-allowance free rungs
# (~57% combined) — so most of that traffic is offloaded from the local GPU.
#
# COMPLEX and REASONING are now SPLIT into two lanes (they used to share
# reasoning-pool). Measured over 16d both tiers landed 100% in reasoning-pool,
# but they are different kinds of work and different volumes: COMPLEX is the
# higher-volume bulk multi-step/coding tier (261 fresh classifications), so it
# goes to implementation-pool — local 27B first, free and private, with cheap
# cloud rungs only as overflow. REASONING is the lower-volume hardest tier
# (146 fresh classifications: deep reasoning / advanced math / intricate logic)
# and keeps the cloud-first reasoning-pool where quality matters most. Routing
# the bulk tier at the local-first lane keeps the shared $240 Go allowance off
# the work the resident GPU can do for free.
#
# The classifier runs on classifier-pool rather than directly on the 27B:
# the zero-burn Go free rungs (Hy4 Flash Free / Beam Free) do the per-ask tier
# calls, so the classifier is no longer an always-resident 27B consumer and
# the 4090-busy -> 27B-pinned -> 4090-busy loop is broken. The glm-5.3-flash
# lane sits in the pool at order 2 as the floor, drawn only when both free
# rungs are in cooldown; a 20s-timeout breaker pin (30s cooldown) and every
# failed verdict land on free-pool via classifier_fallback
# (2026-11-24: moved off the bare 27B engine, so a SwarmUI-held GPU can no
# longer stall classification). The built-in 'agentic' rubric is unchanged:
# routine installs, builds, multi-file edits and standard debugging anchor at
# MEDIUM, so ordinary engineering traffic avoids the allowance-metered Go
# pools. classification_mode 'user_turn' re-classifies on every new human
# ask (a session can move tiers between asks, no hour-long freeze) but
# replays the held decision on an agent loop's tool continuations, so a long
# loop neither re-classifies per step nor switches tiers mid-loop. Pool
# members are picked per request by the proxy's simple-shuffle, so sessions
# hop within the pool; the Go session id keeps per-conversation affinity
# (prompt cache) on the cloud rungs. In the tier lanes the 27B member
# (order 1) is each lane's primary/failover floor; classifier-pool's
# order-2 floor is glm-5.3-flash and complexity_router_default_model is
# free-pool, so neither the classifier floor nor the unclassified-ask
# default touches the GPU.
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMModel
metadata:
  name: auto
  labels:
    litellm.home-operations.com/managed-by: flux
spec:
  modelName: auto
  proxyRef: litellm
  params:
    model: auto_router/complexity_router
    additional:
      complexity_router_default_model: free-pool
      complexity_router_config:
        tiers:
          SIMPLE: free-pool
          MEDIUM: free-pool
          COMPLEX: implementation-pool
          REASONING: reasoning-pool
        classifier_type: llm
        classifier_llm_config:
          model: classifier-pool
          timeout_ms: 20000
          classification_rubric: agentic
        classifier_fallback: default_model
        classification_mode: user_turn
        session_affinity: false
        session_affinity_ttl_seconds: 3600
