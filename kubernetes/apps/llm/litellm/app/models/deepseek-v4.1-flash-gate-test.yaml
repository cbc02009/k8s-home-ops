# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/litellm.home-operations.com/litellmmodel_v1alpha1.json
# TEMPORARY gate-test lane: ONE deployment, no order/weight/fallbacks, so the
# verdict is clean of pool-router behaviour. Proves on the wire that
# opencode_go/deepseek-v4.1-flash answers through this proxy with
# reasoning_effort: none zeroing reasoning tokens (the OpenCode harness wire
# proof, github.com/OpenCodeTeam/opencode discussion #13886, was direct to
# the Go gateway - not through this litellm overlay). Promotion: the
# memini-pool PR repoints this into the production pool and deletes this
# file plus its kustomization entry in the same commit.
# The apiKey line is BYTE-SPLICED from reasoning-pool.yaml (an
# environment-variable reference, never a literal credential); do not
# retype it - displayed channels may scrub the reference text.
---
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMModel
metadata:
  name: deepseek-v4.1-flash-gate-test
  labels:
    litellm.home-operations.com/managed-by: flux
spec:
  modelName: deepseek-v4.1-flash-gate-test
  proxyRef: litellm
  params:
    model: opencode_go/deepseek-v4.1-flash
    apiKey: "os.environ/OPENCODE_GO_API_KEY"
    additional:
      reasoning_effort: none
      allowed_openai_params:
        - reasoning_effort
      max_parallel_requests: 2
  info:
    mode: chat
    maxInputTokens: 1000000
    maxOutputTokens: 131072
    supportsFunctionCalling: true
    supportsVision: true
    supportsPromptCaching: true
    # 2026-11-20 fix: cache_read was 6e-09 (= $0.006/M, 10x low). The
    # under-pricing is material because ~94% of deepseek's traffic is
    # cache-read (94,597 of 100,757 tok on the 11-18 bench). List price
    # is $0.06/M = 6e-08.
    extra:
      input_cost_per_token: 3e-07
      output_cost_per_token: 1.2e-06
      cache_read_input_token_cost: 6e-08
