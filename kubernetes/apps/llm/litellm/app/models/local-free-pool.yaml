---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/litellm.home-operations.com/litellmmodel_v1alpha1.json
# Simple/medium lane for the auto complexity router. All members sit at the
# SAME order (1) so the proxy's simple-shuffle actually mixes them per
# request — mixing only happens within one order, and the earlier staggered
# order 1/2/3/4 ladder meant the 27B took every request until a cloud rung
# 429'd into cooldown, which is why the lane felt local-slow. Weights make
# the free rungs the majority share, 3:1 over the 27B:
#   Beam Free        (weight 4) — zero allowance burn, "model training:
#     not used" per Go's privacy table (see opencode-go.yaml); measured
#     100% success at sub-second TTFT, so it carries the lane
#   LongCat 2.5 Free (weight 2) — second free rung; 1M context and the
#     lane's only free vision-capable member (Beam has none), so image
#     traffic can stay off the paid rungs. Hosted in China: needs the Go
#     workspace's Global regions setting (accepted). Like every Go free
#     rung it hard-requires the session header (headerless = 400
#     "unknown model" from Go).
#   27B              (weight 2) — the local always-resident rung; second
#     share so the prefix cache stays warm and the lane keeps a private
#     floor when the free rung 429s into cooldown
#   Z.AI GLM Flash   (weight 1) — credit-drain member: the Coding Plan's
#     weekly credits do not roll over, so this high-volume lane burns them
#     steadily instead of only ever touching them on a deep fallback
# LongCat 2.5 Free history: its earlier 100% BadRequestError run (11/11
# headerless test calls on 2026-11-14) was the Go free-tier session-id
# gate — headerless requests are rejected as "unknown model" (Beam hit the
# same gate later that day from headerless clients) — not the model itself.
# Re-added at weight 2 after a live session-bearing test. If a free rung
# goes back to 100% failure, drop it from this lane; it still lives in
# go-pool as that pool's deepest rung.
# Members are picked per request by the proxy's simple-shuffle, so sessions hop
# between them; the Go session id keeps per-conversation affinity (prompt cache)
# on the cloud rungs. Order 2 is the paid Go last-resort rung: a cheap go-pool
# workhorse that only fires when every order-1 member is in cooldown (local
# saturated, Go free listings down/retired, Z.AI window dry). Kept at
# max_parallel_requests: 2 so this lane cannot starve go-pool / implementation
# work on the same $60 allowance.
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMModel
metadata:
  name: local-free-pool-27b
  labels:
    litellm.home-operations.com/managed-by: flux
spec:
  modelName: local-free-pool
  proxyRef: litellm
  params:
    model: openai/qwen3.8-27b
    apiBase: http://nvidia-router-proxy.llm.svc.cluster.local:8080/v1
    apiKey: sk-llmkube-noauth
    additional:
      max_parallel_requests: 10
      reasoning_effort: medium
      order: 1
      weight: 2
      allowed_openai_params:
        - reasoning_effort
  info:
    mode: chat
    # maxInputTokens: 147456
    maxOutputTokens: 24576
    supportsFunctionCalling: true
    supportsVision: false
    extra:
      input_cost_per_token: 6.2e-08
      output_cost_per_token: 1.35e-06
      cache_read_input_token_cost: 0.0
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/litellm.home-operations.com/litellmmodel_v1alpha1.json
# Z.AI Coding Plan Flash: the credit-drain rung of the mixed lane (0.4x
# off-peak consumption). Weight 1 keeps it the lane's smallest share so the
# weekly credits drain steadily instead of only being touched on a deep
# fallback. Carries vision, so it also absorbs this lane's vision traffic
# when the free rung is cooling (Beam has no vision).
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMModel
metadata:
  name: local-free-pool-zai-glm-5.3-flash
  labels:
    litellm.home-operations.com/managed-by: flux
spec:
  modelName: local-free-pool
  proxyRef: litellm
  params:
    model: zai/glm-5.3-flash
    apiBase: https://api.z.ai/api/coding/paas/v4
    apiKey: os.environ/ZAI_API_KEY
    additional:
      order: 1
      weight: 1
      max_parallel_requests: 2
  info:
    mode: chat
    maxInputTokens: 1048576
    maxOutputTokens: 131072
    supportsFunctionCalling: true
    supportsVision: true
    supportsPromptCaching: true
    extra:
      input_cost_per_token: 1.5e-07
      output_cost_per_token: 5e-07
      cache_read_input_token_cost: 3e-08
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/litellm.home-operations.com/litellmmodel_v1alpha1.json
# Beam Free: the free rung that actually works — 100% success and sub-second
# TTFT measured on this lane. Weight 4 gives it a 2:1 majority over the 27B
# so simple/medium traffic defaults to the free cloud rung; the 27B absorbs
# bursts once beam's 4 parallel slots saturate. No vision: image-bearing
# requests fall through to LongCat (vision, free) or Z.AI on retry.
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMModel
metadata:
  name: local-free-pool-beam-free
  labels:
    litellm.home-operations.com/managed-by: flux
spec:
  modelName: local-free-pool
  proxyRef: litellm
  params:
    model: opencode_go/beam-free
    apiKey: os.environ/OPENCODE_GO_API_KEY
    additional:
      order: 1
      weight: 4
      max_parallel_requests: 4
  info:
    mode: chat
    maxInputTokens: 1048576
    maxOutputTokens: 131072
    supportsFunctionCalling: true
    supportsVision: false
    extra:
      input_cost_per_token: 0
      output_cost_per_token: 0
      cache_read_input_token_cost: 0
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/litellm.home-operations.com/litellmmodel_v1alpha1.json
# LongCat 2.5 Free (order 1, weight 2): second free Go rung — 1M context,
# vision-capable, hosted in China (Go workspace has Global regions on).
# Same session-header requirement as Beam. Weight 2: one third of Beam's
# share so the faster sub-second rung still dominates; its vision support
# lets image-bearing simple/medium traffic stay on free rungs.
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMModel
metadata:
  name: local-free-pool-longcat-2.5-free
  labels:
    litellm.home-operations.com/managed-by: flux
spec:
  modelName: local-free-pool
  proxyRef: litellm
  params:
    model: opencode_go/longcat-2.5-free
    apiKey: os.environ/OPENCODE_GO_API_KEY
    additional:
      order: 1
      weight: 2
      max_parallel_requests: 4
  info:
    mode: chat
    maxInputTokens: 1000000
    maxOutputTokens: 262144
    supportsFunctionCalling: true
    supportsVision: true
    extra:
      input_cost_per_token: 0
      output_cost_per_token: 0
      cache_read_input_token_cost: 0
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/litellm.home-operations.com/litellmmodel_v1alpha1.json
# Paid Go overflow (order 2): Mimo 2.6 Flash, the cheapest go-pool workhorse
# per token ($60/mo allowance window, no-training, vision-capable so it can
# also absorb this lane's vision traffic when Beam and the 27B are both
# unavailable). Only reached
# when every order-1 member is in cooldown — ordinary simple/medium traffic
# still avoids the allowance-metered pool.
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMModel
metadata:
  name: local-free-pool-mimo-v2.6-flash
  labels:
    litellm.home-operations.com/managed-by: flux
spec:
  modelName: local-free-pool
  proxyRef: litellm
  params:
    model: opencode_go/mimo-v2.6-flash
    apiKey: os.environ/OPENCODE_GO_API_KEY
    additional:
      order: 2
      weight: 1
      max_parallel_requests: 2
  info:
    mode: chat
    maxInputTokens: 1048576
    maxOutputTokens: 131072
    supportsFunctionCalling: true
    supportsVision: true
    supportsPromptCaching: true
    extra:
      input_cost_per_token: 1.4e-07
      output_cost_per_token: 2.8e-07
      cache_read_input_token_cost: 2.8e-09
