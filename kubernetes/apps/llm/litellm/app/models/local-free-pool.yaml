---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/litellm.home-operations.com/litellmmodel_v1alpha1.json
# Simple/medium lane for the auto complexity router. All members sit at the
# SAME order (1) so the proxy's simple-shuffle actually mixes them per
# request — mixing only happens within one order, and the earlier staggered
# order 1/2/3/4 ladder meant the 27B took every request until a cloud rung
# 429'd into cooldown, which is why the lane felt local-slow. Rebalanced on
# 2026-11-16 after 7d of Prometheus data showed the free-majority split
# under-serving the resident model: the 27B drew ~5% of auto-lane traffic,
# beam 400-ed ~15% of its requests, and the free rungs emitted 4-5x fewer
# completion tokens than the 27B on comparable agent inputs. The 27B is now
# the lane's primary; the free rungs share the remainder (order-1 weight 10):
#   27B              (weight 5, ~50%) — the local always-resident primary;
#     keeps the prefix cache warm and gives the lane a consistent quality
#     floor, and absorbs extra share whenever a cloud rung 429/400s into
#     cooldown
#   Beam Free        (weight 3, ~30%) — zero allowance burn, "model
#     training: not used" per Go's privacy table (see opencode-go.yaml);
#     sub-second TTFT when it serves
#   Hy4 Flash Free   (weight 2, ~20%) — Tencent's everyday agent tier,
#     sub-second TTFT, 1M context and vision (Beam has none), "model
#     training: not used" with 0-day retention and no region block
# The Z.AI credit-drain rung was removed from this lane on 2026-11-16: it is
# allowance-metered, and the weekly credits drain via zai-pool traffic and
# the fallback targets instead. Vision on this lane is covered by LongCat
# and Hy4.
#
# Go free-tier session gate (2026-11-14): free rungs reject requests
# without a stable session as 400 "unknown model" — paid rungs do not.
# LiteLLM forwards x-litellm-session-id upstream as x-opencode-session;
# every client of this lane must send it (hermes does via
# session_affinity_header; headerless clients silently fall back).
# Members are picked per request by the proxy's simple-shuffle, so sessions hop
# between them; the Go session id keeps per-conversation affinity (prompt cache)
# on the cloud rungs. Order 2 is the paid Go last-resort rung: a cheap workhorse-pool
# workhorse that only fires when every order-1 member is in cooldown (local
# saturated, Go free listings down/retired). Kept at
# max_parallel_requests: 2 so this lane cannot starve workhorse-pool / implementation
# work on the same $60 allowance.
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMModel
metadata:
  name: local-free-pool-27b
  labels:
    litellm.home-operations.com/managed-by: flux
spec:
  modelName: local-free-pool
  proxyRef: litellm
  params:
    model: openai/qwen3.8-27b
    apiBase: http://nvidia-router-proxy.llm.svc.cluster.local:8080/v1
    apiKey: sk-llmkube-noauth
    additional:
      timeout: 90
      max_parallel_requests: 10
      reasoning_effort: medium
      order: 1
      weight: 5
      allowed_openai_params:
        - reasoning_effort
  info:
    mode: chat
    # maxInputTokens: 147456
    maxOutputTokens: 24576
    supportsFunctionCalling: true
    supportsVision: false
    extra:
      input_cost_per_token: 6.2e-08
      output_cost_per_token: 1.35e-06
      cache_read_input_token_cost: 0.0
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/litellm.home-operations.com/litellmmodel_v1alpha1.json
# Beam Free: the free rung that actually works — sub-second TTFT, zero
# allowance burn. Weight 3 (~30%) makes it the largest free share after the
# LongCat 2.5 Free rung was removed (2026-11-23: no longer served upstream —
# absent from the /console/go free list and 400ing "unknown model" live);
# the 27B (weight 5) is the lane primary and absorbs the load once beam's
# 4 parallel slots saturate. No vision: image-bearing requests fall through
# to Hy4 Flash Free (free, vision).
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMModel
metadata:
  name: local-free-pool-beam-free
  labels:
    litellm.home-operations.com/managed-by: flux
spec:
  modelName: local-free-pool
  proxyRef: litellm
  params:
    model: opencode_go/beam-free
    apiKey: os.environ/OPENCODE_GO_API_KEY
    additional:
      order: 1
      weight: 3
      max_parallel_requests: 4
  info:
    mode: chat
    maxInputTokens: 1048576
    maxOutputTokens: 131072
    supportsFunctionCalling: true
    supportsVision: false
    extra:
      input_cost_per_token: 0
      output_cost_per_token: 0
      cache_read_input_token_cost: 0
---


# Hy4 Flash Free: the lane's second free Go rung (added to Go on 2026-11-16).
# Tencent's everyday agent tier — vision-capable, 1M context, zero allowance
# burn, "model training: not used" with 0-day retention, and no region block
# (Beam Free blocks a country list). Weight 2: the smallest order-1 share,
# below Beam's 3 and the 27B's 5. Like every Go free rung it
# hard-requires the session header (headerless = 400).
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMModel
metadata:
  name: local-free-pool-hy4-flash-free
  labels:
    litellm.home-operations.com/managed-by: flux
spec:
  modelName: local-free-pool
  proxyRef: litellm
  params:
    model: opencode_go/hy4-flash-free
    apiKey: os.environ/OPENCODE_GO_API_KEY
    additional:
      order: 1
      weight: 2
      max_parallel_requests: 4
  info:
    mode: chat
    maxInputTokens: 1048576
    maxOutputTokens: 65536
    supportsFunctionCalling: true
    supportsVision: true
    extra:
      input_cost_per_token: 0
      output_cost_per_token: 0
      cache_read_input_token_cost: 0
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/litellm.home-operations.com/litellmmodel_v1alpha1.json
# paid-continuation layer (order 2). Fires only when EVERY order-1 member is
# in cooldown — i.e. the local 27B is saturated AND the free rungs have
# tripped their per-network daily cap. Each free rung has a same-family paid
# Go model under it (see the lane note above): hy4 covers hy4-flash-free and
# mimo covers beam (no paid Beam exists). longcat-2.0 no longer has a free
# twin (longcat-2.5-free was removed upstream on 2026-11-23) but stays as a
# cheap 1M long-context paid rung. They share weight 1 and
# max_parallel_requests: 2 so the paid layer drains the shared Go Plus $240
# pool in proportion and cannot starve the main workhorse-pool /
# implementation lanes.
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMModel
metadata:
  name: local-free-pool-mimo-v2.6-flash
  labels:
    litellm.home-operations.com/managed-by: flux
spec:
  modelName: local-free-pool
  proxyRef: litellm
  params:
    model: opencode_go/mimo-v2.6-flash
    apiKey: os.environ/OPENCODE_GO_API_KEY
    additional:
      order: 2
      weight: 1
      max_parallel_requests: 2
  info:
    mode: chat
    maxInputTokens: 1048576
    maxOutputTokens: 131072
    supportsFunctionCalling: true
    supportsVision: true
    supportsPromptCaching: true
    extra:
      input_cost_per_token: 1.4e-07
      output_cost_per_token: 2.8e-07
      cache_read_input_token_cost: 2.8e-09


---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/litellm.home-operations.com/litellmmodel_v1alpha1.json
# longcat-2.0 — paid 1M long-context rung (Meituan LongCat family; its free
# twin longcat-2.5-free was removed on 2026-11-23 after OpenCode retired it).
# 1M context, 131k output, no vision. $240/mo cap = 1x pool burn, the cheapest
# 1M long-context cover in the paid layer. Order 2: only reached when every
# order-1 member is in cooldown. China-hosted, so it needs "Global" regions
# in the Go workspace privacy settings.
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMModel
metadata:
  name: local-free-pool-longcat-2.0
  labels:
    litellm.home-operations.com/managed-by: flux
spec:
  modelName: local-free-pool
  proxyRef: litellm
  params:
    model: opencode_go/longcat-2.0
    apiKey: sk-llmkube-noauth
    additional:
      order: 2
      weight: 1
      max_parallel_requests: 2
  info:
    mode: chat
    maxInputTokens: 1000000
    maxOutputTokens: 131072
    supportsFunctionCalling: true
    supportsVision: false
    supportsPromptCaching: true
    extra:
      input_cost_per_token: 3e-07
      output_cost_per_token: 1.2e-06
      cache_read_input_token_cost: 6e-09
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/litellm.home-operations.com/litellmmodel_v1alpha1.json
# hy4 — paid twin of hy4-flash-free (same Tencent Hy family). Keeps vision
# (image in), 1M context, 65k output, reasoning-capable. $240/mo cap = 1x
# pool burn. Order 2: only reached when the free hy4-flash rung has 429'd
# its per-network daily cap, so the lane's vision traffic has a same-quality
# paid continuation instead of degrading to the non-vision longcat-2.0.
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMModel
metadata:
  name: local-free-pool-hy4
  labels:
    litellm.home-operations.com/managed-by: flux
spec:
  modelName: local-free-pool
  proxyRef: litellm
  params:
    model: opencode_go/hy4
    apiKey: sk-llmkube-noauth
    additional:
      order: 2
      weight: 1
      max_parallel_requests: 2
  info:
    mode: chat
    maxInputTokens: 1048576
    maxOutputTokens: 65536
    supportsFunctionCalling: true
    supportsVision: true
    supportsPromptCaching: true
    extra:
      input_cost_per_token: 8.34e-07
      output_cost_per_token: 2.501e-06
      cache_read_input_token_cost: 4.2e-08
