---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/litellm.home-operations.com/litellmmodel_v1alpha1.json
# REASONING lane for the auto router's hardest tier (deep reasoning, advanced
# math, intricate multi-step logic). COMPLEX/coding traffic now uses
# implementation-pool instead; see auto.yaml.
#
# Every opencode_go rung here draws from the ONE shared $240 Go Plus allowance;
# the per-model cap is a rate MULTIPLIER divisor (mult = 240 / goplus_cap), NOT
# a budget slice. Rank by effective cost = list price x multiplier, not by cap:
#   hy3                cap 240 -> 1.00x, effective out ~$0.58/1M, bench 0.895  <- primary (promoted 2026-11-20)
#   glm-5.3-flash      cap 180 -> 1.33x, effective out ~$0.67/1M, bench 0.952  <- primary
#   glm-5.3            cap 1000 -> 0.24x, effective in/out 0.34/1.06, bench reg 0.929 <- order 2 w1 (promoted 2026-11-22)
#   mimo-v2.6-flash    cap 120 -> 2.00x, effective out ~$0.56/1M              <- cheapest per token
#   deepseek-v4.1-flash  cap 200 -> 1.20x, effective in/out 0.36/1.44 peak <- order 2
#   minimax-m3.1-flash cap  80 -> 3.00x, effective out ~$1.80/1M, bench 0.714  <- order 2 w2: the cache vehicle (2026-11-21)
#   gpt-6-luna         cap  60 -> 4.00x, effective in/out 0.40/2.00, p50 ~2s   <- order 2 w1: fast lane (2026-11-21)
#   kimi-k2.7-code     cap 180 -> 1.33x, effective out ~$5.33/1M, bench 0.867  <- demoted
# zai/glm-5.3 (bench 0.625, worst value, fastest non-rolling credit burn) was
# REMOVED. deepseek-v4.1-flash (1.20x burn, cap 200) was evaluated as an
# addition and admitted at ORDER 2 (see its doc); the "Invalid model name"
# 400s from the original exclusion were the proxy rejecting an unregistered
# name, not the Go provider. hy3 was PROMOTED to order 1 on 2026-11-20 (bench
# 0.895 at 1.00x burn, ~$0.101/1M pooled = half minimax-m3's burn for
# equal-or-better quality, REPORT-POOL-FILL tier 2); its p50 5.5s is the
# slowest of the primaries — the trade buys the burn + quality win, not speed.
#
# Ladder (order is a priority FILTER, not a per-rung attribute): only the
# lowest healthy order level is eligible; weight splits traffic WITHIN a level.
#   Order 1 — hy3 (w1, promoted from eval-candidates 2026-11-20),
#             glm-5.3-flash (w1, live-tuned 2026-11-18 — adopted here),
#             zai/glm-5.3-flash (w1): cheap high-scoring primaries; the Z.AI
#             rung is the flat-plan half that drains non-rolling weekly
#             credits before they expire.
#   Order 2 — glm-5.3 (PROMOTED here 2026-11-22, bench cycle: best registry
#             score 0.929 of the five-lane suite at 0.24x burn — the LOWEST
#             burn multiplier in the Go catalog; w1, the overflow slot;
#             latency caveat: bench p50 14.4s / p90 93.1s, slower than the
#             rung it replaces, acceptable for second-wave overflow),
#             deepseek-v4.1-flash
#             (1.20x, the only sub-2x burn left, w2), mimo-v2.6-flash (2.0x,
#             w2), minimax-m3.1-flash (3.0x, w2 — the designated cache vehicle:
#             4x cheaper cache-read than m3 on the list, half the fresh-input
#             price, same measured latency, and this lane's input is ~93%
#             cache-read) + gpt-6-luna (4.0x, w1 — the fast lane, p50 ~2s):
#             cheap second wave once order 1 saturates/cools. The tier mix is
#             1/2/2/2/1 of a weight-8 total — m3.1, mimo and deepseek a
#             quarter each, glm-5.3 and gpt-6-luna an eighth each.
#             2026-11-21 Go Plus usage report: the report's other findings
#             (gemini's 2x off-peak multiplier, deepseek's off-peak pricing)
#             stay documented landmines for this pool — no change made.
#   Order 4 — gemini-4-argon: 2.00x burn but the only 1M-class deep rung, with
#             a 95% cached-input discount on a 94%-cached lane. Last-resort
#             long-context rung alongside kimi; fires only in total cooldown.
#             Standardized SimpleBench (AVG@5, T=.7): 100% on our 10-item
#             subset vs 46% go-pool, 36% hy4; published frontier ~80-82%.
#   Order 3 — local 27B: free floor, ahead of the expensive cloud rung.
#   Order 4 — kimi-k2.7-code: last resort. It burned ~55% of this lane's Go
#             spend for ~18% of requests; demoting it below the free floor
#             stops one rung from dominating the shared allowance.
# A 429 puts a rung in 30s cooldown and the next eligible level carries the
# request. Every rung after the order-1 primaries must be cheap enough that a
# mid-conversation failover does not silently become the session's model.
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMModel
metadata:
  name: reasoning-pool-glm-5.3
  labels:
    litellm.home-operations.com/managed-by: flux
spec:
  modelName: reasoning-pool
  proxyRef: litellm
  params:
    model: opencode_go/glm-5.3
    apiKey: "os.environ/OPENCODE_GO_API_KEY"
    additional:
      # 2026-11-22 bench-cycle promotion (PR replaces minimax-m3's order 2
      # w1 slot): best registry score of the five-lane suite (0.929 vs m3's
      # 0.500 on the same suite; suite history in eval-candidates.yaml) at
      # 0.24x burn - effective $0.34/$1.06 per 1M vs m3's $0.40/$1.60 - so
      # it wins the equal-or-lower-effective-cost gate on BOTH axes. m3 is
      # now fully out of this pool (it remains in the go-pool ladder,
      # order 6). Latency is the accepted trade: bench p50 14.4s / p90
      # 93.1s (one reasoning runaway capped at 16k out) vs m3's 2.1s/4.0s -
      # acceptable for an order-2 overflow rung; the order-1 primaries and
      # luna's fast lane stay the latency paths.
      order: 2
      weight: 1
      max_parallel_requests: 2
  info:
    mode: chat
    maxInputTokens: 1000000
    maxOutputTokens: 131072
    supportsFunctionCalling: true
    supportsVision: false
    supportsPromptCaching: true
    extra:
      input_cost_per_token: 1.4e-06
      output_cost_per_token: 4.4e-06
      cache_read_input_token_cost: 2.6e-07
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/litellm.home-operations.com/litellmmodel_v1alpha1.json
# NEW primary (order 1): the cheapest of the high-scoring Go rungs — 1.33x
# burn, ~$0.67/1M effective output, deterministic bench 0.952. 1M context,
# sub-second TTFT. Carries the bulk of the reasoning lane; weight live-tuned
# 3->1 on 2026-11-18 (the local 27B floor carries more of the lane now) with
# mpr 3->2 — adopted here so the repo matches the running proxy.
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMModel
metadata:
  name: reasoning-pool-glm-5.3-flash
  labels:
    litellm.home-operations.com/managed-by: flux
spec:
  modelName: reasoning-pool
  proxyRef: litellm
  params:
    model: opencode_go/glm-5.3-flash
    apiKey: "os.environ/OPENCODE_GO_API_KEY"
    additional:
      order: 1
      weight: 1
      max_parallel_requests: 2
  info:
    mode: chat
    maxInputTokens: 1000000
    maxOutputTokens: 131072
    supportsFunctionCalling: true
    supportsVision: true
    supportsPromptCaching: true
    extra:
      input_cost_per_token: 1.5e-07
      output_cost_per_token: 5e-07
      cache_read_input_token_cost: 3e-08
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/litellm.home-operations.com/litellmmodel_v1alpha1.json
# Z.AI half of the order-1 pair: flat Coding Plan subscription, 0.4x off-peak
# credit consumption and the largest window. Co-primary (same order as the Go
# rungs) so its non-rolling weekly credits drain before they expire; a dried
# window 429s and cools for 30s, and the Go rungs carry the traffic. NOTE: the
# coding endpoint's training/retention terms differ from OpenCode Go's strict
# no-training pool.
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMModel
metadata:
  name: reasoning-pool-zai-glm-5.3-flash
  labels:
    litellm.home-operations.com/managed-by: flux
spec:
  modelName: reasoning-pool
  proxyRef: litellm
  params:
    model: zai/glm-5.3-flash
    apiBase: https://api.z.ai/api/coding/paas/v4
    apiKey: "os.environ/ZAI_API_KEY"
    additional:
      order: 1
      weight: 1
      max_parallel_requests: 2
  info:
    mode: chat
    maxInputTokens: 1048576
    maxOutputTokens: 131072
    supportsFunctionCalling: true
    supportsVision: true
    supportsPromptCaching: true
    extra:
      input_cost_per_token: 1.5e-07
      output_cost_per_token: 5e-07
      cache_read_input_token_cost: 3e-08
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/litellm.home-operations.com/litellmmodel_v1alpha1.json
# Order 2 — demoted from order 1: its 3.0x burn multiplier (cap 80) makes it
# the most expensive of the top scorers per token on the shared pool. Still a
# strong agentic rung, so it stays as a cheap-second-wave failover, not a
# primary. Half of M3's token cost at list price, 1M context. Weight cut
# 2->1 on the 2026-11-18 burn audit (heaviest single draw of the $9.24 heavy
# day, ~1.4x its tier partners' effective cost).
# 2026-11-21: designated cache vehicle — weight 1 -> 2, ahead of minimax-m3
# (which stays at order 2, w1). Its cache-read price is 4x cheaper than m3's
# on the list ($0.015 vs $0.06/1M; ~$0.045 vs ~$0.08 pooled at 3.0x vs 1.33x)
# and its fresh-input price is half m3's, at the same measured latency. This
# lane's input is ~93% cache-read, so the measured-mix cost per 1M input is
# ~$0.12 for m3.1 vs ~$0.14 for m3: the traffic that used to ride m3 moves to
# m3.1, and m3 is the overflow rung. mpr stays 2 like its tier peers.
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMModel
metadata:
  name: reasoning-pool-minimax-m3.1-flash
  labels:
    litellm.home-operations.com/managed-by: flux
spec:
  modelName: reasoning-pool
  proxyRef: litellm
  params:
    model: opencode_go/minimax-m3.1-flash
    apiKey: "os.environ/OPENCODE_GO_API_KEY"
    additional:
      order: 2
      weight: 2
      max_parallel_requests: 2
  info:
    mode: chat
    maxInputTokens: 1000000
    maxOutputTokens: 512000
    supportsFunctionCalling: true
    supportsVision: true
    supportsPromptCaching: true
    extra:
      input_cost_per_token: 1.5e-07
      output_cost_per_token: 6e-07
      cache_read_input_token_cost: 1.5e-08
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/litellm.home-operations.com/litellmmodel_v1alpha1.json
# Order 2 — NEW cost-effective rung: the cheapest effective per-token model on
# the plan (2.0x burn, ~$0.56/1M effective output, 1M context, vision, live 200
# verified). No deterministic bench in the reasoning set, so it is a low-order
# cost floor rather than a primary — it only fires when order 1 is saturated.
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMModel
metadata:
  name: reasoning-pool-mimo-v2.6-flash
  labels:
