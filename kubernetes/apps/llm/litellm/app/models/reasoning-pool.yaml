---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/litellm.home-operations.com/litellmmodel_v1alpha1.json
# REASONING lane for the auto router's hardest tier (deep reasoning, advanced
# math, intricate multi-step logic). COMPLEX/coding traffic now uses
# implementation-pool instead; see auto.yaml.
#
# Every opencode_go rung here draws from the ONE shared $240 Go Plus allowance;
# the per-model cap is a rate MULTIPLIER divisor (mult = 240 / goplus_cap), NOT
# a budget slice. Rank by effective cost = list price x multiplier, not by cap:
#   hy3                cap 240 -> 1.00x, effective out ~$0.58/1M, bench 0.895  <- primary (promoted 2026-11-20)
#   glm-5.3-flash      cap 180 -> 1.33x, effective out ~$0.67/1M, bench 0.952  <- primary
#   minimax-m3         cap 180 -> 1.33x, effective out ~$1.60/1M, bench 0.889  <- demoted to order 2
#   mimo-v2.6-flash    cap 120 -> 2.00x, effective out ~$0.56/1M              <- cheapest per token
#   deepseek-v4.1-flash  cap 200 -> 1.20x, effective in/out 0.36/1.44 peak <- order 2
#   minimax-m3.1-flash cap  80 -> 3.00x, effective out ~$1.80/1M, bench 0.714  <- demoted
#   kimi-k2.7-code     cap 180 -> 1.33x, effective out ~$5.33/1M, bench 0.867  <- demoted
# zai/glm-5.3 (bench 0.625, worst value, fastest non-rolling credit burn) was
# REMOVED. deepseek-v4.1-flash (1.20x burn, cap 200) was evaluated as an
# addition and admitted at ORDER 2 (see its doc); the "Invalid model name"
# 400s from the original exclusion were the proxy rejecting an unregistered
# name, not the Go provider. hy3 was PROMOTED to order 1 on 2026-11-20 (bench
# 0.895 at 1.00x burn, ~$0.101/1M pooled = half minimax-m3's burn for
# equal-or-better quality, REPORT-POOL-FILL tier 2); its p50 5.5s is the
# slowest of the primaries — the trade buys the burn + quality win, not speed.
#
# Ladder (order is a priority FILTER, not a per-rung attribute): only the
# lowest healthy order level is eligible; weight splits traffic WITHIN a level.
#   Order 1 — hy3 (w1, promoted from eval-candidates 2026-11-20),
#             glm-5.3-flash (w1, live-tuned 2026-11-18 — adopted here),
#             zai/glm-5.3-flash (w1): cheap high-scoring primaries; the Z.AI
#             rung is the flat-plan half that drains non-rolling weekly
#             credits before they expire.
#   Order 2 — minimax-m3 (demoted 2026-11-20, w1), deepseek-v4.1-flash
#             (1.20x, the only sub-2x burn left, w2), mimo-v2.6-flash
#             (2.0x, w2) + minimax-m3.1-flash (3.0x, w1 after the 2026-11-18
#             burn audit): cheap second wave once order 1 saturates/cools.
#             The tier mix is 1/1/2/2 of a weight-6 total — mimo and
#             deepseek take a third each, minimax-m3 and m3.1-flash a sixth
#             each.
#   Order 4 — gemini-4-argon: 2.00x burn but the only 1M-class deep rung, with
#             a 95% cached-input discount on a 94%-cached lane. Last-resort
#             long-context rung alongside kimi; fires only in total cooldown.
#             Standardized SimpleBench (AVG@5, T=.7): 100% on our 10-item
#             subset vs 46% go-pool, 36% hy4; published frontier ~80-82%.
#   Order 3 — local 27B: free floor, ahead of the expensive cloud rung.
#   Order 4 — kimi-k2.7-code: last resort. It burned ~55% of this lane's Go
#             spend for ~18% of requests; demoting it below the free floor
#             stops one rung from dominating the shared allowance.
# A 429 puts a rung in 30s cooldown and the next eligible level carries the
# request. Every rung after the order-1 primaries must be cheap enough that a
# mid-conversation failover does not silently become the session's model.
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMModel
metadata:
  name: reasoning-pool-minimax-m3
  labels:
    litellm.home-operations.com/managed-by: flux
spec:
  modelName: reasoning-pool
  proxyRef: litellm
  params:
    model: opencode_go/minimax-m3
    apiKey: "os.environ/OPENCODE_GO_API_KEY"
    additional:
      # 2026-11-20 pool-fill audit: demoted order 1 -> 2, weight 2 -> 1.
      # minimax-m3 drew ~89% of the Go Plus pool spend (1.33x burn,
      # $0.211/1M pooled) with the worst p90 tail of any rung (11.9s) for
      # 0.856 quality. Bulk share moves to hy3 (1.00x, 0.895); this lane
      # stays as a second-wave rung so nothing is lost if hy3 cools.
      order: 2
      weight: 1
      max_parallel_requests: 2
  info:
    mode: chat
    maxInputTokens: 1000000
    maxOutputTokens: 131072
    supportsFunctionCalling: true
    supportsVision: true
    supportsPromptCaching: true
    extra:
      input_cost_per_token: 3e-07
      output_cost_per_token: 1.2e-06
      cache_read_input_token_cost: 6e-08
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/litellm.home-operations.com/litellmmodel_v1alpha1.json
# NEW primary (order 1): the cheapest of the high-scoring Go rungs — 1.33x
# burn, ~$0.67/1M effective output, deterministic bench 0.952. 1M context,
# sub-second TTFT. Carries the bulk of the reasoning lane; weight live-tuned
# 3->1 on 2026-11-18 (the local 27B floor carries more of the lane now) with
# mpr 3->2 — adopted here so the repo matches the running proxy.
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMModel
metadata:
  name: reasoning-pool-glm-5.3-flash
  labels:
    litellm.home-operations.com/managed-by: flux
spec:
  modelName: reasoning-pool
  proxyRef: litellm
  params:
    model: opencode_go/glm-5.3-flash
    apiKey: "os.environ/OPENCODE_GO_API_KEY"
    additional:
      order: 1
      weight: 1
      max_parallel_requests: 2
  info:
    mode: chat
    maxInputTokens: 1000000
    maxOutputTokens: 131072
    supportsFunctionCalling: true
    supportsVision: true
    supportsPromptCaching: true
    extra:
      input_cost_per_token: 1.5e-07
      output_cost_per_token: 5e-07
      cache_read_input_token_cost: 3e-08
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/litellm.home-operations.com/litellmmodel_v1alpha1.json
# Z.AI half of the order-1 pair: flat Coding Plan subscription, 0.4x off-peak
# credit consumption and the largest window. Co-primary (same order as the Go
# rungs) so its non-rolling weekly credits drain before they expire; a dried
# window 429s and cools for 30s, and the Go rungs carry the traffic. NOTE: the
# coding endpoint's training/retention terms differ from OpenCode Go's strict
# no-training pool.
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMModel
metadata:
  name: reasoning-pool-zai-glm-5.3-flash
  labels:
    litellm.home-operations.com/managed-by: flux
spec:
  modelName: reasoning-pool
  proxyRef: litellm
  params:
    model: zai/glm-5.3-flash
    apiBase: https://api.z.ai/api/coding/paas/v4
    apiKey: "os.environ/ZAI_API_KEY"
    additional:
      order: 1
      weight: 1
      max_parallel_requests: 2
  info:
    mode: chat
    maxInputTokens: 1048576
    maxOutputTokens: 131072
    supportsFunctionCalling: true
    supportsVision: true
    supportsPromptCaching: true
    extra:
      input_cost_per_token: 1.5e-07
      output_cost_per_token: 5e-07
      cache_read_input_token_cost: 3e-08
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/litellm.home-operations.com/litellmmodel_v1alpha1.json
# Order 2 — demoted from order 1: its 3.0x burn multiplier (cap 80) makes it
# the most expensive of the top scorers per token on the shared pool. Still a
# strong agentic rung, so it stays as a cheap-second-wave failover, not a
# primary. Half of M3's token cost at list price, 1M context. Weight cut
# 2->1 on the 2026-11-18 burn audit (heaviest single draw of the $9.24 heavy
# day, ~1.4x its tier partners' effective cost).
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMModel
metadata:
  name: reasoning-pool-minimax-m3.1-flash
  labels:
    litellm.home-operations.com/managed-by: flux
spec:
  modelName: reasoning-pool
  proxyRef: litellm
  params:
    model: opencode_go/minimax-m3.1-flash
    apiKey: "os.environ/OPENCODE_GO_API_KEY"
    additional:
      order: 2
      weight: 1
      max_parallel_requests: 2
  info:
    mode: chat
    maxInputTokens: 1000000
    maxOutputTokens: 512000
    supportsFunctionCalling: true
    supportsVision: true
    supportsPromptCaching: true
    extra:
      input_cost_per_token: 1.5e-07
      output_cost_per_token: 6e-07
      cache_read_input_token_cost: 1.5e-08
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/litellm.home-operations.com/litellmmodel_v1alpha1.json
# Order 2 — NEW cost-effective rung: the cheapest effective per-token model on
# the plan (2.0x burn, ~$0.56/1M effective output, 1M context, vision, live 200
# verified). No deterministic bench in the reasoning set, so it is a low-order
# cost floor rather than a primary — it only fires when order 1 is saturated.
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMModel
metadata:
  name: reasoning-pool-mimo-v2.6-flash
  labels:
    litellm.home-operations.com/managed-by: flux
spec:
  modelName: reasoning-pool
  proxyRef: litellm
  params:
    model: opencode_go/mimo-v2.6-flash
    apiKey: "os.environ/OPENCODE_GO_API_KEY"
    additional:
      order: 2
      weight: 2
      max_parallel_requests: 2
  info:
    mode: chat
    maxInputTokens: 1048576
    maxOutputTokens: 131072
    supportsFunctionCalling: true
    supportsVision: true
    supportsPromptCaching: true
    extra:
      input_cost_per_token: 1.4e-07
      output_cost_per_token: 2.8e-07
      cache_read_input_token_cost: 2.8e-09
---

# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/litellm.home-operations.com/litellmmodel_v1alpha1.json
# Order 2 — 2026-11-17 production-shape eval (69k-token context, 5 targets,
# 6 tasks; modelops scratch prod_traffic_bench.py / prod_bench_results.json).
# It passed the fast class — needle (q1), code (q4 2/3), short math (q6) —
# with modest reasoning overhead (25-142 tokens) and sub-9s latencies, and
# carries the cheapest burn of any Go Plus model (1.20x; cap 200).
# KEPT BELOW the order-1 primaries: on multi-hop (q3) and the whole-scan
# aggregation tasks (q2/q5) it runs its hidden reasoning to the 2048-token
# ceiling and returns 200 with EMPTY content — a silent failure the pool's
# 429/5xx failover cannot see (the glm-5.3-flash primary answers the same
# q3 in 10 tokens with zero reasoning). Second wave: it fires only when
# order 1 saturates or cools, ahead of the 2.0x/3.0x rungs. The peak-rate
# cost block mirrors the eval candidate (PR #6016).
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMModel
metadata:
  name: reasoning-pool-deepseek-v4.1-flash
  labels:
    litellm.home-operations.com/managed-by: flux
spec:
  modelName: reasoning-pool
  proxyRef: litellm
  params:
    model: opencode_go/deepseek-v4.1-flash
    apiKey: "os.environ/OPENCODE_GO_API_KEY"
    additional:
      order: 2
      weight: 2
      max_parallel_requests: 2
  info:
    mode: chat
    maxInputTokens: 1000000
    maxOutputTokens: 131072
    supportsFunctionCalling: true
    supportsVision: true
    supportsPromptCaching: true
    # 2026-11-20 fix: cache_read was 6e-09 (= $0.006/M, 10x low). The
    # under-pricing is material because ~94% of deepseek's traffic is
    # cache-read (94,597 of 100,757 tok on the 11-18 bench). List price
    # is $0.06/M = 6e-08.
    extra:
      input_cost_per_token: 3e-07
      output_cost_per_token: 1.2e-06
      cache_read_input_token_cost: 6e-08
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/litellm.home-operations.com/litellmmodel_v1alpha1.json
# Order 3 — free floor, MOVED UP from order 4: the always-resident 27B now sits
# below the two cheap second-wave rungs but ABOVE the expensive kimi rung, so
# cloud exhaustion lands on free local capacity before a $5.33/1M model.
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMModel
metadata:
  name: reasoning-pool-27b
  labels:
    litellm.home-operations.com/managed-by: flux
spec:
  modelName: reasoning-pool
  proxyRef: litellm
  params:
    model: openai/qwen3.8-27b
    apiBase: http://nvidia-router-proxy.llm.svc.cluster.local:8080/v1
    apiKey: "sk-llmkube-noauth"
    additional:
      temperature: 1.0
      top_p: 0.95
      top_k: 20
      min_p: 0
      order: 3
      max_parallel_requests: 2
      reasoning_effort: high
      allowed_openai_params:
        - reasoning_effort
  info:
    mode: chat
    maxInputTokens: 131072
    maxOutputTokens: 40960
    supportsFunctionCalling: true
    supportsVision: false
    extra:
      input_cost_per_token: 6.2e-08
      output_cost_per_token: 1.35e-06
      cache_read_input_token_cost: 0.0
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/litellm.home-operations.com/litellmmodel_v1alpha1.json
# Order 4 — NEW long-context deep rung: 2.00x burn (cap 120) but the only
# 1M-class model in the pool, with a 95% cached-input discount on this lane's
# 94%-cached traffic (effective cache ~$0.40/1M). 100% on the standardized
# SimpleBench subset (10/10 x 5 runs), zero 403s in that window. Fires only
# when orders 1-3 are all in cooldown, alongside kimi-k2.7-code; the deep
# position bounds the blast radius of its intermittent PERMISSION_DENIED
# flakiness (see eval-candidate doc). Last resort, not a primary — its
# effective output cost ($40/1M list-x-burn) is the steepest on the board.
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMModel
metadata:
  name: reasoning-pool-gemini-4-argon
  labels:
    litellm.home-operations.com/managed-by: flux
spec:
  modelName: reasoning-pool
  proxyRef: litellm
  params:
    model: opencode_go/gemini-4-argon
    apiKey: "os.environ/OPENCODE_GO_API_KEY"
    additional:
      order: 4
      weight: 1
      max_parallel_requests: 1
  info:
    mode: chat
    maxInputTokens: 1000000
    maxOutputTokens: 131072
    supportsFunctionCalling: true
    supportsVision: true
    supportsPromptCaching: true
    extra:
      input_cost_per_token: 8e-06
      output_cost_per_token: 4e-05
      cache_read_input_token_cost: 4e-07
---
# Last resort — DEMOTED from order 3 to order 4: the best agentic coder but
# ~$5.33/1M effective output. It accounted for ~55% of this lane's Go allowance
# burn on ~18% of requests. Use the dedicated `go-coder` lane for on-purpose
# top-tier coding; here it only fires when every cheaper rung is in cooldown.
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMModel
metadata:
  name: reasoning-pool-kimi-k2.7-code
  labels:
    litellm.home-operations.com/managed-by: flux
spec:
  modelName: reasoning-pool
  proxyRef: litellm
  params:
    model: opencode_go/kimi-k2.7-code
    apiKey: "os.environ/OPENCODE_GO_API_KEY"
    additional:
      order: 4
      max_parallel_requests: 1
  info:
    mode: chat
    maxInputTokens: 262144
    maxOutputTokens: 262144
    supportsFunctionCalling: true
    supportsVision: true
    supportsPromptCaching: true
    extra:
      input_cost_per_token: 9.5e-07
      output_cost_per_token: 4e-06
      cache_read_input_token_cost: 1.9e-07
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/litellm.home-operations.com/litellmmodel_v1alpha1.json
# Order 1 — PROMOTED from eval-candidates on 2026-11-20 (REPORT-PAID +
# REPORT-POOL-FILL tier 2): 0.895 overall on the 23-task paid bench (math
# .875 / code .847 / tools .917 / long-ctx 1.00), 1.00x burn (cap 240, no
# penalty) and ~$0.101/1M pooled — the best paid bulk carrier on the plan:
# equal-or-better quality than minimax-m3 at half the pool burn. Trade-off:
# p50 5.5s / p90 14.7s is the slowest of the order-1 primaries; the
# promotion buys burn + quality, not speed (latency-critical work still
# splits across the w1 primaries by weight).
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMModel
metadata:
  name: reasoning-pool-hy3
  labels:
    litellm.home-operations.com/managed-by: flux
spec:
  modelName: reasoning-pool
  proxyRef: litellm
  params:
    model: opencode_go/hy3
    apiKey: "os.environ/OPENCODE_GO_API_KEY"
    additional:
      order: 1
      weight: 1
      max_parallel_requests: 2
  info:
    mode: chat
    maxInputTokens: 1048576
    maxOutputTokens: 65536
    supportsFunctionCalling: true
    supportsVision: false
    supportsPromptCaching: true
    extra:
      input_cost_per_token: 1.4e-07
      output_cost_per_token: 5.8e-07
      cache_read_input_token_cost: 5.8e-08
