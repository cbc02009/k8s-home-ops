    apiKey: "os.environ/OPENCODE_GO_API_KEY"
    additional:
      order: 2
      weight: 2
      max_parallel_requests: 2
  info:
    mode: chat
    maxInputTokens: 1048576
    maxOutputTokens: 131072
    supportsFunctionCalling: true
    supportsVision: true
    supportsPromptCaching: true
    extra:
      input_cost_per_token: 1.4e-07
      output_cost_per_token: 2.8e-07
      cache_read_input_token_cost: 2.8e-09
---

# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/litellm.home-operations.com/litellmmodel_v1alpha1.json
# Order 2 — 2026-11-17 production-shape eval (69k-token context, 5 targets,
# 6 tasks; modelops scratch prod_traffic_bench.py / prod_bench_results.json).
# It passed the fast class — needle (q1), code (q4 2/3), short math (q6) —
# with modest reasoning overhead (25-142 tokens) and sub-9s latencies, and
# carries the cheapest burn of any Go Plus model (1.20x; cap 200).
# KEPT BELOW the order-1 primaries: on multi-hop (q3) and the whole-scan
# aggregation tasks (q2/q5) it runs its hidden reasoning to the 2048-token
# ceiling and returns 200 with EMPTY content — a silent failure the pool's
# 429/5xx failover cannot see (the glm-5.3-flash primary answers the same
# q3 in 10 tokens with zero reasoning). Second wave: it fires only when
# order 1 saturates or cools, ahead of the 2.0x/3.0x rungs. The peak-rate
# cost block mirrors the eval candidate (PR #6016).
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMModel
metadata:
  name: reasoning-pool-deepseek-v4.1-flash
  labels:
    litellm.home-operations.com/managed-by: flux
spec:
  modelName: reasoning-pool
  proxyRef: litellm
  params:
    model: opencode_go/deepseek-v4.1-flash
    apiKey: "os.environ/OPENCODE_GO_API_KEY"
    additional:
      order: 2
      weight: 2
      max_parallel_requests: 2
  info:
    mode: chat
    maxInputTokens: 1000000
    maxOutputTokens: 131072
    supportsFunctionCalling: true
    supportsVision: true
    supportsPromptCaching: true
    # 2026-11-20 fix: cache_read was 6e-09 (= $0.006/M, 10x low). The
    # under-pricing is material because ~94% of deepseek's traffic is
    # cache-read (94,597 of 100,757 tok on the 11-18 bench). List price
    # is $0.06/M = 6e-08.
    extra:
      input_cost_per_token: 3e-07
      output_cost_per_token: 1.2e-06
      cache_read_input_token_cost: 6e-08
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/litellm.home-operations.com/litellmmodel_v1alpha1.json
# Order 2 — 2026-11-21 fast lane: the plan's fastest paid rung (p50 ~2s /
# p90 ~5s in the Nov 17-21 window, ~5x ahead of the minimax family's 10s
# p50), so the second wave stops being this lane's slowest tier. 4.0x burn
# (cap 60), but on this lane's measured 93%-cached input mix its pooled cost
# is ~$0.12/1M input — below both minimax rungs (~$0.12 / ~$0.14) — so it is
# a burn-neutral-or-better member, not a new cost center; w1 behind the
# m3.1/mimo/deepseek split, mpr 2 like its order-2 peers. The 5x price tier
# only starts above 272k context (the largest agent loop), and the $12 5h
# window plus the 30s cooldown bound a window 429 to the rest of order 2.
# Quality caveat: gpt-6-luna has NOT been scored on the 23-task
# deterministic bench (the 2026-11-18 audit left it UNTESTED) — this is a
# second-wave add on measured latency + pooled economics, not a quality
# promotion; bench it before it may ever become an order-1 primary.
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMModel
metadata:
  name: reasoning-pool-gpt-6-luna
  labels:
    litellm.home-operations.com/managed-by: flux
spec:
  modelName: reasoning-pool
  proxyRef: litellm
  params:
    model: opencode_go/gpt-6-luna
    apiKey: "os.environ/OPENCODE_GO_API_KEY"
    additional:
      order: 2
      weight: 1
      max_parallel_requests: 2
  info:
    mode: chat
    maxInputTokens: 1050000
    maxOutputTokens: 128000
    supportsFunctionCalling: true
    supportsVision: true
    supportsPromptCaching: true
    extra:
      input_cost_per_token: 1e-07
      output_cost_per_token: 5e-07
      cache_read_input_token_cost: 1e-08
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/litellm.home-operations.com/litellmmodel_v1alpha1.json
# Order 3 — free floor, MOVED UP from order 4: the always-resident 27B now sits
# below the two cheap second-wave rungs but ABOVE the expensive kimi rung, so
# cloud exhaustion lands on free local capacity before a $5.33/1M model.
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMModel
metadata:
  name: reasoning-pool-27b
  labels:
    litellm.home-operations.com/managed-by: flux
spec:
  modelName: reasoning-pool
  proxyRef: litellm
  params:
    model: openai/qwen3.8-27b
    apiBase: http://nvidia-router-proxy.llm.svc.cluster.local:8080/v1
    apiKey: "sk-llmkube-noauth"
    additional:
      temperature: 1.0
      top_p: 0.95
      top_k: 20
      min_p: 0
      order: 3
      max_parallel_requests: 2
      reasoning_effort: high
      allowed_openai_params:
        - reasoning_effort
  info:
    mode: chat
    maxInputTokens: 131072
    maxOutputTokens: 40960
    supportsFunctionCalling: true
    supportsVision: false
    extra:
      input_cost_per_token: 6.2e-08
      output_cost_per_token: 1.35e-06
      cache_read_input_token_cost: 0.0
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/litellm.home-operations.com/litellmmodel_v1alpha1.json
# Order 4 — NEW long-context deep rung: 2.00x burn (cap 120) but the only
# 1M-class model in the pool, with a 95% cached-input discount on this lane's
# 94%-cached traffic (effective cache ~$0.40/1M). 100% on the standardized
# SimpleBench subset (10/10 x 5 runs), zero 403s in that window. Fires only
# when orders 1-3 are all in cooldown, alongside kimi-k2.7-code; the deep
# position bounds the blast radius of its intermittent PERMISSION_DENIED
# flakiness (see eval-candidate doc). Last resort, not a primary — its
# effective output cost ($40/1M list-x-burn) is the steepest on the board.
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMModel
metadata:
  name: reasoning-pool-gemini-4-argon
  labels:
    litellm.home-operations.com/managed-by: flux
spec:
  modelName: reasoning-pool
  proxyRef: litellm
  params:
