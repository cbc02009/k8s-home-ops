---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/litellm.home-operations.com/litellmmodel_v1alpha1.json
# Reasoning lane for COMPLEX/REASONING traffic, ordered cheapest-first so a
# healthy window always burns the cheapest allowance available. Rungs come in
# paired tiers: each Z.AI Coding Plan rung sits at the SAME order as its Go
# counterpart (Go weight 2 : Z.AI weight 1), so the two flat subscriptions
# back each other up — when one side's 5h/weekly window dries, that member
# 429s, cools for 30s, and the other subscription's rung carries the
# traffic. Pairing Z.AI as a co-primary is also how its non-rolling weekly
# credits get burned before they expire:
#   1. MiniMax M3        — $60 Go workhorse window, 1M context (Z.AI: GLM-5.3)
#   2. MiniMax M3.1 Flash — $20-30 Go mid window (Z.AI: GLM-5.3 Flash)
#   3. Kimi K2.7 Code    — premium, rationed to last-resort cloud; use the
#                          dedicated `go-coder` lane for on-purpose top-tier coding
#   4. Local 27B         — free floor, last resort
# Failover matters more than order here: a session that trips a 429 mid-conversation
# sticks to the deployment that caught it (router deployment pin), so every rung
# after M3 must be cheap enough that a failover does not silently become the session's model.
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMModel
metadata:
  name: reasoning-pool-minimax-m3
  labels:
    litellm.home-operations.com/managed-by: flux
spec:
  modelName: reasoning-pool
  proxyRef: litellm
  params:
    model: opencode_go/minimax-m3
    apiKey: os.environ/OPENCODE_GO_API_KEY
    additional:
      order: 1
      weight: 2
      max_parallel_requests: 2
  info:
    mode: chat
    maxInputTokens: 1000000
    maxOutputTokens: 131072
    supportsFunctionCalling: true
    supportsVision: true
    supportsPromptCaching: true
    extra:
      input_cost_per_token: 3e-07
      output_cost_per_token: 1.2e-06
      cache_read_input_token_cost: 6e-08
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/litellm.home-operations.com/litellmmodel_v1alpha1.json
# Tier 1 (Z.AI half): GLM-5.3 — Z.AI's best, 1x off-peak / 3x peak credit
# consumption, rationed to one parallel request.
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMModel
metadata:
  name: reasoning-pool-zai-glm-5.3
  labels:
    litellm.home-operations.com/managed-by: flux
spec:
  modelName: reasoning-pool
  proxyRef: litellm
  params:
    model: zai/glm-5.3
    apiBase: https://api.z.ai/api/coding/paas/v4
    apiKey: os.environ/ZAI_API_KEY
    additional:
      order: 1
      weight: 1
      max_parallel_requests: 1
  info:
    mode: chat
    maxInputTokens: 1048576
    maxOutputTokens: 131072
    supportsFunctionCalling: true
    supportsVision: true
    supportsPromptCaching: true
    extra:
      input_cost_per_token: 1.4e-06
      output_cost_per_token: 4.4e-06
      cache_read_input_token_cost: 2.6e-07
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/litellm.home-operations.com/litellmmodel_v1alpha1.json
# Tier 2 (Go half): half of M3's token cost, same 1M context, and its own Go
# allowance instead of a second burn on M3.
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMModel
metadata:
  name: reasoning-pool-minimax-m3.1-flash
  labels:
    litellm.home-operations.com/managed-by: flux
spec:
  modelName: reasoning-pool
  proxyRef: litellm
  params:
    model: opencode_go/minimax-m3.1-flash
    apiKey: os.environ/OPENCODE_GO_API_KEY
    additional:
      order: 2
      weight: 2
      max_parallel_requests: 2
  info:
    mode: chat
    maxInputTokens: 1000000
    maxOutputTokens: 512000
    supportsFunctionCalling: true
    supportsVision: true
    supportsPromptCaching: true
    extra:
      input_cost_per_token: 1.5e-07
      output_cost_per_token: 6e-07
      cache_read_input_token_cost: 1.5e-08
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/litellm.home-operations.com/litellmmodel_v1alpha1.json
# Tier 2 (Z.AI half): Flash — the cheap drain rung (0.4x off-peak credit
# consumption) with the largest window.
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMModel
metadata:
  name: reasoning-pool-zai-glm-5.3-flash
  labels:
    litellm.home-operations.com/managed-by: flux
spec:
  modelName: reasoning-pool
  proxyRef: litellm
  params:
    model: zai/glm-5.3-flash
    apiBase: https://api.z.ai/api/coding/paas/v4
    apiKey: os.environ/ZAI_API_KEY
    additional:
      order: 2
      weight: 1
      max_parallel_requests: 2
  info:
    mode: chat
    maxInputTokens: 1048576
    maxOutputTokens: 131072
    supportsFunctionCalling: true
    supportsVision: true
    supportsPromptCaching: true
    extra:
      input_cost_per_token: 1.5e-07
      output_cost_per_token: 5e-07
      cache_read_input_token_cost: 3e-08
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/litellm.home-operations.com/litellmmodel_v1alpha1.json
# Last cloud rung: the best agentic coder, but 10x M3 per token. Deliberately
# rationed — it only fires when M3, M3.1 Flash and both Z.AI rungs are all in
# cooldown. Use the dedicated `go-coder` lane for on-purpose top-tier coding.
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMModel
metadata:
  name: reasoning-pool-kimi-k2.7-code
  labels:
    litellm.home-operations.com/managed-by: flux
spec:
  modelName: reasoning-pool
  proxyRef: litellm
  params:
    model: opencode_go/kimi-k2.7-code
    apiKey: os.environ/OPENCODE_GO_API_KEY
    additional:
      order: 3
      max_parallel_requests: 1
  info:
    mode: chat
    maxInputTokens: 262144
    maxOutputTokens: 262144
    supportsFunctionCalling: true
    supportsVision: true
    supportsPromptCaching: true
    extra:
      input_cost_per_token: 9.5e-07
      output_cost_per_token: 4e-06
      cache_read_input_token_cost: 1.9e-07
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/litellm.home-operations.com/litellmmodel_v1alpha1.json
# Free floor: local 27B as the last-resort fallback when every cloud rung is
# exhausted or in cooldown. Quality drops, but nothing else gets burned.
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMModel
metadata:
  name: reasoning-pool-27b
  labels:
    litellm.home-operations.com/managed-by: flux
spec:
  modelName: reasoning-pool
  proxyRef: litellm
  params:
    model: openai/qwen3.8-27b
    apiBase: http://nvidia-router-proxy.llm.svc.cluster.local:8080/v1
    apiKey: sk-llmkube-noauth
    additional:
      temperature: 1.0
      top_p: 0.95
      top_k: 20
      min_p: 0
      order: 4
      max_parallel_requests: 2
      reasoning_effort: high
      allowed_openai_params:
        - reasoning_effort
  info:
    mode: chat
    maxInputTokens: 131072
    maxOutputTokens: 40960
    supportsFunctionCalling: true
    supportsVision: false
    extra:
      input_cost_per_token: 6.2e-08
      output_cost_per_token: 1.35e-06
      cache_read_input_token_cost: 0.0
