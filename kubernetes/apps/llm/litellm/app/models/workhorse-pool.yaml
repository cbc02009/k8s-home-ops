---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/litellm.home-operations.com/litellmmodel_v1alpha1.json
# The workhorse pool: the stack's general-purpose bulk cloud lane — everyday
# agent/coding/chat traffic drains here first, it is the vision-capable
# cloud lane (absorbed the former go-chat lane), and frontier-pool's
# overflow rung. Underlying subscription: OpenCode Go ($10/mo).
# Provider opencode_go/ requires
# LiteLLM >= v1.109.0 (provider first shipped in v1.109.0-rc.1; NOT in the
# 1.108.x LTS line). Auth: OPENCODE_GO_API_KEY on the proxy (1Password item
# "opencode-go", field api_key, pushed via the litellm ExternalSecret — kept
# separate from the item used for cluster opencode's own cloud sign-in).
# Billing: flat subscription. Each model has a monthly allowance at Go list
# rates ($60 workhorses, $20-30 mid, $15 premium) with a 5h window at 20% of
# monthly; the prices below mirror LiteLLM's built-in opencode_go catalog and
# track allowance burn on the economics dashboard — they are not extra charge.
# Routing: workhorse-pool members carry `order` so the big-allowance cheap models
# drain first and the $15-20 models are rationed last.
# 2026-11-21 (Go Plus usage report, findings 1+2): gpt-6-luna joins the
# ladder - the plan's fastest paid rung (p50 ~2s / p90 ~5s in the Nov
# 17-21 window, ~5x faster than the minimax family's 10s p50). Pooled
# cost on this lane's measured 93%-cached input mix is ~$0.12/1M input,
# on par with minimax-m3.1-flash (~$0.12), so the ladder stays
# cost-ascending, and m3.1-flash stays the cache vehicle. It burns the
# shared pool at 4.0x (cap 60): the $12 5h window bounds the blast
# radius and a window 429 fails the ladder down to m3.1-flash.
# 2026-11-22 (pool trim): the ladder was cut from 10 rungs to 4 -
# glm-5.3-flash, gpt-6-luna, minimax-m3.1-flash, longcat-2.5-free.
# Dropped: mimo-v2.6-flash and qwen3.8-flash (redundant with the glm
# head), minimax-m3 (superseded by m3.1-flash), kimi-k2.7-code (still
# in reasoning-pool), beam-free (region-locked) and hy4-flash-free (66k
# output cap) - classifier-pool and local-free-pool keep their own
# copies of the free rungs, so no cluster capability is lost. The
# named single-model lanes (go-coder/go-strong/go-max/go-chat) were
# removed in the same change; their consumers (coder/qwencode/
# open-webui keys, hermes vision roles) now ride this pool, and their
# fallback chains were collapsed accordingly. claude-haiku-5-5 remains
# out of the pool: its 5x price tier starts above 100k context, which
# the heavy agent loops cross.
# 2026-11-22 (rename + refocus): renamed go-pool -> workhorse-pool - the
# name now states the lane's FUNCTION (the bulk workhorse ladder), not
# its provenance. The longcat-2.5-free rung moved out: it is a free
# floor, not workhorse capacity, and already serves at order 1 of
# local-free-pool; the pool's fallback chain (local-free-pool, then
# zai-pool) keeps the zero-burn floor reachable when the paid windows
# dry. The ladder is the three paid workhorse rungs.
# Sessions: LiteLLM forwards x-litellm-session-id as x-opencode-session (the
# envoy filter already maps x-session-id -> x-litellm-session-id); LiteLLM
# does not invent one, so agents that send a stable x-session-id get the
# better prompt-cache behaviour.
# DATA POLICY: Go publishes per-model training/retention terms. Everything in
# this pool is no-training (paid endpoints that train on request data are
# blocked by default in the workspace privacy settings). Models that train
# on prompts in exchange for free/discounted tokens — Iceman Contributor
# Free, Muse Spark 1.x Contributor — are deliberately EXCLUDED and must
# not be added. Free Go rungs live in local-free-pool / classifier-pool,
# which carry their own data-policy notes.
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMModel
metadata:
  name: workhorse-pool-glm-5.3-flash
spec:
  modelName: workhorse-pool
  proxyRef: litellm
  params:
    model: opencode_go/glm-5.3-flash
    apiKey: "os.environ/OPENCODE_GO_API_KEY"
    additional:
      order: 1
      max_parallel_requests: 4
  info:
    mode: chat
    maxInputTokens: 1000000
    maxOutputTokens: 131072
    supportsFunctionCalling: true
    supportsVision: true
    supportsPromptCaching: true
    extra:
      input_cost_per_token: 1.5e-07
      output_cost_per_token: 5e-07
      cache_read_input_token_cost: 3e-08
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/litellm.home-operations.com/litellmmodel_v1alpha1.json
# 2026-11-21: fast lane - the plan's fastest paid rung (p50 ~2s / p90
# ~5s). 4.0x burn (cap 60); the $12 5h window and the 30s cooldown on a
# window 429 bound it. Its 5x price tier only starts above 272k
# context, which the lanes' typical requests do not reach.
# 2026-11-22: promoted to order 2 in the trimmed 4-rung ladder.
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMModel
metadata:
  name: workhorse-pool-gpt-6-luna
spec:
  modelName: workhorse-pool
  proxyRef: litellm
  params:
    model: opencode_go/gpt-6-luna
    apiKey: "os.environ/OPENCODE_GO_API_KEY"
    additional:
      order: 2
      max_parallel_requests: 4
  info:
    mode: chat
    maxInputTokens: 1050000
    maxOutputTokens: 128000
    supportsFunctionCalling: true
    supportsVision: true
    supportsPromptCaching: true
    extra:
      input_cost_per_token: 1e-07
      output_cost_per_token: 5e-07
      cache_read_input_token_cost: 1e-08
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/litellm.home-operations.com/litellmmodel_v1alpha1.json
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMModel
metadata:
  name: workhorse-pool-minimax-m3.1-flash
spec:
  modelName: workhorse-pool
  proxyRef: litellm
  params:
    model: opencode_go/minimax-m3.1-flash
    apiKey: "os.environ/OPENCODE_GO_API_KEY"
    additional:
      order: 3
      max_parallel_requests: 4
  info:
    mode: chat
    maxInputTokens: 1000000
    maxOutputTokens: 512000
    supportsFunctionCalling: true
    supportsVision: true
    supportsPromptCaching: true
    extra:
      input_cost_per_token: 1.5e-07
      output_cost_per_token: 6e-07
      cache_read_input_token_cost: 1.5e-08
