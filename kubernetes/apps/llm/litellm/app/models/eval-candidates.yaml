# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/litellm.home-operations.com/litellmmodel_v1alpha1.json
# Individual (non-pool) OpenCode Go candidate models for evaluation. These are
# NOT in any auto-router pool — they exist only so deterministic benchmarks can
# be run against a fixed model name (a pool's shuffle router ignores a pinned
# model_id; individual deployments do not). Promote a winner into the matching
# pool only after a benchmark shows it beats the current rung at equal or lower
# effective cost on the shared $240 Go Plus allowance.
#
# Effective cost = list price x (240 / goplus_cap). deepseek-v4.1-flash has a
# Go Plus cap of 200 -> 1.20x, the cheapest burn of any non-free Go model and
# cheaper than the current glm-5.3-flash primary (cap 180 -> 1.33x).
# deepseek-v4.1-flash was previously assumed to 400 ("Invalid model name"), but
# that 400 was the LITELLM PROXY rejecting an unregistered name, not the Go
# provider. Registering it here makes the real provider test possible.
# No OpenRouter is involved: these are opencode_go/ deployments via the Go key.

---
# DeepSeek V4.1 Flash: cap 200 -> 1.20x burn (cheapest non-free Go model). DeepSWE 74.2 / TB2.1 90.6 - beats current pool rungs. User-requested test.
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMModel
metadata:
  name: eval-deepseek-v4.1-flash
  labels:
    litellm.home-operations.com/managed-by: flux
spec:
  modelName: eval-deepseek-v4.1-flash
  proxyRef: litellm
  params:
    model: opencode_go/deepseek-v4.1-flash
    apiKey: os.environ/OPENCODE_GO_API_KEY
    additional:
      max_parallel_requests: 2
  info:
    mode: chat
    maxInputTokens: 1000000
    maxOutputTokens: 384000
    supportsFunctionCalling: true
    supportsVision: true
    supportsPromptCaching: true
    extra:
      input_cost_per_token: 3e-07
      output_cost_per_token: 1.2e-06
      cache_read_input_token_cost: 6e-09
---
