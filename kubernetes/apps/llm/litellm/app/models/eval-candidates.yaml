# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/litellm.home-operations.com/litellmmodel_v1alpha1.json
# Individual (non-pool) OpenCode Go candidate models for evaluation. These are
# NOT in any auto-router pool - they exist only so deterministic benchmarks can
# be run against a fixed model name (a pool's shuffle router ignores a pinned
# model_id; individual deployments do not). Promote a winner into the matching
# pool only after a benchmark shows it beats the current rung at equal or lower
# effective cost on the shared $240 Go Plus allowance.
#
# Effective cost = list price x (240 / goplus_cap). Each doc below notes its own
# cap/burn and third-party benchmark signal at the time of registration.
# No OpenRouter is involved: these are opencode_go/ deployments via the Go key.

# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/litellm.home-operations.com/litellmmodel_v1alpha1.json
# Hy4 (Tencent): cap 240 -> 1.00x burn (cheapest paid model in the Go lineup,
# 17% under deepseek-v4.1-flash). DeepSWE 74.9 measured (benchgap) ~ deepseek's
# 74.2; Tencent's own chart has it beating DeepSeek V4.1 Flash and GLM-5.3 on
# several tests. Weak spot: Terminal-Bench 4.0 only 44.4 vs Kimi K3.1 Pro 66.8.
# 770B MoE; latency unknown on our lane. Efficiency target: beat glm-5.3-flash
# at 2.76 score-per-burn-unit on the production-shape bench.
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMModel
metadata:
  name: eval-hy4
  labels:
    litellm.home-operations.com/managed-by: flux
spec:
  modelName: eval-hy4
  proxyRef: litellm
  params:
    model: opencode_go/hy4
    apiKey: os.environ/OPENCODE_GO_API_KEY
    additional:
      max_parallel_requests: 2
  info:
    mode: chat
    maxInputTokens: 1048576
    maxOutputTokens: 65536
    supportsFunctionCalling: true
    supportsVision: true
    supportsPromptCaching: true
    extra:
      input_cost_per_token: 8.34e-07
      output_cost_per_token: 2.5e-06
      cache_read_input_token_cost: 4.17e-08
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/litellm.home-operations.com/litellmmodel_v1alpha1.json
# Gemini 4 Argon (Google): cap 120 -> 2.00x burn (half the frontier-tier burn).
# AA Intelligence Index 53 (matches GPT-6 Astra max), #1 AutomationBench-AA 78%,
# DeepSWE v1.1 77.9 (vs Opus 5.5 74.2), and the strongest long-context scores
# found anywhere (GraphWalks 256k-1M subset 84.2%, 1M context, 95% cached-input
# discount). Aimed at the class our flashes starve on (whole-scan long-context
# aggregation). 2x burn but a 95% cache discount on our 94%-cached reasoning lane.
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMModel
metadata:
  name: eval-gemini-4-argon
  labels:
    litellm.home-operations.com/managed-by: flux
spec:
  modelName: eval-gemini-4-argon
  proxyRef: litellm
  params:
    model: opencode_go/gemini-4-argon
    apiKey: os.environ/OPENCODE_GO_API_KEY
    additional:
      max_parallel_requests: 2
  info:
    mode: chat
    maxInputTokens: 1000000
    maxOutputTokens: 131072
    supportsFunctionCalling: true
    supportsVision: true
    supportsPromptCaching: true
    extra:
      input_cost_per_token: 4e-06
      output_cost_per_token: 2e-05
      cache_read_input_token_cost: 2e-07
