# list, cache read $0.015; effective $0.45 in / $1.80 out - the pair it
# is measured against prices at $0.40/$2.00 (luna) and identical
# $0.10/$0.50 list (haiku). maxOutput 512000 per its pool doc.
apiVersion: litellm.home-operations.com/v1alpha1
