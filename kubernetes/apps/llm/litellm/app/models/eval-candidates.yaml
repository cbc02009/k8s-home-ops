# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/litellm.home-operations.com/litellmmodel_v1alpha1.json
#
# *** DORMANT - NOT DEPLOYED ***
# This file is intentionally NOT listed in models/kustomization.yaml, so none of
# the eval-* models below are registered on the live litellm proxy. The eval pool
# is a transient testing fixture: it is removed when no bench is running and
# re-created only when a bench cycle is requested.
#
#   To run a bench cycle: add `- ./eval-candidates.yaml` back to
#   kustomization.yaml (keep these individual eval-* modelNames for per-model
#   attribution - never a shared pool modelName, which breaks diagnosis), run the
#   bench, then remove that line again so flux GC's the CRs off the proxy.
#
# Individual (non-pool) OpenCode Go candidate models for evaluation. These are
# NOT in any auto-router pool - they exist only so deterministic benchmarks can
# be run against a fixed model name (a pool's shuffle router ignores a pinned
# model_id; individual deployments do not). Promote a winner into the matching
# pool only after a benchmark shows it beats the current rung at equal or lower
# effective cost on the shared $240 Go Plus allowance.
#
# Effective cost = list price x (240 / goplus_cap). Each doc below notes its own
# cap/burn and third-party benchmark signal at the time of registration.
# No OpenRouter is involved: these are opencode_go/ deployments via the Go key.
#
# Cycle history:
#   2026-11-17: hy4 + gemini-4-argon registered (PR #6016). Cycle closed
#   2026-11-17: gemini-4-argon promoted to reasoning-pool order 4; hy4
#   rejected (36% standardized SimpleBench vs 46% go-pool / 100% gemini).
#   2026-11-18 spend audit (weekly-spend-audit-2026-11-18.md): new cycle
#   registered gpt-6-luna (rec 1: frontier-class fidelity at effective
#   $0.40/$2.00 per 1M - bench then promote to implementation-pool order 3,
#   the slot vacated by the m3.1-flash weight cut), hy3 (rec 5: the 1x-burn
#   bargain, cheapest effective output in the catalog), and claude-haiku-5-5
#   (rec 1: identical list price to gpt-6-luna - head-to-head bench decides
#   which of the two carries the slot).
#   2026-11-20 pool-fill cycle: hy3 PROMOTED to reasoning-pool order 1
#   (bench 0.895 at 1.00x burn, ~$0.101/1M pooled = half minimax-m3's burn
#   for equal-or-better quality, REPORT-POOL-FILL tier 2); minimax-m3
#   demoted to order 2; implementation-pool mimo weight 1->2; hy3's
#   input_cost fixed 0 -> 1.4e-07 (was under-reported on the dashboard).
#   2026-11-22 bench cycle (user-approved): registered eval-glm-5.3 -
#   flagship GLM at cap 1000 -> 0.24x burn, the LOWEST multiplier in the
#   catalog (effective $0.336/$1.056 per 1M, flash-class money at
#   flagship class); bench target: reasoning-pool order 2. Reference
#   lanes eval-minimax-m3 (current reasoning-pool order 2 paid rung)
#   and eval-minimax-m3.1-flash (implementation-pool order 3) added so
#   all five targets score on ONE suite - prior-cycle numbers came from
#   an older harness and are not directly comparable. Carried over from
#   the 11-18 audit: eval-gpt-6-luna vs eval-claude-haiku-5-5
#   head-to-head for implementation-pool order 3 (note: 11-21 rebalance
#   already placed gpt-6-luna in reasoning-pool order 2 as the fast
#   lane; the implementation slot decision still pends this bench).
#   Closed: eval-hy3 removed (promoted 2026-11-20, no longer a
#   candidate).
#   2026-11-22 RESULTS (registry lane: 1800-row deterministic service
#   registry, 66.8k-token context, 14 tasks; code lane: 4 sandbox-tested
#   tasks; gold answers computed locally; suite seed 4224):
#     eval-glm-5.3            avg 0.889  reg 0.929  code 0.75  p50 14.4s  p90 93.1s
#     eval-claude-haiku-5-5   avg 0.889  reg 0.857  code 1.00  p50 5.1s   p90 16.6s
#     eval-minimax-m3.1-flash avg 0.833  reg 0.786  code 1.00  p50 6.6s   p90 48.6s  (1 length-starved)
#     eval-gpt-6-luna         avg 0.778  reg 0.714  code 1.00  p50 2.3s   p90 20.3s
#     eval-minimax-m3         avg 0.611  reg 0.500  code 1.00  p50 2.1s   p90 4.0s
#   Notes: (a) glm-5.3 scored the best registry lane at the catalog's
#   LOWEST burn (0.24x) - promotion candidate for reasoning-pool order 2
#   vs the demoted minimax-m3 rung (0.500 here), gated on its latency
#   (one reasoning-runaway hit the 16k bench cap; production has no such
#   cap). (b) Haiku beat luna for implementation order 3 on quality but
#   got ZERO provider cache hits in the bench session vs 93% for luna -
#   follow up before any promotion; neither displaces m3.1-flash under
#   the equal-or-lower-effective-cost gate (haiku 4.0x output vs 3.0x).
#   (c) This suite re-confirms the 2026-11-20 minimax-m3 demotion.
#   Eval CRs undeployed (kustomization line removed; this file stays as
#   the cycle fixture).
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/litellm.home-operations.com/litellmmodel_v1alpha1.json
# GPT-6 Luna (OpenAI): cap 60 -> 4.0x burn, but the lowest list price in the
# paid lineup ($0.10/$0.50 per 1M) -> effective $0.40 in / $2.00 out - below
# minimax-m3.1-flash's effective $0.45/$1.80, the rung it targets for.
# "OpenAI's most efficient model for focused, high-volume tasks" (Go catalog,
# released 2026-09-22). Switch-day probe on 2026-11-17 (~$0.05) returned a
# valid completion. Bench target: implementation-pool order 3 (the 3.0x-burn
# overflow slot being cut in this PR). Context/vision unverified on our lane -
# set conservative (262144 in, no vision); cache discount assumed 90%.
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMModel
metadata:
  name: eval-gpt-6-luna
  labels:
    litellm.home-operations.com/managed-by: flux
spec:
  modelName: eval-gpt-6-luna
  proxyRef: litellm
  params:
    model: opencode_go/gpt-6-luna
    apiKey: "os.environ/OPENCODE_GO_API_KEY"
    additional:
      max_parallel_requests: 2
  info:
    mode: chat
    maxInputTokens: 262144
    maxOutputTokens: 65536
    supportsFunctionCalling: true
    supportsVision: false
    supportsPromptCaching: true
    extra:
      input_cost_per_token: 1e-07
      output_cost_per_token: 5e-07
      cache_read_input_token_cost: 1e-08
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/litellm.home-operations.com/litellmmodel_v1alpha1.json
# Claude Haiku 5.5 (Anthropic): cap 60 -> 4.0x burn, $0.10/$0.50 per 1M list -
# IDENTICAL effective price to gpt-6-luna, so the bench is a head-to-head:
# whichever wins carries the implementation-pool order 3 promotion. The
# production chat-vision traffic this model served via the former go-chat
# lane (open-webui) now rides go-pool; this eval lane stays a dedicated
# bench target. Vision + 1M context.
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMModel
metadata:
  name: eval-claude-haiku-5-5
  labels:
    litellm.home-operations.com/managed-by: flux
spec:
  modelName: eval-claude-haiku-5-5
  proxyRef: litellm
  params:
    model: opencode_go/claude-haiku-5-5
    apiKey: "os.environ/OPENCODE_GO_API_KEY"
    additional:
      max_parallel_requests: 2
  info:
    mode: chat
    maxInputTokens: 1000000
    maxOutputTokens: 128000
    supportsFunctionCalling: true
    supportsVision: true
    supportsPromptCaching: true
    extra:
      input_cost_per_token: 1e-07
      output_cost_per_token: 5e-07
      cache_read_input_token_cost: 1e-08
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/litellm.home-operations.com/litellmmodel_v1alpha1.json
# GLM 5.3 (Zhipu, released 2026-08-14): "Flagship GLM model for long-horizon
# coding, agents, and complex project delivery". cap 1000 -> 0.24x burn - the
# LOWEST burn multiplier in the Go catalog - at $1.40/$4.40 per 1M list
# (cache read $0.26), so its EFFECTIVE cost is $0.336 in / $1.056 out per 1M:
# flash-class money at flagship class. Its 0.24x cap also makes it the best
# burn-rate guard available: bulk traffic routed here drains the shared $240
# pool 5.5x slower than a 1.33x rung and 16x slower than a 4x rung. Bench
# target: reasoning-pool order 2 (replace or supplement the paid rungs there).
# No context-gated price overrides. Text-only (no vision); tools + structured
# output + reasoning effort per the live Go catalog (re-checked 2026-11-22).
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMModel
metadata:
  name: eval-glm-5.3
  labels:
    litellm.home-operations.com/managed-by: flux
spec:
  modelName: eval-glm-5.3
  proxyRef: litellm
  params:
    model: opencode_go/glm-5.3
    apiKey: "os.environ/OPENCODE_GO_API_KEY"
    additional:
      max_parallel_requests: 2
  info:
    mode: chat
    maxInputTokens: 1000000
    maxOutputTokens: 131072
    supportsFunctionCalling: true
    supportsVision: false
    supportsPromptCaching: true
    extra:
      input_cost_per_token: 1.4e-06
      output_cost_per_token: 4.4e-06
      cache_read_input_token_cost: 2.6e-07
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/litellm.home-operations.com/litellmmodel_v1alpha1.json
# REFERENCE LANE (not a promotion candidate): minimax-m3 as a pinned
# individual deployment so the suite scores it side-by-side with
# eval-glm-5.3. It already serves reasoning-pool order 2 (w1, demoted
# 2026-11-20; prior-suite quality 0.856 with the lane's worst p90 at
# 11.9s). cap 180 -> 1.33x burn; $0.30/$1.20 list, cache read $0.06.
# The >512k context override (2x prices) is out of bench range (~64k).
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMModel
metadata:
  name: eval-minimax-m3
  labels:
    litellm.home-operations.com/managed-by: flux
spec:
  modelName: eval-minimax-m3
  proxyRef: litellm
  params:
    model: opencode_go/minimax-m3
    apiKey: "os.environ/OPENCODE_GO_API_KEY"
    additional:
      max_parallel_requests: 2
  info:
    mode: chat
    maxInputTokens: 1000000
    maxOutputTokens: 131072
    supportsFunctionCalling: true
    supportsVision: true
    supportsPromptCaching: true
    extra:
      input_cost_per_token: 3e-07
      output_cost_per_token: 1.2e-06
      cache_read_input_token_cost: 6e-08
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/litellm.home-operations.com/litellmmodel_v1alpha1.json
# REFERENCE LANE (not a promotion candidate): minimax-m3.1-flash, the
# implementation-pool order 3 incumbent the luna/haiku winner would
