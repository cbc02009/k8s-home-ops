# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/litellm.home-operations.com/litellmmodel_v1alpha1.json
# Hy4 (Tencent): cap 240 -> 1.00x burn (cheapest paid model in the Go lineup,
# 17% under deepseek-v4.1-flash). DeepSWE 74.9 measured (benchgap) ~ deepseek's
# 74.2; Tencent's own chart has it beating DeepSeek V4.1 Flash and GLM-5.3 on
# several tests. Weak spot: Terminal-Bench 4.0 only 44.4 vs Kimi K3.1 Pro 66.8.
# 770B MoE; latency unknown on our lane. Efficiency target: beat glm-5.3-flash
# at 2.76 score-per-burn-unit on the production-shape bench.
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMModel
metadata:
  name: eval-hy4
  labels:
    litellm.home-operations.com/managed-by: flux
spec:
  modelName: eval-hy4
  proxyRef: litellm
  params:
    model: opencode_go/hy4
    apiKey: os.environ/OPENCODE_GO_API_KEY
    additional:
      max_parallel_requests: 2
  info:
    mode: chat
    maxInputTokens: 1048576
    maxOutputTokens: 65536
    supportsFunctionCalling: true
    supportsVision: true
    supportsPromptCaching: true
    extra:
      input_cost_per_token: 8.34e-07
      output_cost_per_token: 2.5e-06
      cache_read_input_token_cost: 4.17e-08
---
