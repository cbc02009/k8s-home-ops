# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/litellm.home-operations.com/litellmmodel_v1alpha1.json
# Hy4 Flash Free (Tencent's Hy4 tier): limited-time free model added to Go
# on 2026-11-16. Zero allowance burn, "model training: not used" with 0-day
# retention in Go's privacy table, and NO region restriction (unlike Beam
# Free, which blocks a country list). Vision-capable (image/jpeg, png,
# webp, gif) with a 1M context. Sits last in go-pool's order so it only
# drains when every paid member and the other free rungs are exhausted.
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMModel
