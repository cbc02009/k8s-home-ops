---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/litellm.home-operations.com/litellmmodel_v1alpha1.json
# OpenCode Go ($10/mo subscription) lane — the cloud rung for coding-agent
# work that outgrows the local Qwen rungs. Provider opencode_go/ requires
# LiteLLM >= v1.109.0 (provider first shipped in v1.109.0-rc.1; NOT in the
# 1.108.x LTS line). Auth: OPENCODE_GO_API_KEY on the proxy (1Password item
# "opencode-go", field api_key, pushed via the litellm ExternalSecret — kept
# separate from the item used for cluster opencode's own cloud sign-in).
# Billing: flat subscription. Each model has a monthly allowance at Go list
# rates ($60 workhorses, $20-30 mid, $15 premium) with a 5h window at 20% of
# monthly; the prices below mirror LiteLLM's built-in opencode_go catalog and
# track allowance burn on the economics dashboard — they are not extra charge.
# Routing: go-pool members carry `order` so the big-allowance cheap models
# drain first and the $15-20 models are rationed last.
# Sessions: LiteLLM forwards x-litellm-session-id as x-opencode-session (the
# envoy filter already maps x-session-id -> x-litellm-session-id); LiteLLM
# does not invent one, so agents that send a stable x-session-id get the
# better prompt-cache behaviour.
# DATA POLICY: Go publishes per-model training/retention terms. Everything in
# this pool is no-training (Beam Free: not used/30d; LongCat 2.5 Free: not
# used/0d; paid endpoints that train on request data are blocked by default
# in the workspace privacy settings). Models that train on prompts in exchange
# for free/discounted tokens — Iceman Contributor Free, Muse Spark 1.x
# Contributor — are deliberately EXCLUDED and must not be added. LongCat 2.5
# Free is hosted in China and needs "Global" regions in the Go workspace
# privacy settings; drop it if that is unacceptable. Contrast with free-pool
# (OpenRouter :free), which is banned from coding/agentic keys.
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMModel
metadata:
  name: go-pool-glm-5.3-flash
spec:
  modelName: go-pool
  proxyRef: litellm
  params:
    model: opencode_go/glm-5.3-flash
    apiKey: os.environ/OPENCODE_GO_API_KEY
    additional:
      order: 1
      max_parallel_requests: 4
  info:
    mode: chat
    maxInputTokens: 1000000
    maxOutputTokens: 131072
    supportsFunctionCalling: true
    supportsVision: true
    supportsPromptCaching: true
    extra:
      input_cost_per_token: 1.5e-07
      output_cost_per_token: 5e-07
      cache_read_input_token_cost: 3e-08
---
