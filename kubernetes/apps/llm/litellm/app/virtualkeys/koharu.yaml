---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/litellm.home-operations.com/litellmvirtualkey_v1alpha1.json
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMVirtualKey
metadata:
  name: koharu
spec:
  proxyRef: litellm
  keyAlias: Koharu
  secretName: litellm-key-koharu
  secretKey: api-key
  # Koharu runs its own OCR and inpainting as local models; only the LLM
  # translation goes through the proxy, to the local Qwen.
  models:
  - qwen3.8-27b
---
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: koharu
spec:
  secretStoreRefs:
  - name: onepassword-connect
    kind: ClusterSecretStore
  selector:
    secret:
      name: litellm-key-koharu
  data:
  - match:
      secretKey: api-key
      remoteRef:
        remoteKey: litellm
        property: koharu_api_key
