---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: litellm
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: litellm
    creationPolicy: Owner
    template:
      data:
        LITELLM_MASTER_KEY: "{{ .master_key }}"
        DATABASE_URL: "postgresql://{{ .pg_user }}:{{ .pg_pass }}@postgres-ai-rw.databases.svc.cluster.local/litellm"
        OPENROUTER_API_KEY: "{{ .openrouter_api_key }}"
        OPENCODE_GO_API_KEY: "{{ .opencode_go_api_key }}"
        ZAI_API_KEY: "{{ .zai_api_key }}"
        GENERIC_CLIENT_ID: "{{ .oidc_id }}"
        GENERIC_CLIENT_SECRET: "{{ .oidc_secret }}"
        # Lens gateway connection (kubernetes/apps/llm/lens/); shared values
        # from the `litellm-lens` 1Password item, also consumed by the Lens app.
        LITELLM_LENS_SERVICE_TOKEN: "{{ .lens_service_token }}"
        LENS_GATEWAY_SECRET: "{{ .lens_gateway_secret }}"
  dataFrom:
    - extract:
        key: litellm
    - extract:
        key: openrouter
      rewrite:
        - regexp:
            source: "(.*)"
            target: "openrouter_$1"
    - extract:
        key: opencode-go
      rewrite:
        - regexp:
            source: "(.*)"
            target: "opencode_go_$1"
    - extract:
        key: zai
      rewrite:
        - regexp:
            source: "(.*)"
            target: "zai_$1"
  data:
    - secretKey: lens_service_token
      remoteRef:
        key: litellm-lens
        property: service-token
    - secretKey: lens_gateway_secret
      remoteRef:
        key: litellm-lens
        property: gateway-secret
