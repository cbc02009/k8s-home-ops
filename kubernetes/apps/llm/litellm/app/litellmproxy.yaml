---
# yaml-langauge-server $schema=https://k8s-schemas.home-operations.com/litellm.home-operations.com/litellmproxy_v1alpha1.json
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMProxy
metadata:
  name: litellm
spec:
  applyMode: file
  # Overlay image built by cbc02009/container-images (apps/litellm): upstream
  # v1.109.1 + two fixes the opencode_go overlay carries. The
  # get_model_response_iterator_for_request override on
  # OpenCodeGoMessagesChatConfig: without it, OpenAI-wire streaming to
  # /v1/messages-protocol Go models (minimax-m3, qwen3.8-max,
  # claude-haiku-5-5) dies mid-stream with 'NoneType' object is not an
  # iterator → APIConnectionError 500 (LiteLLMModelFailover alerts). The
  # transform_request override on OpenCodeGoChatConfig strips replayed
  # per-message `reasoning`/`reasoning_content` fields: OpenCode Go 400s
  # (unsupported_parameter: messages[N].reasoning) on unmapped
  # /v1/chat/completions rungs (e.g. beam-free) replaying Anthropic wire
  # turns, which tanked free-pool. Drop the overlay once
  # https://github.com/BerriAI/litellm/issues/51666 ships in a release;
  # Renovate tracks the base version in container-images and proposes the
  # :rolling digest bump here on rebuild.
  image: ghcr.io/cbc02009/litellm:rolling@sha256:8c1c39f40d5ee7534b4d25ef9001c53b7a1a035cd8df648807ab681bb879a533
  replicas: 2
  # Roll the gateway whenever the litellm Secret (envFrom below) changes —
  # the operator's config-hash only covers the CR spec, so ExternalSecret
  # rotations (1Password refresh, Lens credential pair) would otherwise sit
  # unused until the next spec edit. Same mechanism as the other llm apps.
  podAnnotations:
    reloader.stakater.com/auto: "true"
  service:
    port: 4000
    type: ClusterIP
  route:
    hostnames:
      - ${HOSTNAME}
    parentRefs:
      - name: envoy-internal
        namespace: network
        sectionName: https
    filters:
      - type: RequestHeaderModifier
        requestHeaderModifier:
          set:
            - name: x-litellm-session-id
              value: '%REQ(x-session-id)%'
  # OIDC SSO via authentik: the litellm UI login redirects to the `litellm`
  # authentik application (auth.ctec.run). Client credentials come from the
  # litellm 1Password item (oidc_id/oidc_secret) via the ExternalSecret; the
  # litellm_role claim (group-mapped in authentik) sets the UI role:
  # proxy_admin for the litellm-admin group, internal_user otherwise (values
  # must match LiteLLM's LitellmUserRoles enum). AUTO_REDIRECT_UI_LOGIN_TO_SSO
  # skips the login form and bounces visitors straight into authentik.
  env:
    - name: AUTO_REDIRECT_UI_LOGIN_TO_SSO
      value: 'true'
    # Lens connection (see kubernetes/apps/llm/lens/): the gateway calls the
    # in-cluster Lens service directly and shows agents the public ingestion
    # URL. LITELLM_LENS_SERVICE_TOKEN / LENS_GATEWAY_SECRET arrive via the
    # litellm ExternalSecret (same 1Password item fields Lens consumes).
    - name: LITELLM_LENS_URL
      value: http://lens.llm.svc.cluster.local:4318
    - name: LITELLM_LENS_PUBLIC_URL
      value: https://lens.ctec.run
    - name: DATABASE_URL
      valueFrom:
        secretKeyRef:
          name: litellm
          key: DATABASE_URL
    - name: GENERIC_AUTHORIZATION_ENDPOINT
      value: https://auth.ctec.run/application/o/authorize/
    - name: GENERIC_SCOPE
      value: openid email profile litellm_role
    - name: GENERIC_TOKEN_ENDPOINT
      value: https://auth.ctec.run/application/o/token/
    - name: GENERIC_USERINFO_ENDPOINT
      value: https://auth.ctec.run/application/o/userinfo/
    - name: GENERIC_USER_ROLE_ATTRIBUTE
      value: litellm_role
    - name: LITELLM_LOG
      value: INFO
    - name: LITELLM_MODE
      value: PRODUCTION
    # /v1/messages on OpenAI-family deployments defaults to the Responses API
    # (/v1/responses), which the local nvidia-router-proxy (vLLM) does not
    # serve — every auto-router SIMPLE/MEDIUM turn 404'd ('404 page not
    # found'). Route those through chat/completions instead: verified to
    # stream correctly with thinking blocks on the 27B lanes.
    - name: LITELLM_USE_CHAT_COMPLETIONS_URL_FOR_ANTHROPIC_MESSAGES
      value: 'true'
    - name: PROXY_BASE_URL
      value: https://litellm.ctec.run
    - name: PROXY_LOGOUT_URL
      value: https://auth.ctec.run/application/o/end-session/
    - name: REDIS_HOST
      value: litellm-dragonfly-db
    - name: REDIS_PORT
      value: '6379'
  envFrom:
    - secretRef:
        name: litellm
  resources:
    requests:
      cpu: 100m
      memory: 2304Mi
    limits:
      memory: 2304Mi
  livenessProbe:
    httpGet:
      path: /
      port: 4000
    initialDelaySeconds: 5
    periodSeconds: 10
    failureThreshold: 30
  readinessProbe:
    httpGet:
      path: /
      port: 4000
    initialDelaySeconds: 5
    periodSeconds: 10
    failureThreshold: 3
  volumes:
    - name: cache
      emptyDir: {}
    - name: ui
      persistentVolumeClaim:
        claimName: litellm
  volumeMounts:
    - name: cache
      mountPath: /app/cache
    - name: ui
      mountPath: /app/chatgpt_tokens
  routerSettings:
    redis_host: os.environ/REDIS_HOST
    redis_port: os.environ/REDIS_PORT
    routing_strategy: simple-shuffle
    cooldown_time: 300
    # 2026-11-22 20:13-20:51Z: swarmui preempted the 27B's 4090 and the
    # 27B hung on LLMKube's 240s activation budget until it 503'd (83
    # activation failures, TTFT p95 274-285s) — yet the 503s never cooled
    # the rung out: the default 5xx rule (50% of 5+ in a minute) cannot
    # accumulate at the homelab's 1-3 req/min, so the dead 27B stayed in
    # the weighted rotation for the full 38-minute park. allowed_fails: 1
    # cools a deployment for one cooldown cycle (30s) after any 2 failures
    # within that window: a dead rung drops out within one or two traffic
    # cycles and a recovering model re-enters just as fast. 429/401/404
    # count toward the same limit (the old instant-cooldown on 429 becomes
    # the same 2-strike rule).
    allowed_fails: 1
    enable_pre_call_checks: true
    fallbacks:
      # The 2026-11-18 burn audit: while every paid lane's first fallback was
      # zai-pool, the non-rolling Z.AI credits absorbed the lanes' overflow
      # (12-15 $/day on the 11-17/18 heavy days) even though the free local
      # 27B pool was healthy. Every paid lane now falls to the free pool
      # first (Go's zero-allowance free rungs) and keeps zai-pool
      # as the last-resort rung, so the Z.AI credits only burn when the
      # local floor is itself saturated. Since 2026-11-22 the floor is
      # free-pool, and since 2026-11-25 it is Go's free rungs only (the
      # 27B rung left the pools; a SwarmUI-held GPU can no longer stall
      # the floor) — the bare local-pool lane has no consumers.
      # workhorse-pool is the cloud lane and (since it absorbed the go-chat lane)
      # the vision lane: when the Go window dries, text traffic lands on
      # the free pool first; image-bearing requests 4xx on the non-vision
      # Beam Free and continue to zai-pool, whose GLM-5.3 rung is
      # vision-capable — so vision workloads still survive a Go outage.
      - workhorse-pool:
          - free-pool
          - zai-pool
      - frontier-pool:
          - workhorse-pool
          - free-pool
          - zai-pool
      - reasoning-pool:
          - free-pool
          - zai-pool
      - implementation-pool:
          - free-pool
          - zai-pool
      # The complexity router's own floor: the pooled lane first (its Z.AI
      # co-primary rungs only fire when the lane's local primary cools), then
      # the plain local pool.
      - auto:
          - implementation-pool
          - free-pool
      # The Z.AI lane is itself a fallback target, so it needs its own floor:
      # when the Coding Plan's window is dry too, the free rungs catch it.
      - zai-pool:
          - free-pool
  litellmSettings:
    success_callback:
      - prometheus
    failure_callback:
      - prometheus
    prometheus_adapter: true
    require_auth_for_metrics_endpoint: false
    cache: true
    cache_params:
      type: redis
      host: os.environ/REDIS_HOST
      port: os.environ/REDIS_PORT
      ttl: 300
      supported_call_types:
        - embedding
        - aembedding
    request_timeout: 900
    num_retries: 2
    retry_after: 5
    set_verbose: false
    # Hermes sends agent-level params (e.g. reasoning_effort) to every lane;
    # the opencode_go rungs don't accept them, so those requests 400'd and
    # hermes's COMPLEX turns silently degraded to the local 27B after two
    # failed Go rungs (alert: auto -> reasoning-pool UnsupportedParamsError).
    # Drop unsupported params instead — only affects requests that would
    # otherwise 400; explicitly allowed params (local lanes) still pass.
    drop_params: true
  generalSettings:
    health_check_endpoint: /v1/health
    store_model_in_db: false
    # Enable the Lens agent-tracing store: registers the LensExporter spend
    # callback (records per-call cost records into Lens) and serves the
    # /lens/* proxy routes to the standalone Lens service. No-op until the
    # Lens service itself is reachable.
    tracing:
      store:
        type: lens
  extraConfig:
    environment:
      - REDIS_HOST
      - REDIS_PORT
  apiAccess:
    masterKeyRef:
      name: litellm
      key: LITELLM_MASTER_KEY
