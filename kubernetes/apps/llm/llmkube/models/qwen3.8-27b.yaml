---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/inference.llmkube.dev/model_v1alpha1.json
apiVersion: inference.llmkube.dev/v1alpha1
kind: Model
metadata:
  name: qwen3.8-27b
spec:
  source: "dbirks/Qwen3.8-27B-W4A16-AutoRound"
  sourceSecretRef:
    name: huggingface
  format: safetensors
  quantization: compressed-tensors
  hardware:
    accelerator: cuda
    gpu:
      enabled: true
      vendor: nvidia
      count: 1
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/inference.llmkube.dev/inferenceservice_v1alpha1.json
apiVersion: inference.llmkube.dev/v1alpha1
kind: InferenceService
metadata:
  name: qwen3.8-27b
  labels:
    krr/ignore: "true"
spec:
  modelRef: qwen3.8-27b
  runtime: vllm
  image: ghcr.io/syv-ai/hyperqwen@sha256:e0e4f9db81c0ce6eda3089d1df445fd50b1abdac8ae92c6eb985b498ec4fd7a4
  command:
    - bash
    - docker/entrypoint.sh
  args:
    - single
  skipModelInit: true
  rolloutPolicy:
    waitForIdle: true
    idleTimeoutSeconds: 86400
  runtimeClassName: nvidia
  priorityClassName: gpu-preemptible
  nodeSelector:
    topology.kubernetes.io: dgpu
  env:
    - name: MODEL
      value: /app/models/Qwen3.8-27B-W4A16-AutoRound
    - name: BASE_MODEL_DIR
      value: /app/models/Qwen3.8-27B-W4A16-AutoRound
    - name: HF_REPO
      value: dbirks/Qwen3.8-27B-W4A16-AutoRound
    - name: FAST_VARIANT
      value: "0"
    - name: SPEC
      value: mtp
    - name: CTX
      value: long
    - name: GPU_UTIL
      value: "0.93"
    - name: MAX_SEQS
      value: "8"
    - name: MAX_LEN
      # 147456 -> 131072. The KV pool on this hybrid is sized by max-model-len
      # (Qwen3.8-27B is 48/64 linear-attention layers, so the bf16 Mamba state
      # pins the uniform page and --kv-cache-dtype fp8 buys ~nothing: see
      # vllm-project/vllm#55196). At 147456 the pool held 169,273 tokens —
      # kv_cache_max_concurrency 1.15, i.e. barely ONE request at a time,
      # while the live prompt histogram is 74% in the 50k-100k band. Cutting
      # the ceiling to 128k returns that headroom to the pool without
      # rejecting any observed request (max observed prompt bucket is the
      # 100k-Inf band; see the vllm request_prompt_tokens histogram).
      value: "131072"
    - name: PREFIX_CACHE
      value: "1"
    # Throughput knobs for the long-prefill workload. The launcher hardcodes
    # --max-num-batched-tokens 2048, which is far below vLLM's own guidance
    # (">= 8192" for optimal throughput) and leaves the GPU idle on the 50k+
    # prompts this server actually serves. EXTRA_ARGS expands last in the
    # launcher's argv, so it overrides the hardcoded value (the launcher only
    # warns about --max-num-batched-tokens on the CTX=huge residency path,
    # which we are not on).
    - name: EXTRA_ARGS
      value: >-
        --max-num-batched-tokens 8192 --long-prefill-token-threshold 1024
    - name: DFLASH2
      value: "0"
    - name: VERIFY
      value: "0"
    - name: HOST
      value: "0.0.0.0"
    - name: NVIDIA_DRIVER_CAPABILITIES
      value: compute,utility
    - name: HF_TOKEN
      valueFrom:
        secretKeyRef:
          name: huggingface
          key: HF_TOKEN
  resources:
    gpu: 1
    cpu: "2"
    memory: 28Gi
  extraVolumes:
    - name: models
      persistentVolumeClaim:
        claimName: llmkube-mayne-cache
    - name: shm
      emptyDir:
        medium: Memory
        sizeLimit: 24Gi
  extraVolumeMounts:
    - name: models
      mountPath: /app/models
      subPath: vllm-27b
    - name: models
      mountPath: /cache
      subPath: vllm-27b-cache
    - name: shm
      mountPath: /dev/shm
  endpoint:
    port: 18020
    type: ClusterIP
  probeOverrides:
    startup:
      tcpSocket:
        port: 18020
      periodSeconds: 2
      failureThreshold: 1800
    liveness:
      tcpSocket:
        port: 18020
      initialDelaySeconds: 60
      periodSeconds: 30
      failureThreshold: 6
    readiness:
      httpGet:
        path: /health
        port: 18020
      initialDelaySeconds: 0
      periodSeconds: 10
      failureThreshold: 6
  tolerations:
    - key: llm-workload
      operator: Exists
      effect: NoSchedule
