---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/inference.llmkube.dev/model_v1alpha1.json
apiVersion: inference.llmkube.dev/v1alpha1
kind: Model
metadata:
  name: qwen3.8-27b
spec:
  source: "dbirks/Qwen3.8-27B-W4A16-AutoRound"
  sourceSecretRef:
    name: huggingface
  format: safetensors
  quantization: compressed-tensors
  hardware:
    accelerator: cuda
    gpu:
      enabled: true
      vendor: nvidia
      count: 1
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/inference.llmkube.dev/inferenceservice_v1alpha1.json
apiVersion: inference.llmkube.dev/v1alpha1
kind: InferenceService
metadata:
  name: qwen3.8-27b
  labels:
    krr/ignore: "true"
spec:
  modelRef: qwen3.8-27b
  runtime: vllm
  image: ghcr.io/syv-ai/hyperqwen@sha256:e0e4f9db81c0ce6eda3089d1df445fd50b1abdac8ae92c6eb985b498ec4fd7a4
  command:
    - bash
    - docker/entrypoint.sh
  args:
    - single
  skipModelInit: true
  rolloutPolicy:
    waitForIdle: true
    idleTimeoutSeconds: 86400
  runtimeClassName: nvidia
  priorityClassName: gpu-preemptible
  nodeSelector:
    topology.kubernetes.io: dgpu
  env:
    - name: MODEL
      value: /app/models/Qwen3.8-27B-W4A16-AutoRound
    - name: BASE_MODEL_DIR
      value: /app/models/Qwen3.8-27B-W4A16-AutoRound
    - name: HF_REPO
      value: dbirks/Qwen3.8-27B-W4A16-AutoRound
    - name: FAST_VARIANT
      value: "0"
    - name: SPEC
      value: mtp
    - name: CTX
      value: long
    - name: GPU_UTIL
      # 0.93 -> 0.88. The KV pool is sized by GPU_UTIL (the image's gotcha 35:
      # "the pool is sized by GPU_UTIL"), and the pool competes with the
      # engine's non-KV working set -- the GDN/linear-attention forward, the
      # CUDA graphs, and the per-seat runner buffers. At 0.93 the KV pool
      # took 5.12 GiB and left only 41 MiB of free VRAM, and the engine died
      # with torch.OutOfMemoryError inside fla_chunk_gated_delta_rule on the
      # first real request (gotcha 35: the engine needs non-KV headroom for
      # its first real batch).
      #
      # 0.88 is the measured-safe floor for 8 seats on a 24 GiB card: the
      # image's own table puts the floor between 396 and 436 MiB of free
      # headroom at 8 seats, and its rule of thumb is "keep ~2 GB of VRAM
      # free". The cost is a smaller KV pool (~4.4 GiB instead of 5.12 GiB,
      # so ~120k tokens instead of ~140-169k) -- but a pool that survives a
      # request is worth more than a pool that OOMs the engine.
      value: "0.88"
    - name: MAX_SEQS
      value: "8"
    - name: MAX_LEN
      # Left at the launcher's CTX=long default. The KV pool on this card is
      # sized by GPU_UTIL, not by max-model-len (the image's gotcha 35: "do
      # not chase the context back with MAX_LEN, since the pool is sized by
      # GPU_UTIL"), so lowering this only shrinks the pool and the reported
      # per-request concurrency -- it does not buy anything.
      value: "147456"
    - name: PREFIX_CACHE
      value: "1"
    # Throughput knobs for the long-prefill workload. The launcher hardcodes
    # --max-num-batched-tokens 2048; EXTRA_ARGS expands last in the launcher's
    # argv, so it overrides that value.
    #
    # 4096, NOT 8192: on a 24 GiB card at GPU_UTIL=0.93 an 8192-token prefill
    # batch OOMs the GDN (linear-attention) forward on the first real request
    # -- fla_chunk_gated_delta_rule tried to allocate 176 MiB with 41 MiB free
    # (see the engine's torch.OutOfMemoryError). The image's gotcha 35 is
    # explicit that the engine needs non-KV headroom for its first real batch,
    # and at GPU_UTIL=0.93 there is only ~41 MiB. 4096 is the largest step
    # that fits; 2048 is the launcher's measured default.
    # --long-prefill-token-threshold 1024 caps the long-prefill share so one
    # 50k+ prompt cannot starve the decode batch.
    - name: EXTRA_ARGS
      value: >-
        --max-num-batched-tokens 4096 --long-prefill-token-threshold 1024
    - name: DFLASH2
      value: "0"
    - name: VERIFY
      value: "0"
    - name: HOST
      value: "0.0.0.0"
    - name: NVIDIA_DRIVER_CAPABILITIES
      value: compute,utility
    - name: HF_TOKEN
      valueFrom:
        secretKeyRef:
          name: huggingface
          key: HF_TOKEN
  resources:
    gpu: 1
    cpu: "2"
    memory: 28Gi
  extraVolumes:
    - name: models
      persistentVolumeClaim:
        claimName: llmkube-mayne-cache
    - name: shm
      emptyDir:
        medium: Memory
        sizeLimit: 24Gi
  extraVolumeMounts:
    - name: models
      mountPath: /app/models
      subPath: vllm-27b
    - name: models
      mountPath: /cache
      subPath: vllm-27b-cache
    - name: shm
      mountPath: /dev/shm
  endpoint:
    port: 18020
    type: ClusterIP
  probeOverrides:
    startup:
      tcpSocket:
        port: 18020
      periodSeconds: 2
      failureThreshold: 1800
    liveness:
      tcpSocket:
        port: 18020
      initialDelaySeconds: 60
      periodSeconds: 30
      failureThreshold: 6
    readiness:
      httpGet:
        path: /health
        port: 18020
      initialDelaySeconds: 0
      periodSeconds: 10
      failureThreshold: 6
  tolerations:
    - key: llm-workload
      operator: Exists
      effect: NoSchedule
