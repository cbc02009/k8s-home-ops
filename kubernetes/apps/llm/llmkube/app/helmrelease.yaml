---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: llmkube
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: llmkube
  values:
    modelCache:
      enabled: true
      mode: shared
      accessMode: ReadWriteMany
      storageClass: ceph-filesystem
      size: 200Gi
      # Git-declared (app/llmkube-model-cache.yaml) instead of Helm-created so
      # the 200Gi ceph-filesystem volume survives the ai -> llm namespace
      # rename via PV rebind (volumeName) instead of a full re-download.
      existingClaim: llmkube-model-cache
    prometheus:
      inferencePodMonitor:
        enabled: true
    controllerManager:
      tolerations:
        - key: llm-workload
          operator: Exists
          effect: NoSchedule
