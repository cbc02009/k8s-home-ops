---
# yaml-language-server $schema=https://k8s-schemas.home-operations.com/core/persistentvolumeclaim_v1.json
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: llmkube-mayne-cache
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: openebs-hostpath
  # Pinned to the PV that was zero-copy rebound from the `ai` namespace
  # during the ai -> llm rename. The claim already exists with this
  # volumeName; declaring it keeps the git object in sync with the live one
  # (PVC spec is immutable for bound claims).
  volumeName: pvc-823b1c1c-f3e3-4efe-8073-31534ebc5295
  resources:
    requests:
      storage: 200Gi
