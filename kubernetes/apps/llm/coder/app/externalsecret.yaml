---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &app coder
spec:
  refreshInterval: 1h0m0s
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    creationPolicy: Owner
    deletionPolicy: Retain
    name: *app
    template:
      data:
        # Postgres Init
        INIT_POSTGRES_DBNAME: coder
        INIT_POSTGRES_HOST: "postgres-ai-rw.databases.svc.cluster.local"
        INIT_POSTGRES_SUPER_PASS: "{{ .postgres_super_pass }}"
        INIT_POSTGRES_USER: "{{ .pg_user }}"
        INIT_POSTGRES_PASS: "{{ .pg_pass }}"
        # Coder
        CODER_PG_CONNECTION_URL: "postgresql://{{ .pg_user }}:{{ .pg_pass }}@postgres-ai-rw.databases.svc.cluster.local/coder"
        # OIDC (authentik application "Coder")
        CODER_OIDC_CLIENT_ID: "{{ .oidc_id }}"
        CODER_OIDC_CLIENT_SECRET: "{{ .oidc_secret }}"
      engineVersion: v2
      mergePolicy: Replace
  dataFrom:
    - extract:
        key: postgres
      rewrite:
        - regexp:
            source: "(.*)"
            target: "postgres_$1"
    - extract:
        key: coder
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
# The "opencode" memini API key (shared namespace with local opencode and the
# cluster opencode agent). Mounted into Coder workspace pods by the kubernetes
# template so the workspace's opencode uses the same memory pool.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: memini-key-opencode
spec:
  refreshInterval: 1h0m0s
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    creationPolicy: Owner
    deletionPolicy: Retain
    name: memini-key-opencode
    template:
      data:
        api-key: "{{ .opencode_api_key }}"
      engineVersion: v2
      mergePolicy: Replace
  dataFrom:
    - extract:
        key: memini
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
# Personal dev credentials mounted into Coder workspace pods by the
# kubernetes template: kubeconfig (cluster access), the personal sops age key
# (direnv/sops workflows), an SSH key for GitHub, and git identity.
# Sourced from two 1Password items: the shared "coder" item (which also holds
# the Postgres/OIDC fields for the Coder server) and the "coder-github-key"
# SSH item. Fields are mapped explicitly - no whole-item extract - so the
# workspace Secret carries only the dev fields, and a missing field fails the
# ExternalSecret loudly instead of rendering an empty value.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: coder-workspace
spec:
  refreshInterval: 1h0m0s
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    creationPolicy: Owner
    deletionPolicy: Retain
    name: coder-workspace
  data:
    # NOTE: external-secrets v2 renamed remoteRef.remoteKey -> remoteRef.key
    # (the CRD rejects the old name).
    # Dev fields on the shared "coder" item (the coder ExternalSecret's
    # Replace-policy template ignores them on the server side).
    - secretKey: kubeconfig
      remoteRef:
        key: coder
        property: kubeconfig
    - secretKey: age_key
      remoteRef:
        key: coder
        property: age_key
    # The 1Password SSH item type has built-in field labels containing spaces
    # ("private key"), which are invalid as k8s Secret keys - so
    # dataFrom.extract does not work for it. remoteRef.property must match
    # the field label exactly.
    - secretKey: ssh_private
      remoteRef:
        key: coder-github-key
        property: "private key"
    - secretKey: ssh_public
      remoteRef:
        key: coder-github-key
        property: "public key"
