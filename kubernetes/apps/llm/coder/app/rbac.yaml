---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/v1/serviceaccount_v1.json
# ServiceAccount used by Coder workspace pods. The only cluster resources it
# may read are the API key secrets and the personal dev credentials bundle
# (kubeconfig/age/ssh), which the template mounts at /run/secrets.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: coder-workspace
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/rbac.authorization.k8s.io/role_v1.json
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: coder-workspace
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["litellm-key-coder", "memini-key-opencode", "coder-workspace"]
    verbs: ["get"]
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/rbac.authorization.k8s.io/rolebinding_v1.json
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: coder-workspace
subjects:
  - kind: ServiceAccount
    name: coder-workspace
    namespace: llm
roleRef:
  kind: Role
  name: coder-workspace
  apiGroup: rbac.authorization.k8s.io
