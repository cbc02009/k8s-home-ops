---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/litellm.home-operations.com/litellmvirtualkey_v1alpha1.json
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMVirtualKey
metadata:
  name: coder
spec:
  proxyRef: litellm
  keyAlias: Coder
  secretName: litellm-key-coder
  secretKey: api-key
  models:
  # NOTE: no free-pool here — OpenRouter :free models may train on prompts,
  # and coding/agentic keys must never send repo data to them. Cloud coding
  # lanes are the OpenCode Go groups (no-training policy, see opencode-go.yaml).
  - implementation-pool
  - qwen3.8-27b
  - qwen3.8-27b-chat
  - go-pool
  - go-coder
  - go-strong
---
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: coder
spec:
  secretStoreRefs:
  - name: onepassword-connect
    kind: ClusterSecretStore
  selector:
    secret:
      name: litellm-key-coder
  data:
  - match:
      secretKey: api-key
      remoteRef:
        remoteKey: litellm
        property: coder_api_key
