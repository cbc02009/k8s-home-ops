---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/litellm.home-operations.com/litellmvirtualkey_v1alpha1.json
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMVirtualKey
metadata:
  name: coder
spec:
  proxyRef: litellm
  keyAlias: Coder
  secretName: litellm-key-coder
  secretKey: api-key
  models:
  # Cloud coding lanes are the OpenCode Go groups only (no-training policy,
  # see opencode-go.yaml) — repo data never goes to third-party free models.
  - implementation-pool
  - qwen3.8-27b
  - qwen3.8-27b-chat
  - go-pool
  - go-coder
  - go-strong
  # Z.AI Coding Plan lane: the mutual fallback for the Go lanes (its weekly
  # credits do not roll over, so the traffic is wanted, not just tolerated).
  - zai-pool
---
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: coder
spec:
  secretStoreRefs:
  - name: onepassword-connect
    kind: ClusterSecretStore
  selector:
    secret:
      name: litellm-key-coder
  data:
  - match:
      secretKey: api-key
      remoteRef:
        remoteKey: litellm
        property: coder_api_key
