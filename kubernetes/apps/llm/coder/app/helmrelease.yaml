# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app coder
spec:
  interval: 1h
  chart:
    spec:
      chart: *app
      version: 2.39.0
      sourceRef:
        kind: HelmRepository
        name: coder-charts
  values:
    coder:
      env:
        - name: CODER_ACCESS_URL
          value: "https://${HOSTNAME}"
        - name: CODER_PG_CONNECTION_URL
          valueFrom:
            secretKeyRef:
              name: *app
              key: CODER_PG_CONNECTION_URL
        - name: CODER_PROMETHEUS_ADDRESS
          value: "0.0.0.0:2112"
        - name: CODER_OAUTH2_GITHUB_DEFAULT_PROVIDER_ENABLE
          value: "false"
        # OIDC login via authentik (application "Coder", see terraform/authentik)
        - name: CODER_OIDC_ISSUER_URL
          value: "https://auth.ctec.run/application/o/coder/"
        - name: CODER_OIDC_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: *app
              key: CODER_OIDC_CLIENT_ID
        - name: CODER_OIDC_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: *app
              key: CODER_OIDC_CLIENT_SECRET
        - name: CODER_OIDC_SCOPES
          value: "openid,profile,email,offline_access"
        - name: CODER_OIDC_SIGN_IN_TEXT
          value: "Log in with authentik"
        - name: CODER_OIDC_ICON_URL
          value: "https://auth.ctec.run/static/dist/assets/icons/icon.svg"
        # Authentik OIDC is the only way in: disable built-in email/password login.
        - name: CODER_PASSWORD_ENABLE
          value: "false"
      replicaCount: 1
      initContainers:
        - name: init-db
          image: ghcr.io/home-operations/postgres-init:18.6.0
          envFrom:
            - secretRef:
                name: *app
      httproute:
        enable: true
        host: coder.ctec.run
        parentRefs:
          - name: envoy-internal
            namespace: network
  install:
    createNamespace: false
  upgrade:
    crds: CreateReplace
