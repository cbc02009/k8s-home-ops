---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app home-assistant
  namespace: home
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: *app
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    externalSecrets:
      home-assistant:
        secretStoreRef:
          kind: ClusterSecretStore
          name: onepassword-connect
        target:
          name: *app
          creationPolicy: Owner
          template:
            engineVersion: v2
            data:
              # Home Assistant
              RECORDER_DB_URL: "postgresql://{{ .pg_user }}:{{ .pg_pass }}@postgres-rw.databases.svc.cluster.local/home_assistant"
              HASS_TOKEN: "{{ .vscode_token }}"

              # Postgres Init
              INIT_POSTGRES_SUPER_PASS: "{{ .postgres_super_pass }}"
              INIT_POSTGRES_PASS: "{{ .pg_pass }}"
              INIT_POSTGRES_USER: "{{ .pg_user }}"
              INIT_POSTGRES_HOST: "{{ .postgres_host }}"
              INIT_POSTGRES_DBNAME: "home_assistant"
        dataFrom:
          - extract:
              key: home-assistant
          - extract:
              key: postgres
            rewrite:
              - regexp:
                  source: "(.*)"
                  target: "postgres_$1"
    controllers:
      *app :
        annotations:
          reloader.stakater.com/auto: "true"
        initContainers:
          01-init-db:
            image:
              repository: ghcr.io/home-operations/postgres-init
              tag: '18.6.0'
            envFrom:
              - secretRef:
                  name: *app
        containers:
          app:
            image:
              repository: ghcr.io/home-operations/home-assistant
              tag: 2026.10.4
            env:
              VENV_FOLDER: /venv
              TZ: ${CONFIG_TZ}
              POSTGRES_HOST: postgres-rw.databases.svc.cluster.local
              POSTGRES_DB: home_assistant
            envFrom:
              - secretRef:
                  name: *app
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 10m
              limits:
                memory: 2Gi
          code-server:
            image:
              repository: ghcr.io/coder/code-server
              tag: 4.143.1@sha256:377b66bec5645510ed52549bb00e648c273edc604d230a3f90fd2b2433afcb97
            args:
              - --auth
              - none
              - --disable-telemetry
              - --disable-update-check
              - --user-data-dir
              - /config/.code-server
              - --extensions-dir
              - /config/.code-server
              - --port
              - "12321"
              - /config
            env:
              HASS_SERVER: http://localhost:8123
              HASS_TOKEN:
                secretKeyRef:
                  name: *app
                  key: HASS_TOKEN
            resources:
              requests:
                cpu: 100m
                memory: 1Gi
              limits:
                memory: 2Gi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: ${APP_UID}
        runAsGroup: ${APP_GID}
        fsGroup: ${APP_GID}
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: { type: RuntimeDefault }

    route:
      app:
        hostnames:
          - ${HOSTNAME}
        parentRefs:
          - name: envoy-internal
            namespace: network
        rules:
          - backendRefs:
              - name: "{{ .Release.Name }}"
                port: &port 8123
      codeserver:
        hostnames:
          - hass-code.ctec.run
        parentRefs:
          - name: envoy-internal
            namespace: network
        rules:
          - backendRefs:
              - name: "{{ .Release.Name }}"
                port: &codeserverPort 12321
    service:
      app:
        primary: true
        type: LoadBalancer
        sessionAffinity: ClientIP
        annotations:
          lbipam.cilium.io/ips: ${IP}
        ports:
          http:
            port: *port
      code-server:
        ports:
          code-server:
            port: *codeserverPort

    persistence:
      config:
        existingClaim: *app
        advancedMounts:
          home-assistant:
            app:
              - path: /config
            code-server:
              - path: /config
      hass-cache:
        existingClaim: hass-cache
        advancedMounts:
          home-assistant:
            app:
              - path: /venv
                subPath: hass-venv
      tmpfs:
        type: emptyDir
        advancedMounts:
          home-assistant:
            app:
              - path: /tmp
                subPath: hass-tmp
              - path: /config/logs
                subPath: logs
              - path: /config/tts
                subPath: tts
            code-server:
              - path: /tmp
                subPath: code-server-tmp
              - path: /nonexistent
                subPath: nonexistent
