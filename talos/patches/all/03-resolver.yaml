---
apiVersion: v1alpha1
kind: ResolverConfig
nameservers:
  - address: 10.0.2.1
searchDomains:
  disableDefault: false
hostDNS:
  enabled: true
  forwardKubeDNSToHost: true # Requires Cilium socketLB features
  resolveMemberNames: true
---
apiVersion: v1alpha1
kind: TimeSyncConfig
enabled: true
ntp:
  servers: ["time.cloudflare.com"]
  useNTS: true
