---
# One-shot cross-namespace restore: ai/hermes -> llm/hermes.
# Applied by 02-window.sh before the cutover, deleted by 04-cleanup.sh.
#
# The source policy `ai/hermes` still has fresh hourly snapshots in the `nas`
# ClusterRepository, and kopia identities are `<policy>@<namespace>:/pvc/<name>`,
# so a cross-ns restore must pin BOTH the namespace and the source path
# explicitly (the component's Restore omits both because it is same-ns).
#
# target.pvc: the operator creates llm/hermes (identical immutable spec to the
# git-declared component PVC) and restores into it. It is deliberately not
# owned by this Restore, so the later flux apply of the component PVC
# (dataSourceRef -> the new llm Restore) is a no-op on the already-Bound claim.
apiVersion: kopiur.home-operations.com/v1alpha1
kind: Restore
metadata:
  name: hermes
  namespace: llm
spec:
  mover:
    securityContext:
      runAsUser: 10000
      runAsGroup: 10000
  policy:
    onMissingSnapshot: Continue
  repository:
    kind: ClusterRepository
    name: nas
  source:
    fromPolicy:
      name: hermes
      namespace: ai
      offset: 0
      sourcePath: /pvc/hermes
  target:
    pvc:
      name: hermes
      capacity: 20Gi
      storageClassName: ceph-block
      accessModes:
        - ReadWriteOnce
