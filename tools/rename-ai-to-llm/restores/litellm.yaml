---
# One-shot cross-namespace restore: ai/litellm -> llm/litellm.
# The 1Gi RWX ceph-filesystem volume holds litellm's Postgres (model registry,
# virtual keys for karakeep/mealie/...). Applied by 02-window.sh before the
# cutover, deleted by 04-cleanup.sh. See restores/hermes.yaml for the full
# rationale of this cross-ns Restore shape.
apiVersion: kopiur.home-operations.com/v1alpha1
kind: Restore
metadata:
  name: litellm
  namespace: llm
spec:
  mover:
    securityContext:
      runAsUser: 2000
      runAsGroup: 2000
  policy:
    onMissingSnapshot: Continue
  repository:
    kind: ClusterRepository
    name: nas
  source:
    fromPolicy:
      name: litellm
      namespace: ai
      offset: 0
      sourcePath: /pvc/litellm
  target:
    pvc:
      name: litellm
      capacity: 1Gi
      storageClassName: ceph-filesystem
      accessModes:
        - ReadWriteMany
