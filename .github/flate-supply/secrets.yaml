---
# yaml-language-server: $schema=https://json.schemastore.org/kubernetes-definitions.json
# Dummy Secrets supplied to flate for offline rendering.
# These bootstrap-only Secrets are created by bootstrap/kustomize/personal/
# and do not exist in the kubernetes/ tree, so flate cannot read them offline.
apiVersion: v1
kind: Secret
metadata:
  name: cloudflare-account-id-secret
  namespace: databases
stringData:
  CLOUDFLARE_ACCOUNT_ID: ""
---
apiVersion: v1
kind: Secret
metadata:
  name: cloudflare-tunnel-id-secret
  namespace: network
stringData:
  CLOUDFLARE_TUNNEL_ID: ""
