---
# yaml-language-server: $schema=https://json.schemastore.org/kubernetes-definitions.json
# Dummy Secrets supplied to flate for offline rendering.
# These Secrets are created during bootstrap in bootstrap/kustomize/personal/
# and exist in the live cluster, but they are not part of the Flux-managed
# kubernetes/ tree, so flate cannot read them from the offline render path.
apiVersion: v1
kind: Secret
metadata:
  name: cloudflare-account-id-secret
  namespace: databases
stringData:
  CLOUDFLARE_ACCOUNT_ID: ""
---
apiVersion: v1
kind: Secret
metadata:
  name: cloudflare-tunnel-id-secret
  namespace: network
stringData:
  CLOUDFLARE_TUNNEL_ID: ""
