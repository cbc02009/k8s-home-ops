---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Flate

on:
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  filter-changes:
    name: Filter changes
    runs-on: ubuntu-latest
    outputs:
      changed-files: ${{ steps.changed-files.outputs.changed_files }}
    steps:
      - name: Get changed files
        id: changed-files
        uses: bjw-s-labs/action-changed-files@147be9638332cf68fd60714a610509d7a9360d60 # v0.7.0
        with:
          patterns: |-
            kubernetes/**/*

  test:
    if: ${{ needs.filter-changes.outputs.changed-files != '[]' }}
    name: Flate Test
    runs-on: ubuntu-latest
    needs:
      - filter-changes
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # base: "" keeps the action's FLATE_BASE unset so `test` renders the
      # full tree instead of the action's changed-only default.
      - name: Setup flate
        uses: home-operations/flate/action@4e07f351352d235a335e5a1f0a088eab7ec40997 # v0.8.0
        with:
          base: ""
          version: "0.7.3"
          cache: true

      # --allow-missing-kinds Secret: soft-skip source-auth / Helm valuesFrom
      # Secrets that only materialize in the live cluster. The two bootstrap
      # Secrets are supplied below so Kustomization substituteFrom resolves.
      - name: Run flate test
        run: flate test all --path kubernetes/flux/cluster --allow-missing-kinds Secret --supply .github/flate-supply/secrets.yaml --no-progress

  diff:
    if: ${{ needs.filter-changes.outputs.changed-files != '[]' }}
    name: Flate Diff
    runs-on: ubuntu-latest
    needs:
      - filter-changes
    permissions:
      contents: read
      pull-requests: write
    strategy:
      matrix:
        resources:
          - helmrelease
          - kustomization
      max-parallel: 4
      fail-fast: false
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup flate
        uses: home-operations/flate/action@4e07f351352d235a335e5a1f0a088eab7ec40997 # v0.8.0
        with:
          base: main
          version: "0.7.3"
          cache: true

      - name: Run flate diff
        run: flate diff ${{ matrix.resources }} --path kubernetes/flux/cluster --allow-missing-kinds Secret --supply .github/flate-supply/secrets.yaml --no-progress -o github > diff.txt

      - name: Generate Diff
        id: diff
        run: |
          # Comment and summary are written from a file and truncated: PRs that
          # install a new chart (CRDs included) diff over 1MB, past the 128KB
          # single-arg limit (E2BIG), the 1024k step-summary cap and the 65,536
          # character comment limit. The full diff stays in the job log.
          if [[ -s diff.txt ]]; then
            echo "has_diff=true" >> "$GITHUB_OUTPUT"

            size=$(wc -c < diff.txt)
            {
              echo "## Flate ${{ matrix.resources }} diff"
              echo '```diff'
              head -c 60000 diff.txt
              echo '```'
              if (( size > 60000 )); then
                echo "> Diff truncated at 60KB ($size bytes total). Full output in the 'Run flate diff' step log."
              fi
            } > comment.md

            cat comment.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Generate Token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        if: ${{ github.event.pull_request.head.repo.full_name == github.repository && steps.diff.outputs.has_diff == 'true' }}
        id: app-token
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}

      - if: ${{ steps.diff.outputs.has_diff == 'true' }}
        name: Add Comment
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          header: ${{ github.event.pull_request.number }}/kubernetes/${{ matrix.resources }}
          path: comment.md

  flate-success:
    needs:
      - test
      - diff
    if: ${{ !cancelled() }}
    name: Flate successful
    runs-on: ubuntu-latest
    steps:
      - name: Check job status
        if: ${{ contains(needs.*.result, 'failure') }}
        run: exit 1
