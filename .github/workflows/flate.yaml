---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Flate

on:
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  filter-changes:
    name: Filter changes
    runs-on: ubuntu-latest
    outputs:
      changed-files: ${{ steps.changed-files.outputs.changed_files }}
    steps:
      - name: Get changed files
        id: changed-files
        uses: bjw-s-labs/action-changed-files@147be9638332cf68fd60714a610509d7a9360d60 # v0.7.0
        with:
          patterns: |-
            kubernetes/**/*

  test:
    if: ${{ needs.filter-changes.outputs.changed-files != '[]' }}
    name: Flate Test
    runs-on: ubuntu-latest
    needs:
      - filter-changes
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # base: "" keeps the action's FLATE_BASE unset so `test` renders the
      # full tree instead of the action's changed-only default.
      - name: Setup flate
        uses: home-operations/flate/action@631b76b69c4e58c6f4d1cb01e23616fa61aebafa # v0.6.5
        with:
          base: ""
          version: "0.6.5"
          cache: true

      # --allow-missing-secrets: the two bootstrap Secrets
      # (cloudflare-account-id-secret, cloudflare-tunnel-id-secret) only exist
      # in bootstrap/kustomize/personal/, not in this tree.
      - name: Run flate test
        run: flate test all --path kubernetes/flux/cluster --allow-missing-secrets --no-progress

  diff:
    if: ${{ needs.filter-changes.outputs.changed-files != '[]' }}
    name: Flate Diff
    runs-on: ubuntu-latest
    needs:
      - filter-changes
    permissions:
      contents: read
      pull-requests: write
    strategy:
      matrix:
        resources:
          - helmrelease
          - kustomization
      max-parallel: 4
      fail-fast: false
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup flate
        uses: home-operations/flate/action@631b76b69c4e58c6f4d1cb01e23616fa61aebafa # v0.6.5
        with:
          base: main
          version: "0.6.5"
          cache: true

      - name: Run flate diff
        run: flate diff ${{ matrix.resources }} --path kubernetes/flux/cluster --allow-missing-secrets --no-progress -o github > diff.txt

      - name: Generate Diff
        id: diff
        run: |
          if [[ -s diff.txt ]]; then
            {
              echo 'diff<<EOF'
              cat diff.txt
              echo EOF
            } >> "$GITHUB_OUTPUT"

            {
              echo "## Flate ${{ matrix.resources }} diff"
              echo '```diff'
              cat diff.txt
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Generate Token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        if: ${{ github.event.pull_request.head.repo.full_name == github.repository && steps.diff.outputs.diff != '' }}
        id: app-token
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}

      - if: ${{ steps.diff.outputs.diff != '' }}
        name: Add Comment
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          header: ${{ github.event.pull_request.number }}/kubernetes/${{ matrix.resources }}
          message: |
            ```diff
            ${{ steps.diff.outputs.diff }}
            ```

  flate-success:
    needs:
      - test
      - diff
    if: ${{ !cancelled() }}
    name: Flate successful
    runs-on: ubuntu-latest
    steps:
      - name: Check job status
        if: ${{ contains(needs.*.result, 'failure') }}
        run: exit 1
